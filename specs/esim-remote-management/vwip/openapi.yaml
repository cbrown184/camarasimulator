        protocol:
          $ref: "#/components/schemas/Protocol"
        sink:
          type: string
          pattern: "^https?://[a-zA-Z0-9\\-._~:/?#\\[\\]@!$&'()*+,;=]{1,256}$"
          maxLength: 256
          example: "https://endpoint.example.com/sink"
          description: >-
            Callback address for asynchronous notification delivery. Accepted and
            validated (surface form), but delivery is a documented cut.
        types:
          type: array
          maxItems: 10
          items:
            type: string
            pattern: '^[a-zA-Z0-9_\-]{1,64}$'
            maxLength: 64
            description: Event type identifier.
          description: List of subscribed event types. Accepted for fidelity.
        config:
          $ref: "#/components/schemas/ProfileDownloadReq"

    ProfileDownloadReq:
      type: object
      description: Configuration for the profile-download request.
