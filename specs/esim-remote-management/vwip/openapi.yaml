          example: Profile download and enable accepted
        config:
          $ref: "#/components/schemas/ProfileDownloadResp"

    ProfileDownloadResp:
      type: object
      description: The echoed configuration of the accepted profile download.
      properties:
        subscriptionDetail:
          type: object
          description: The device and download options the command targeted.
          properties:
            eId:
              type: string
              pattern: '^[A-Fa-f0-9]{32}$'
              maxLength: 64
              description: The device EID, echoed from the request.
              example: "A1B2C3D4E5F600000000000000000001"
            imei:
              type: string
              pattern: '^[0-9]{15}$'
              maxLength: 32
              description: >-
                The device IMEI — echoed if supplied, else synthesised
                deterministically from the eId.
              example: "356938035643809"
            iccid:
              type: string
              pattern: '^[0-9]{19,20}$'
              maxLength: 32
              description: >-
                The target profile's ICCID — echoed if supplied, else synthesised
                from the eId.
              example: "8931089011234567890"
            autoEnableType:
              type: integer
              format: int32
              minimum: 1
              maximum: 1
              description: "The download-and-activate option, echoed when supplied."
              example: 1
        initialEvent:
          type: boolean
          description: Echoed from the request when supplied.
        subscriptionMaxEvents:
          type: integer
          format: int32
          minimum: 1
          maximum: 1000
