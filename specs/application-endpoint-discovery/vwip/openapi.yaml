# CamaraSim — Application Endpoint Discovery, API version vwip (CAMARA work-in-progress).
#
# Vendored from the CAMARA Application Endpoint Discovery API
# (application-endpoint-discovery) and annotated with CamaraSim's parameter-driven
# functional cases (docs/DESIGN.md §7, §9). Backed by
# `src/apis/application_endpoint_discovery/vwip.rs`; spec and code must not drift.
#
# Application Endpoint Discovery has no released version yet — its upstream `main`
# spec is versioned `wip` — so, like Optimal Edge Discovery / Device Data Volume,
# its canonical base path is literally `vwip`. A numbered version will be added
# when CAMARA cuts a release.
#
# Serves `POST /retrieve-optimal-app-endpoints` (`getOptimalAppEndpoints`): the
# optimal application endpoint(s) (port + IP/FQDN) for the identified device.
openapi: 3.0.3
info:
  title: Application Endpoint Discovery
  description: |
    Returns the optimal application **endpoint(s)** — the concrete `port` and IP
    address(es) or FQDN of the application instance(s) with the shortest network
    path to the device — that a given end-user's device should connect to. Where
    Simple / Optimal Edge Discovery answer with an edge cloud **zone**,
    Application Endpoint Discovery returns the direct link to the application's
    endpoint within that zone, so a developer can connect a client straight to it.

    This is the CamaraSim reference double for CAMARA Application Endpoint
    Discovery (work-in-progress). The caller names the application — `appId` (an
    app onboarded via Edge Application Management) or `applicationEndpointsId`
    (endpoints registered via Edge Application Registration) — and identifies the
    device either by the `device` object in the request body (two-legged / CIBA)
    or by the identity a three-legged access token authenticated (in which case
    `device` is omitted). The endpoint requires the
    `application-endpoint-discovery:app-endpoints:read` scope.

    ## Identifier resolution (two-legged vs three-legged)

    The `device` object is only meaningful in two-legged auth. In a three-legged
    token the device is already identified by the token subject:

    - `device` carries an identifier **and** the token subject is itself an E.164
      line (a device-authenticated three-legged token) →
      `422 UNNECESSARY_IDENTIFIER`.
    - `device` carries an identifier, subject not a line → that identifier is
      used (two-legged). Precedence: `phoneNumber` → `networkAccessIdentifier` →
      the IPv4 `publicAddress` → `ipv6Address`.
    - `device` absent, subject is an E.164 line → the subject is the identifier
      (three-legged).
    - `device` absent **and** the subject is not a line → the device cannot be
      identified → `422 MISSING_IDENTIFIER`.
    - `device` present but carrying **no** identifier (`minProperties: 1`
      violated) → `400 INVALID_ARGUMENT`.

    ## Functional cases — the input is the control plane (docs/DESIGN.md §7)

    Two planes drive the answer:

    1. **Application identifier** (structural, checked first). Exactly one of
       `appId` / `applicationEndpointsId` is required and must be a UUID. Neither,
       both, or a non-UUID value → `400 INVALID_ARGUMENT`. (Canonical CAMARA uses
       `anyOf`, allowing one *or* both; CamaraSim requires **exactly one** so the
       echoed identifier is unambiguous — a documented divergence.) The
       application identifier's trailing three digits `d` then drive the endpoint
       set: `…000` → the application / its endpoints are **not registered** →
       `404 NOT_FOUND`; otherwise `(d % 3) + 1` endpoints (1–3) are returned.
    2. **Device reserved error suffix**. Once the device identifier is resolved, if
       its trailing three digits name a reserved CAMARA status the endpoint answers
       with that canonical CAMARA error (shared convention — see the referenced
       `errors.yaml`): `…400`, `…401`, `…403`, `…404`, `…409`, `…422`, `…429`,
       `…500`, `…503`. Checked **first** among the business planes (before the
       application-not-found `404`), so the device `404 IDENTIFIER_NOT_FOUND` /
       `429` / … cases are reachable here.

    Each returned endpoint is deterministic from the application identifier and its
    rank: a rotating address family (`fqdn` / a single `ipv4Addresses` / a single
    `ipv6Addresses` — a 3-endpoint answer exercises all three), a `port`, an
    `edgeCloudZone`, and a description. So the same request always returns the same
    endpoints.

    The response echoes the `device` (CAMARA `DeviceResponse`, which carries only
    `phoneNumber`) **only when the request `device` carried multiple identifiers**
    (faithful to the CAMARA rule "only included when multiple device identifiers
    come in the request") and one of them is a `phoneNumber`; otherwise `device` is
    omitted. `applicationServerProviderName` is always returned.

    Examples: `appId …012` → 1 endpoint (fqdn); `appId …014` → 3 endpoints (all
    three address families); `appId …000` → `404 NOT_FOUND`;
    `device.phoneNumber +123456789404` → `404 NOT_FOUND` (device not found).
  version: "wip"
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: "{apiRoot}/application-endpoint-discovery/vwip"
    variables:
      apiRoot:
        default: http://localhost:8080
        description: API root, e.g. the CamaraSim base URL.

paths:
  /retrieve-optimal-app-endpoints:
    post:
      operationId: getOptimalAppEndpoints
      summary: Return the endpoint(s) of the optimal application instance(s)
      description: |
        Returns the endpoint(s) of the application instance(s) with the shortest
        network path to the device identified in the request. Name the application
        with exactly one of `appId` / `applicationEndpointsId`; supply a `device`,
        or omit it to use the device identified by a three-legged access token.

        See the API description for the identifier-resolution rules and the
        parameter-driven functional cases.
      security:
        - openId:
            - application-endpoint-discovery:app-endpoints:read
      parameters:
        - $ref: "#/components/parameters/XCorrelator"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EndpointDiscoveryInfo"
      responses:
        "200":
          description: The optimal application endpoint(s) for the identified device.
          headers:
            x-correlator:
              $ref: "#/components/headers/XCorrelator"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EndpointDiscoveryResult"
              examples:
                single:
                  summary: A single endpoint (appId …012, fqdn family)
                  value:
                    applicationEndpoints:
                      - port: 1036
                        fqdn: app-1a2b3c4d.edge.camarasim.example.com
                        edgeCloudZone:
                          edgeCloudZoneId: "5d803d3f-e8dc-4e1a-9f7e-2a4c9c0d3b21"
                          edgeCloudZoneName: camarasim-edge-eu-west-1
                          edgeCloudProvider: CamaraSim Edge
                          edgeCloudRegion: eu-west-1
                          edgeCloudZoneStatus: active
                        applicationEndpointDescription: Optimal application endpoint #1 for the requested application.
                    appId: "3fa85f64-5717-4562-b3fc-2c963f66a012"
                    applicationServerProviderName: CamaraSim Edge
        "400":
          description: |
            400 — bad request. CamaraSim returns `INVALID_ARGUMENT` for a malformed
            body, a missing/both/non-UUID application identifier, an empty `device`,
            or a bad `phoneNumber`.
          headers:
            x-correlator:
              $ref: "#/components/headers/XCorrelator"
          content:
            application/json:
              schema:
                $ref: "../../shared/errors.yaml#/components/schemas/CamaraError"
              examples:
                invalidArgument:
                  summary: Missing application identifier
                  value:
                    status: 400
                    code: INVALID_ARGUMENT
                    message: "One of `appId` / `applicationEndpointsId` is required."
        "401":
          $ref: "../../shared/errors.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../../shared/errors.yaml#/components/responses/PermissionDenied"
        "404":
          description: |
            404 — not found. CamaraSim returns the shared `NOT_FOUND` for an
            application identifier ending `…000` (the application / its endpoints
            are not registered), or for a device identifier with the reserved
            `…404` suffix (device not found).
          headers:
            x-correlator:
              $ref: "#/components/headers/XCorrelator"
          content:
            application/json:
              schema:
                $ref: "../../shared/errors.yaml#/components/schemas/CamaraError"
              examples:
                notFound:
                  summary: Application not registered (…000) / reserved `…404`
                  value:
                    status: 404
                    code: NOT_FOUND
                    message: The specified resource was not found.
        "409":
          $ref: "../../shared/errors.yaml#/components/responses/Conflict"
        "422":
          description: |
            422 — unprocessable. CamaraSim returns `MISSING_IDENTIFIER` when the
            device cannot be identified (no `device` and a non-line subject),
            `UNNECESSARY_IDENTIFIER` when a `device` is submitted on a three-legged
            device token, or the reserved shared `SERVICE_NOT_APPLICABLE` for the
            `…422` suffix.
          headers:
            x-correlator:
              $ref: "#/components/headers/XCorrelator"
          content:
            application/json:
              schema:
                $ref: "../../shared/errors.yaml#/components/schemas/CamaraError"
              examples:
                missingIdentifier:
                  summary: The device cannot be identified
                  value:
                    status: 422
                    code: MISSING_IDENTIFIER
                    message: The device cannot be identified.
                unnecessaryIdentifier:
                  summary: The device is already identified by the token
                  value:
                    status: 422
                    code: UNNECESSARY_IDENTIFIER
                    message: The device is already identified by the access token.
        "429":
          $ref: "../../shared/errors.yaml#/components/responses/TooManyRequests"
        "500":
          $ref: "../../shared/errors.yaml#/components/responses/Internal"
        "503":
          $ref: "../../shared/errors.yaml#/components/responses/Unavailable"
      x-camarasim-scenarios:
        description: >-
          The application endpoints are selected from the application identifier
          (exactly one of appId / applicationEndpointsId) whose trailing three
          digits `d` drive the endpoint set (docs/DESIGN.md §7): `…000` → 404
          (application not registered), else `(d % 3) + 1` endpoints (1–3), each
          with a rotating address family, a port and an edge cloud zone. The device
          identifier (the first present device identifier, else the access token
          subject) adds the shared reserved-error plane, checked first among the
          business planes. Canonical Application Endpoint Discovery (wip) declares
          404 IDENTIFIER_NOT_FOUND (device) and 404 NOT_FOUND (unknown app/endpoints)
          plus the 422 IDENTIFIER sub-cases; CamaraSim maps the device 404 onto the
          shared reserved-suffix convention, the app-not-found onto the `…000` tail,
          and models the identifier-resolution 422s, exposing the full shared error
          set so every reserved case is reachable.
        cases:
          - input: neither / both `appId` and `applicationEndpointsId`, or a non-UUID value
            result: "400 INVALID_ARGUMENT"
          - input: "application identifier ending in …000"
            result: "404 NOT_FOUND (application / endpoints not registered)"
          - input: "application identifier ending in tail d (not 000)"
            result: "200 — (d % 3) + 1 endpoints, deterministic from the identifier"
          - input: device identifier ending in a reserved error suffix (e.g. …404)
            result: the canonical CAMARA error for that status (checked before the app lookup)
          - input: "`device` present but carrying no identifier"
            result: "400 INVALID_ARGUMENT"
          - input: "`device` with multiple identifiers incl. a phoneNumber"
            result: "200 — the DeviceResponse (phoneNumber) is echoed"
          - input: "`device` with a single identifier, or a three-legged token"
            result: "200 — the DeviceResponse is omitted"
          - input: "`device` submitted on a three-legged line token"
            result: "422 UNNECESSARY_IDENTIFIER"
          - input: no `device` and a non-line token subject
            result: "422 MISSING_IDENTIFIER"

components:
  securitySchemes:
    openId:
      $ref: "../../auth/openapi.yaml#/components/securitySchemes/camaraOAuth"

  parameters:
    XCorrelator:
      name: x-correlator
      in: header
      required: false
      description: Correlation id for the request, echoed back on the response.
      schema:
        type: string

  headers:
    XCorrelator:
      description: The `x-correlator` from the request, echoed if one was sent.
      required: false
      schema:
        type: string

  schemas:
    EndpointDiscoveryInfo:
      type: object
      description: >-
        Retrieve the optimal application endpoint(s) for the identified device.
        Exactly one of `appId` / `applicationEndpointsId` is required (canonical
        CAMARA `anyOf` allows one or both; CamaraSim requires exactly one — a
        documented divergence); `device` is optional (omit it to use the device
        identified by a three-legged access token).
      anyOf:
        - required: [appId]
        - required: [applicationEndpointsId]
      properties:
        device:
          $ref: "#/components/schemas/Device"
        appId:
          $ref: "#/components/schemas/AppId"
        applicationEndpointsId:
          $ref: "#/components/schemas/ApplicationEndpointsId"

    AppId:
      type: string
      format: uuid
      maxLength: 36
      description: >-
        A globally unique identifier for an application onboarded on the Edge
        Cloud (via Edge Application Management). CamaraSim validates it is a UUID;
        its trailing three digits drive the endpoint set.
      example: "3fa85f64-5717-4562-b3fc-2c963f66a012"

    ApplicationEndpointsId:
      type: string
      format: uuid
      maxLength: 36
      description: >-
        A system-defined identifier for one or more registered Application
        Endpoints belonging to the same application (via Edge Application
        Registration). CamaraSim validates it is a UUID; its trailing three
        digits drive the endpoint set.
      example: "4d596ac1-7822-4927-a3c5-d72e1f92a012"

    Device:
      type: object
      description: >-
        Identifies the device. At least one identifier must be present. Optional
        at the request level: omit `device` to use the device identified by a
        three-legged access token. CamaraSim keys its device functional cases off
        the first present identifier, in the order phoneNumber →
        networkAccessIdentifier → ipv4Address.publicAddress → ipv6Address.
      minProperties: 1
      properties:
        phoneNumber:
          type: string
          description: A phone number in E.164 format (starting with `+`).
          pattern: '^\+[1-9][0-9]{4,14}$'
          example: "+123456789012"
        networkAccessIdentifier:
          type: string
          description: A network access identifier assigned by the operator.
          example: "123456789@domain.com"
        ipv4Address:
          $ref: "#/components/schemas/DeviceIpv4Addr"
        ipv6Address:
          type: string
          description: The device's public IPv6 address.
          example: "2001:db8:85a3::8a2e:370:7334"

    DeviceIpv4Addr:
      type: object
      description: >-
        The device's IPv4 address information. CamaraSim reads `publicAddress` as
        the identifier; `privateAddress`/`publicPort` are accepted for fidelity.
      properties:
        publicAddress:
          type: string
          example: "84.125.93.10"
        privateAddress:
          type: string
          example: "192.0.2.25"
        publicPort:
          type: integer
          format: int32
          minimum: 0
          maximum: 65535
          example: 59765

    EndpointDiscoveryResult:
      type: object
      description: >-
        The optimal application endpoint(s) for the identified device, plus the
        echoed application identifier and provider.
      required:
        - applicationEndpoints
      anyOf:
        - required: [appId]
        - required: [applicationEndpointsId]
      properties:
        applicationEndpoints:
          type: array
          minItems: 1
          maxItems: 50
          description: >-
            The optimal application endpoints, best-first. CamaraSim returns
            `(d % 3) + 1` endpoints (1–3), where `d` is the application
            identifier's trailing three digits.
          items:
            $ref: "#/components/schemas/ApplicationEndpoint"
        appId:
          $ref: "#/components/schemas/AppId"
        applicationEndpointsId:
          $ref: "#/components/schemas/ApplicationEndpointsId"
        applicationServerProviderName:
          type: string
          maxLength: 256
          description: The Application Provider identifier (fixed to `CamaraSim Edge`).
          example: CamaraSim Edge
        device:
          $ref: "#/components/schemas/DeviceResponse"

    ApplicationEndpoint:
      type: object
      description: >-
        An application server IP address or FQDN with a port, exposed by an
        application instance on the Edge Cloud. Exactly one address family
        (`fqdn` / `ipv4Addresses` / `ipv6Addresses`) is present, chosen
        deterministically from the application identifier and the endpoint's rank.
      required:
        - port
      anyOf:
        - required: [fqdn]
        - required: [ipv4Addresses]
        - required: [ipv6Addresses]
      properties:
        port:
          type: integer
          format: int32
          minimum: 0
          maximum: 65535
          description: The TCP/UDP port exposed by the application instance.
          example: 1036
        fqdn:
          type: string
          maxLength: 253
          description: Fully Qualified Domain Name exposed by the application instance.
          example: app-1a2b3c4d.edge.camarasim.example.com
        ipv4Addresses:
          type: array
          minItems: 1
          maxItems: 1
          description: A single IPv4 address exposed by the application instance.
          items:
            type: string
            format: ipv4
            example: "198.51.100.1"
        ipv6Addresses:
          type: array
          minItems: 1
          maxItems: 1
          description: A single IPv6 address exposed by the application instance.
          items:
            type: string
            format: ipv6
            example: "2001:db8::1"
        edgeCloudZone:
          $ref: "#/components/schemas/EdgeCloudZone"
        applicationEndpointDescription:
          type: string
          maxLength: 2048
          description: A human-readable description of the application endpoint.
          example: Optimal application endpoint #1 for the requested application.

    EdgeCloudZone:
      type: object
      description: The edge cloud zone the endpoint's application instance runs in.
      required:
        - edgeCloudZoneId
        - edgeCloudZoneName
        - edgeCloudProvider
      properties:
        edgeCloudZoneId:
          type: string
          format: uuid
          description: >-
            A stable, UUID-shaped id derived from the zone name (SHA-256); stable
            per zone.
          example: "5d803d3f-e8dc-4e1a-9f7e-2a4c9c0d3b21"
        edgeCloudZoneName:
          type: string
          maxLength: 64
          example: camarasim-edge-eu-west-1
        edgeCloudProvider:
          type: string
          maxLength: 64
          example: CamaraSim Edge
        edgeCloudRegion:
          type: string
          maxLength: 64
          example: eu-west-1
        edgeCloudZoneStatus:
          type: string
          enum:
            - active
            - inactive
            - unknown
          default: unknown
          example: active

    DeviceResponse:
      type: object
      description: >-
        The device echoed back on a success. Per CAMARA this carries only
        `phoneNumber`, and is included only when the request `device` carried
        multiple identifiers (and one is a `phoneNumber`).
      properties:
        phoneNumber:
          type: string
          pattern: '^\+[1-9][0-9]{4,14}$'
          example: "+123456789012"
