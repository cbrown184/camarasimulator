# CamaraSim — Quality on Demand, API version v1 (CAMARA 1.1.0).
#
# Vendored from the CAMARA Quality-On-Demand API (release r3.2,
# quality-on-demand 1.1.0) and annotated with CamaraSim's parameter-driven
# functional cases (docs/DESIGN.md §7, §9). Backed by
# `src/apis/quality_on_demand/v1.rs` and its in-memory session store; spec and
# code must not drift.
#
# This slice serves `POST /sessions`, `GET /sessions/{sessionId}`, and
# `DELETE /sessions/{sessionId}`. `POST /sessions/{sessionId}/extend`,
# `POST /retrieve-sessions`, and the CloudEvents notifications on `sink` are
# deferred to later passes; the served spec covers only what is implemented.
openapi: 3.0.3
info:
  title: Quality On Demand
  description: |
    Lets an application request a specific quality profile (latency /
    throughput) for the traffic between a device and an application server for a
    bounded duration — the "boost this flow" request behind cloud gaming, live
    video, and real-time control.

    This is the CamaraSim reference double for CAMARA Quality-On-Demand 1.1.0. It
    is a **stateful, resource-oriented** API: `POST /sessions` creates a QoS
    session and returns a `SessionInfo` with a `sessionId`, and
    `GET /sessions/{sessionId}` reads that session back by id. Sessions are held
    in an in-memory store (single node).

    ## Functional cases — the input is the control plane (docs/DESIGN.md §7)

    `createSession` reads three control planes:

    - **The identifier** — the submitted `device` identifier (`phoneNumber`, else
      `networkAccessIdentifier`, else the IPv4 `publicAddress`, else
      `ipv6Address`) or, when no `device` is supplied, the access-token subject.
      If its trailing three digits name a reserved CAMARA status (`…400`, `…401`,
      `…403`, `…404`, `…409`, `…422`, `…429`, `…500`, `…503`) the endpoint answers
      with that canonical CAMARA error (see the referenced `errors.yaml`) — so
      `…409` exercises the QoD `409 CONFLICT` (duplicate-session) case. Otherwise
      the trailing digits pick the grant state: `…000` (and an identifier with no
      digits) → `qosStatus: REQUESTED` (no `startedAt`/`expiresAt` yet); any other
      tail → `qosStatus: AVAILABLE`, granted from now for `duration` seconds.
    - **`duration`** — seconds the session is requested for. `< 1` →
      `400 INVALID_ARGUMENT`; greater than the simulator's fixed QoS-profile
      ceiling of 86400 s (24 h) → `400 QUALITY_ON_DEMAND.DURATION_OUT_OF_RANGE`;
      otherwise `expiresAt = startedAt + duration`.
    - **`qosProfile`** — the requested profile name. A profile whose name (case-
      insensitively) contains `unavailable` →
      `422 QUALITY_ON_DEMAND.QOS_PROFILE_NOT_APPLICABLE`; any other well-formed
      name is accepted.

    `getSession` returns the stored `SessionInfo` (`200`), or `404 NOT_FOUND`
    when no session exists for the id. `deleteSession` evicts the session and
    returns `204 No Content`, or `404 NOT_FOUND` for an unknown id; it emits no
    CloudEvents `DELETE_REQUESTED` notification (notifications are deferred).
  version: "1.1.0"
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: "{apiRoot}/quality-on-demand/v1"
    variables:
      apiRoot:
        default: http://localhost:8080
        description: API root, e.g. the CamaraSim base URL.

paths:
  /sessions:
    post:
      operationId: createSession
      summary: Create a QoS session
      description: |
        Creates a QoS session for the requested `duration`, `qosProfile`, and
        `applicationServer`, and returns its `SessionInfo`. The device is
        identified by the `device` object (two-legged token) or by the access
        token (three-legged). See the API description for the parameter-driven
        functional cases.
      security:
        - openId:
            - quality-on-demand:sessions:create
      parameters:
        - $ref: "#/components/parameters/XCorrelator"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSession"
      responses:
        "201":
          description: The QoS session was created.
          headers:
            x-correlator:
              $ref: "#/components/headers/XCorrelator"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
              examples:
                available:
                  summary: Session granted (AVAILABLE)
                  value:
                    sessionId: "11111111-1111-4111-8111-111111111111"
                    device:
                      phoneNumber: "+123456789012"
                    applicationServer:
                      ipv4Address: "203.0.113.0/24"
                    qosProfile: "QOS_L"
                    duration: 3600
                    qosStatus: AVAILABLE
                    startedAt: "2024-01-01T14:27:08Z"
                    expiresAt: "2024-01-01T15:27:08Z"
                requested:
                  summary: Session pending (REQUESTED — identifier ends in …000)
                  value:
                    sessionId: "22222222-2222-4222-8222-222222222222"
                    device:
                      phoneNumber: "+123456789000"
                    applicationServer:
                      ipv4Address: "203.0.113.0/24"
                    qosProfile: "QOS_L"
                    duration: 60
                    qosStatus: REQUESTED
        "400":
          description: |
            Invalid request. The `code` is one of the generic `INVALID_ARGUMENT`
            (malformed body, missing/invalid field) or the API-specific
            `QUALITY_ON_DEMAND.DURATION_OUT_OF_RANGE` (the requested `duration`
            exceeds the QoS profile's maximum).
          headers:
            x-correlator:
              $ref: "#/components/headers/XCorrelator"
          content:
            application/json:
              schema:
                $ref: "../../shared/errors.yaml#/components/schemas/CamaraError"
              examples:
                invalidArgument:
                  summary: Malformed or missing field
                  value:
                    status: 400
                    code: INVALID_ARGUMENT
                    message: "`qosProfile` is required."
                durationOutOfRange:
                  summary: Duration beyond the profile maximum
                  value:
                    status: 400
                    code: QUALITY_ON_DEMAND.DURATION_OUT_OF_RANGE
                    message: The requested duration is out of the allowed range for the QoS profile.
        "401":
          $ref: "../../shared/errors.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../../shared/errors.yaml#/components/responses/PermissionDenied"
        "404":
          $ref: "../../shared/errors.yaml#/components/responses/NotFound"
        "409":
          $ref: "../../shared/errors.yaml#/components/responses/Conflict"
        "422":
          description: |
            The request cannot be fulfilled for the provided identifier or
            profile. The `code` is one of the generic `SERVICE_NOT_APPLICABLE` /
            `MISSING_IDENTIFIER` or the API-specific
            `QUALITY_ON_DEMAND.QOS_PROFILE_NOT_APPLICABLE` (the requested profile
            is not applicable for this session).
          headers:
            x-correlator:
              $ref: "#/components/headers/XCorrelator"
          content:
            application/json:
              schema:
                $ref: "../../shared/errors.yaml#/components/schemas/CamaraError"
              examples:
                missingIdentifier:
                  summary: No device and the token identifies none
                  value:
                    status: 422
                    code: MISSING_IDENTIFIER
                    message: No `device` supplied and the access token identifies no device.
                qosProfileNotApplicable:
                  summary: Profile not applicable
                  value:
                    status: 422
                    code: QUALITY_ON_DEMAND.QOS_PROFILE_NOT_APPLICABLE
                    message: The requested QoS profile is not applicable for this session.
        "429":
          $ref: "../../shared/errors.yaml#/components/responses/TooManyRequests"
        "500":
          $ref: "../../shared/errors.yaml#/components/responses/Internal"
        "503":
          $ref: "../../shared/errors.yaml#/components/responses/Unavailable"
      x-camarasim-scenarios:
        description: >-
          Result selected from the identifier, `duration`, and `qosProfile`
          (docs/DESIGN.md §7). Reserved error suffixes come from the shared
          convention in errors.yaml. Note: canonical Quality-On-Demand 1.1.0
          declares 400/401/403/404/409/422/429 for this operation; CamaraSim also
          exposes 500/503 so every reserved suffix is reachable (documented
          extension). The three-legged `UNNECESSARY_IDENTIFIER` /
          `UNSUPPORTED_IDENTIFIER` (422) cases and the `INVALID_SINK` (400) case
          are declared by canonical QoD but not selected by an input pattern here
          (documented cut, DESIGN §7); `sink`/`sinkCredential` are accepted for
          schema fidelity but no notification is emitted yet.
        cases:
          - input: identifier ending in a reserved error suffix (e.g. …409)
            result: the canonical CAMARA error for that status (…409 → 409 CONFLICT)
          - input: valid request, identifier tail other than …000
            result: "201 SessionInfo, qosStatus AVAILABLE, startedAt/expiresAt set"
          - input: valid request, identifier tail …000 (or no digits)
            result: "201 SessionInfo, qosStatus REQUESTED, no startedAt/expiresAt"
          - input: duration < 1
            result: "400 INVALID_ARGUMENT"
          - input: duration > 86400
            result: "400 QUALITY_ON_DEMAND.DURATION_OUT_OF_RANGE"
          - input: qosProfile name containing "unavailable"
            result: "422 QUALITY_ON_DEMAND.QOS_PROFILE_NOT_APPLICABLE"
          - input: missing applicationServer/qosProfile/duration, bad phoneNumber, or unknown field
            result: "400 INVALID_ARGUMENT"

  /sessions/{sessionId}:
    get:
      operationId: getSession
      summary: Get a QoS session
      description: |
        Returns the `SessionInfo` for the session identified by `sessionId`, as
        it was created. `404 NOT_FOUND` if no such session exists.
      security:
        - openId:
            - quality-on-demand:sessions:read
      parameters:
        - $ref: "#/components/parameters/XCorrelator"
        - name: sessionId
          in: path
          required: true
          description: The `sessionId` returned by `createSession`.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The session was found.
          headers:
            x-correlator:
              $ref: "#/components/headers/XCorrelator"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
        "401":
          $ref: "../../shared/errors.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../../shared/errors.yaml#/components/responses/PermissionDenied"
        "404":
          $ref: "../../shared/errors.yaml#/components/responses/NotFound"
        "429":
          $ref: "../../shared/errors.yaml#/components/responses/TooManyRequests"
        "500":
          $ref: "../../shared/errors.yaml#/components/responses/Internal"
        "503":
          $ref: "../../shared/errors.yaml#/components/responses/Unavailable"
      x-camarasim-scenarios:
        description: >-
          Keyed on the `sessionId` path parameter against the in-memory store.
        cases:
          - input: a sessionId returned by a prior createSession
            result: "200 SessionInfo (the stored representation)"
          - input: an unknown sessionId
            result: "404 NOT_FOUND"
    delete:
      operationId: deleteSession
      summary: Delete a QoS session
      description: |
        Deletes the session identified by `sessionId`, releasing its QoS grant,
        and returns `204 No Content`. `404 NOT_FOUND` if no such session exists
        (never created, or already deleted). CamaraSim emits no CloudEvents
        `DELETE_REQUESTED` notification — notifications are deferred.
      security:
        - openId:
            - quality-on-demand:sessions:delete
      parameters:
        - $ref: "#/components/parameters/XCorrelator"
        - name: sessionId
          in: path
          required: true
          description: The `sessionId` returned by `createSession`.
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The session was deleted. No response body.
          headers:
            x-correlator:
              $ref: "#/components/headers/XCorrelator"
        "401":
          $ref: "../../shared/errors.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../../shared/errors.yaml#/components/responses/PermissionDenied"
        "404":
          $ref: "../../shared/errors.yaml#/components/responses/NotFound"
        "429":
          $ref: "../../shared/errors.yaml#/components/responses/TooManyRequests"
        "500":
          $ref: "../../shared/errors.yaml#/components/responses/Internal"
        "503":
          $ref: "../../shared/errors.yaml#/components/responses/Unavailable"
      x-camarasim-scenarios:
        description: >-
          Keyed on the `sessionId` path parameter against the in-memory store:
          delete is single-use, so a second delete of the same id is 404.
        cases:
          - input: a sessionId of a session that currently exists
            result: "204 No Content (the session is evicted)"
          - input: an unknown or already-deleted sessionId
            result: "404 NOT_FOUND"

components:
  securitySchemes:
    openId:
      $ref: "../../auth/openapi.yaml#/components/securitySchemes/camaraOAuth"

  parameters:
    XCorrelator:
      name: x-correlator
      in: header
      required: false
      description: Correlation id for the request, echoed back on the response.
      schema:
        type: string

  headers:
    XCorrelator:
      description: The `x-correlator` from the request, echoed if one was sent.
      required: false
      schema:
        type: string

  schemas:
    CreateSession:
      type: object
      description: Request to create a QoS session.
      required:
        - applicationServer
        - qosProfile
        - duration
      properties:
        device:
          $ref: "#/components/schemas/Device"
        applicationServer:
          $ref: "#/components/schemas/ApplicationServer"
        qosProfile:
          type: string
          description: The name of the requested QoS profile.
          minLength: 3
          maxLength: 256
          pattern: '^[a-zA-Z0-9_.-]+$'
          example: "QOS_L"
        duration:
          type: integer
          format: int32
          minimum: 1
          description: >-
            Requested session duration in seconds. CamaraSim caps the (single,
            simulated) profile at 86400 s; a larger value →
            QUALITY_ON_DEMAND.DURATION_OUT_OF_RANGE.
          example: 3600
        devicePorts:
          $ref: "#/components/schemas/PortsSpec"
        applicationServerPorts:
          $ref: "#/components/schemas/PortsSpec"
        sink:
          type: string
          format: uri
          description: >-
            HTTPS callback for CloudEvents notifications. Accepted for schema
            fidelity; CamaraSim does not emit notifications yet.
          example: "https://application-server.example.com/notifications"
        sinkCredential:
          type: object
          description: >-
            Credential the notification callback expects. Accepted for schema
            fidelity but never echoed back (it carries a secret) and not yet used.

    SessionInfo:
      type: object
      description: A QoS session and its current state.
      required:
        - sessionId
        - applicationServer
        - qosProfile
        - duration
        - qosStatus
      properties:
        sessionId:
          type: string
          format: uuid
          description: Opaque, UUID-shaped identifier of the created session.
          example: "11111111-1111-4111-8111-111111111111"
        device:
          $ref: "#/components/schemas/Device"
        applicationServer:
          $ref: "#/components/schemas/ApplicationServer"
        qosProfile:
          type: string
          description: The QoS profile the session was created for.
          example: "QOS_L"
        duration:
          type: integer
          format: int32
          minimum: 1
          description: The session duration in seconds.
          example: 3600
        qosStatus:
          type: string
          description: >-
            The session state. `AVAILABLE` when granted, `REQUESTED` when the
            grant is still pending (CamaraSim: identifier tail …000).
          enum:
            - REQUESTED
            - AVAILABLE
            - UNAVAILABLE
          example: AVAILABLE
        statusInfo:
          type: string
          description: >-
            Reason a session is `UNAVAILABLE`. Not produced by this slice
            (present for schema fidelity).
          enum:
            - DURATION_EXPIRED
            - NETWORK_TERMINATED
            - DELETE_REQUESTED
        startedAt:
          type: string
          format: date-time
          description: When the session was granted. Omitted while `REQUESTED`.
          example: "2024-01-01T14:27:08Z"
        expiresAt:
          type: string
          format: date-time
          description: When the session expires. Omitted while `REQUESTED`.
          example: "2024-01-01T15:27:08Z"
        devicePorts:
          $ref: "#/components/schemas/PortsSpec"
        applicationServerPorts:
          $ref: "#/components/schemas/PortsSpec"
        sink:
          type: string
          format: uri
          description: The notification callback, echoed if one was supplied.

    Device:
      type: object
      minProperties: 1
      description: >-
        The device, identified by at least one property. CamaraSim keys its
        functional cases off the first present identifier, in the order
        phoneNumber, networkAccessIdentifier, ipv4Address.publicAddress,
        ipv6Address. In a `SessionInfo` response at most one identifier is echoed.
      properties:
        phoneNumber:
          type: string
          pattern: '^\+[1-9][0-9]{4,14}$'
          description: Device phone number in E.164 format (starting with `+`).
          example: "+123456789012"
        networkAccessIdentifier:
          type: string
          description: Device network access identifier.
        ipv4Address:
          $ref: "#/components/schemas/DeviceIpv4Addr"
        ipv6Address:
          type: string
          description: Device IPv6 address.

    DeviceIpv4Addr:
      type: object
      minProperties: 1
      description: >-
        The device's IPv4 addressing. CamaraSim reads `publicAddress` as the
        identifier; the other fields are accepted for schema fidelity.
      properties:
        publicAddress:
          type: string
          example: "203.0.113.0"
        privateAddress:
          type: string
        publicPort:
          type: integer
          format: int32
          minimum: 0
          maximum: 65535

    ApplicationServer:
      type: object
      minProperties: 1
      description: The application server, identified by at least one address.
      properties:
        ipv4Address:
          type: string
          description: IPv4 address or subnet (CIDR) of the application server.
          example: "203.0.113.0/24"
        ipv6Address:
          type: string
          description: IPv6 address or subnet of the application server.

    PortsSpec:
      type: object
      minProperties: 1
      description: A set of ports, given as individual ports and/or ranges.
      properties:
        ranges:
          type: array
          items:
            type: object
            required:
              - from
              - to
            properties:
              from:
                type: integer
                format: int32
                minimum: 0
                maximum: 65535
              to:
                type: integer
                format: int32
                minimum: 0
                maximum: 65535
        ports:
          type: array
          items:
            type: integer
            format: int32
            minimum: 0
            maximum: 65535
