# CamaraSim — Device Roaming Status, API version v1 (CAMARA 1.0.0).
#
# Vendored from the CAMARA Device Roaming Status API (device-roaming-status
# 1.0.0) and annotated with CamaraSim's parameter-driven functional cases
# (docs/DESIGN.md §7, §9). Backed by `src/apis/device_roaming_status/v1.rs`;
# spec and code must not drift.
#
# In the Spring25 meta-release the combined CAMARA *Device Status* API was split
# into separate Device Reachability Status and Device Roaming Status APIs, so this
# is mounted under its real published name/version rather than a loose
# "device-status v1" (mirroring the KYC Match v0.3 decision — DESIGN §9).
#
# Serves `POST /retrieve`.
openapi: 3.0.3
info:
  title: Device Roaming Status
  description: |
    Answers whether a device is currently roaming (attached to a visited network
    rather than its home network) and, if so, in which country — the "roaming"
    half of the former CAMARA Device Status API.

    This is the CamaraSim reference double for CAMARA Device Roaming Status
    1.0.0. The device can be identified either by the `device` object in the
    request body (two-legged / CIBA) or by the identity a three-legged access
    token authenticated (in which case `device` is omitted). The endpoint
    requires the `device-roaming-status:read` scope.

    ## Functional cases — the input is the control plane (docs/DESIGN.md §7)

    The identifier is the submitted device identifier (`phoneNumber`, else
    `networkAccessIdentifier`, else the IPv4 `publicAddress`, else `ipv6Address`),
    or — when no `device` is supplied — the access token's subject (`sub`). The
    result is chosen deterministically from that identifier's trailing three
    digits:

    - **Reserved error suffix** — if the identifier's trailing three digits name
      a reserved CAMARA status, the endpoint answers with that canonical CAMARA
      error instead of a result (shared convention — see the referenced
      `errors.yaml`): `…400`, `…401`, `…403`, `…404`, `…409`, `…422`, `…429`,
      `…500`, `…503`.
    - **`…000`** (and an identifier with no trailing digits, such as the
      synthetic `camarasim-user` subject) — the device is on its **home
      network**: `{ roaming: false }`, no country.
    - **any other numeric tail** — the device is **roaming**: `{ roaming: true }`
      plus a `countryCode` (Mobile Country Code) and `countryName` (ISO 3166-1
      alpha-2), chosen from the trailing three digits so the visited country is
      itself a second control plane.

    Examples: `+123456789012` → roaming in Germany (`262`/`DE`); `+123456789011`
    → roaming in Australia (`505`/`AU`); `+123456789000` → not roaming;
    `+123456789404` → `404 NOT_FOUND`.
  version: "1.0.0"
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: "{apiRoot}/device-roaming-status/v1"
    variables:
      apiRoot:
        default: http://localhost:8080
        description: API root, e.g. the CamaraSim base URL.

paths:
  /retrieve:
    post:
      operationId: getRoamingStatus
      summary: Retrieve the roaming status of a device
      description: |
        Returns whether the device is currently roaming and, when it is, the
        visited country (`countryCode` MCC and `countryName` ISO 3166-1 alpha-2).
        Supply a `device`, or omit it to use the device identified by a
        three-legged access token.

        See the API description for the parameter-driven functional cases.
      security:
        - openId:
            - device-roaming-status:read
      parameters:
        - $ref: "#/components/parameters/XCorrelator"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoamingStatusRequest"
      responses:
        "200":
          description: The device's current roaming status.
          headers:
            x-correlator:
              $ref: "#/components/headers/XCorrelator"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoamingStatusResponse"
              examples:
                roaming:
                  summary: Roaming in a visited country (non-zero tail)
                  value:
                    roaming: true
                    countryCode: 262
                    countryName: ["DE"]
                home:
                  summary: On the home network, not roaming (…000 tail)
                  value:
                    roaming: false
        "400":
          $ref: "../../shared/errors.yaml#/components/responses/InvalidArgument"
        "401":
          $ref: "../../shared/errors.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../../shared/errors.yaml#/components/responses/PermissionDenied"
        "404":
          $ref: "../../shared/errors.yaml#/components/responses/NotFound"
        "409":
          $ref: "../../shared/errors.yaml#/components/responses/Conflict"
        "422":
          $ref: "../../shared/errors.yaml#/components/responses/ServiceNotApplicable"
        "429":
          $ref: "../../shared/errors.yaml#/components/responses/TooManyRequests"
        "500":
          $ref: "../../shared/errors.yaml#/components/responses/Internal"
        "503":
          $ref: "../../shared/errors.yaml#/components/responses/Unavailable"
      x-camarasim-scenarios:
        description: >-
          Result selected from the identifier (the first present device
          identifier, else the access token subject) whose trailing three digits
          drive the case (docs/DESIGN.md §7). Reserved error suffixes come from
          the shared convention in errors.yaml. When roaming, the visited country
          is COUNTRIES[digits % 6] over the fixed table
          [(262,DE),(234,GB),(208,FR),(310,US),(440,JP),(505,AU)]. Note:
          canonical Device Roaming Status 1.0.0 declares 400/401/403/404/422/429/
          503; CamaraSim exposes the full shared error set so every reserved case
          is reachable (409/500 are CamaraSim extensions). The optional
          `lastStatusTime` is not modelled (omitted). A supplied `device` is used
          as-is; CamaraSim does not model the three-legged IDENTIFIER_MISMATCH /
          UNNECESSARY_IDENTIFIER 422 sub-cases.
        cases:
          - input: identifier ending in a reserved error suffix (e.g. …404)
            result: the canonical CAMARA error for that status
          - input: "identifier ending in …000, or with no trailing digits"
            result: "200 { roaming: false }"
          - input: "identifier with any other numeric tail (e.g. …012)"
            result: '200 { roaming: true, countryCode: <MCC>, countryName: [<ISO2>] }'
          - input: "`device` present but carrying no identifier"
            result: "400 INVALID_ARGUMENT"
          - input: no `device` and no token subject
            result: "422 MISSING_IDENTIFIER"

components:
  securitySchemes:
    openId:
      $ref: "../../auth/openapi.yaml#/components/securitySchemes/camaraOAuth"

  parameters:
    XCorrelator:
      name: x-correlator
      in: header
      required: false
      description: Correlation id for the request, echoed back on the response.
      schema:
        type: string

  headers:
    XCorrelator:
      description: The `x-correlator` from the request, echoed if one was sent.
      required: false
      schema:
        type: string

  schemas:
    RoamingStatusRequest:
      type: object
      description: Request to retrieve a device's roaming status.
      properties:
        device:
          $ref: "#/components/schemas/Device"

    Device:
      type: object
      description: >-
        Identifies the device. At least one identifier must be present. Optional
        at the request level: omit `device` to use the device identified by a
        three-legged access token. CamaraSim keys its functional cases off the
        first present identifier, in the order phoneNumber → networkAccessIdentifier
        → ipv4Address.publicAddress → ipv6Address.
      minProperties: 1
      properties:
        phoneNumber:
          type: string
          description: A phone number in E.164 format (starting with `+`).
          pattern: '^\+[1-9][0-9]{4,14}$'
          example: "+123456789012"
        networkAccessIdentifier:
          type: string
          description: A network access identifier assigned by the operator.
          example: "user012@example.com"
        ipv4Address:
          $ref: "#/components/schemas/DeviceIpv4Addr"
        ipv6Address:
          type: string
          description: The device's IPv6 address.
          example: "2001:db8::11"

    DeviceIpv4Addr:
      type: object
      description: >-
        The device's IPv4 address information. CamaraSim reads `publicAddress` as
        the identifier; `privateAddress`/`publicPort` are accepted for fidelity.
      properties:
        publicAddress:
          type: string
          example: "203.0.113.12"
        privateAddress:
          type: string
          example: "192.0.2.25"
        publicPort:
          type: integer
          format: int32
          minimum: 0
          maximum: 65535
          example: 59765

    RoamingStatusResponse:
      type: object
      description: A device's current roaming status.
      required:
        - roaming
      properties:
        roaming:
          type: boolean
          description: >-
            `true` if the device is currently roaming on a visited network,
            `false` when it is on its home network.
        lastStatusTime:
          type: string
          format: date-time
          description: >-
            Last time the device's roaming status was updated. Optional in CAMARA
            Device Roaming Status 1.0.0; CamaraSim does not model it and omits it.
        countryCode:
          type: integer
          description: >-
            The Mobile Country Code (MCC) of the visited country. Present only
            when the device is roaming.
          example: 262
        countryName:
          type: array
          description: >-
            The ISO 3166-1 alpha-2 country code(s) mapped to the MCC of the
            visited country. Present only when the device is roaming.
          items:
            type: string
          example: ["DE"]
