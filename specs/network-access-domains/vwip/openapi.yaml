# CamaraSim — Network Access Domains, API version vwip
# (CAMARA NetworkAccessManagement / Network Access Domains, wip).
#
# Vendored from the CAMARA NetworkAccessManagement "Network Access Domains" API
# (work-in-progress — no released version yet, so mounted at its canonical `vwip`
# base path `/network-access-domains/vwip`, like its sibling Network Access
# Devices and the other pre-1.0 wip APIs) and annotated with CamaraSim's
# functional cases (docs/DESIGN.md §7, §9). Backed by
# `src/apis/network_access_domains/vwip.rs`; spec and code must not drift.
#
# So far this vendored slice serves two read-only endpoints:
#   * `GET /trust-domains/capabilities` (getTrustDomainCapabilities) — the
#     provider-level capabilities document describing which Trust Domain access
#     types and policy limits this API provider supports. It has no request body
#     and no device identifier, so — unlike the identifier-keyed APIs — it carries
#     no reserved-error scenario plane: it always answers the same fixed document.
#   * `GET /services` (getServices) — the caller's Services catalog. It has no
#     request body either, but it is keyed to the authenticated identity, so its
#     control plane is the token subject (DESIGN §7): a reserved error suffix →
#     the canonical CAMARA error; else the subject's trailing three digits fix the
#     returned ServiceList deterministically.
# It also serves the single-service `GET /services/{serviceId}` read
# (getService), the stateful Trust Domain create leg
# `POST /trust-domains` (createTrustDomain), its read-back
# `GET /trust-domains/{trustDomainId}` (getTrustDomain), its in-place update leg
# `PATCH /trust-domains/{trustDomainId}` (updateTrustDomain), and its delete leg
# `DELETE /trust-domains/{trustDomainId}` (deleteTrustDomain), backed by the
# in-memory trust-domain store. The Trust Domain Device sub-resource has its
# create leg `POST /trust-domains/{trustDomainId}/devices`
# (createTrustDomainDevice) and its read leg
# `GET /trust-domains/{trustDomainId}/devices/{deviceId}`
# (getTrustDomainDevice), backed by an in-memory device store keyed by
# (trustDomainId, deviceId); the device list/update/delete legs remain to be
# added in later slices.
openapi: 3.0.3
info:
  title: Network Access Domains
  description: |
    Service for configuring **home-network access domains** — Trust Domains that
    group devices under a common access policy (Wi-Fi or Thread) on the
    subscriber's home network. This is part of the CAMARA Home Devices family and
    the CamaraSim reference double for the CAMARA NetworkAccessManagement
    "Network Access Domains" API (wip).

    ## `GET /trust-domains/capabilities`

    Returns the set of Trust Domain configuration capabilities the API provider
    supports: which access types (Wi-Fi WPA-Personal/Enterprise, Thread) and
    their properties, plus the policy limits (max devices, per-domain
    up/downstream bandwidth bands, egress-list constraints) a caller may configure
    when creating a Trust Domain. It requires the `network-access-domains:trust-domains`
    scope.

    ## `GET /services`

    Returns the caller's **Services** catalog — a `ServiceList` of the logical
    commercial subscriptions / account relationships the authenticated identity
    holds, each tied to a `serviceSite` (a subscriber location). It requires the
    `network-access-domains:services:read` scope.

    ## `GET /services/{serviceId}`

    Returns a single **Service** from that catalog by id. It requires the same
    `network-access-domains:services:read` scope.

    ## `POST /trust-domains`

    Creates a **Trust Domain** for one of the caller's services (a `serviceId`, a
    `name`, an `enabled` flag, and 1-4 `accessDetails`), mints a server-assigned
    `trustDomainId`, and returns the full `TrustDomain` (`201`). It requires the
    `network-access-domains:trust-domains` scope. This is CamaraSim's first
    stateful Trust Domain leg — the created Trust Domain is held in an in-memory
    store so later read/update/delete legs can address it.

    ## `GET /trust-domains/{trustDomainId}`

    Reads a **Trust Domain** back by the server-assigned `trustDomainId` that
    `createTrustDomain` returned. It requires the same
    `network-access-domains:trust-domains` scope. The id is opaque
    (SHA-256-derived), so the in-memory store is the only control plane: a stored
    id → `200` with the persisted `TrustDomain`, any other id → `404 NOT_FOUND`.

    ## Functional cases — the input is the control plane (docs/DESIGN.md §7)

    **`getTrustDomainCapabilities`** — provider capabilities are fixed operator
    configuration, not keyed to any device or subscriber, so this operation has
    **no** parameter-driven control plane: given a token carrying the required
    scope it always answers the same deterministic `TrustDomainCapabilities`
    document (`200`).

    **`getServices`** has no request body either, but it is keyed to the
    authenticated identity, so its control plane is the **token subject**: a
    reserved error suffix on the subject → the canonical CAMARA error; otherwise
    the subject's trailing three digits `d` fix the catalog deterministically —
    `d == 0` (`…000` / no digits) → `200 []` (nothing associated; a list never
    404s), else `((d - 1) % 3) + 1` services (1–3), each with a deterministic
    UUID-shaped `id` and `serviceSite`.

    **`getService`** (`GET /services/{serviceId}`) reads one `Service` from that
    same identity-keyed catalog. It regenerates the subject's catalog (no store)
    and matches the `serviceId` path parameter. Two control planes (DESIGN §7):
    the subject's reserved error suffix → the canonical CAMARA error (an
    account-level plane, checked first, mirroring `getServices`); otherwise the
    `serviceId` vs the catalog — an id the identity holds → `200` that `Service`,
    any other id (unknown / another identity's / malformed) → `404 NOT_FOUND`.
    The `serviceId` is opaque to the caller (SHA-256-derived), so it is not itself
    a reserved-error plane; because the catalog is regenerated rather than stored,
    a malformed id is indistinguishable from an unknown one and folds into the same
    `404` (mirroring the sibling `getNetworkAccessDevice`).

    For all three, a missing/invalid token → `401`; a token without the
    endpoint's scope → `403` (both from the shared resource-server layer).

    **`createTrustDomain`** (`POST /trust-domains`) creates a Trust Domain from a
    `TrustDomainCreate` body. Three control planes (docs/DESIGN.md §7): the token
    subject's reserved error suffix → the canonical CAMARA error (an account-level
    plane, checked first); request validation → `400 INVALID_ARGUMENT`; and the
    in-memory store — the `trustDomainId` is derived from the `(serviceId, name)`
    pair, so re-creating the same name for the same service collides → `409`.

    **`getTrustDomain`** (`GET /trust-domains/{trustDomainId}`) reads a created
    Trust Domain back. The `trustDomainId` is an opaque, server-minted UUID, so —
    mirroring the sibling `readNetwork` / `getApp` read legs — the in-memory store
    is the only control plane: a stored id → `200` with the persisted
    `TrustDomain`, any other id (never created or malformed) → `404 NOT_FOUND`
    (a malformed id folds into the same `404`, no store entry to tell them apart).

    **`updateTrustDomain`** (`PATCH /trust-domains/{trustDomainId}`) updates a
    created Trust Domain in place from a `TrustDomainUpdate` (every field optional).
    Two control planes: the request body (validated first, so a body `400` wins over
    a `404`) and store state (a stored id → `200` with the updated `TrustDomain`,
    any other id → `404`). A present field replaces, an explicit `null` on a
    clearable optional (`description`/`expiration`/`policies`) removes it, and
    `accessDetails` replaces wholesale; the read-only identity/audit fields are
    immutable and `modifiedAt`/`modifiedBy` are re-stamped. There is no `409` — the
    resource is addressed by its fixed id, so a rename can't collide.

    **`deleteTrustDomain`** (`DELETE /trust-domains/{trustDomainId}`) evicts a
    created Trust Domain. Keyed only to the store, mirroring `getTrustDomain`: a
    stored id is removed → `204 No Content` (single-use — a second delete of the
    same id finds nothing), any other id (never created, already deleted, or
    malformed) → `404 NOT_FOUND`. Deletion is synchronous with no CloudEvent.

    **`createTrustDomainDevice`** (`POST /trust-domains/{trustDomainId}/devices`)
    registers a device inside an existing Trust Domain. Four control planes: the
    token subject's reserved error suffix (checked first); request validation
    (`400`); the parent Trust Domain's existence in the store (`404`, checked
    after validation so a body `400` wins); and the in-memory device store — the
    `deviceId` is derived from the `(trustDomainId, deviceName)` pair, so the same
    `deviceName` in the same Trust Domain collides → `409`. A just-created device
    is `connected: false` / `associated: false` with no assigned address, the
    write-only `deviceCredential` is stripped, and it requires the
    `network-access-domains:devices` scope.

    **`getTrustDomainDevice`**
    (`GET /trust-domains/{trustDomainId}/devices/{deviceId}`) reads a created
    device back. Unlike the create leg, it is store-only (mirroring
    `getTrustDomain`): the device store is keyed by the full
    `(trustDomainId, deviceId)` pair and the `deviceId` is an opaque
    server-minted UUID, so the token subject is not a control plane — a stored
    pair → `200` with the persisted `TrustDomainDevice`, any other pair (unknown
    parent, unknown device, another Trust Domain's device, or a malformed id) →
    `404 NOT_FOUND` (folded, one store lookup). Same `network-access-domains:devices`
    scope as the create leg.

    ## Documented cuts

    - The read-only `getTrustDomainCapabilities`, `getServices` and `getService`
      legs and the stateful `createTrustDomain` / `getTrustDomain` /
      `updateTrustDomain` / `deleteTrustDomain` legs are implemented, plus the
      Trust Domain Device create + read legs `createTrustDomainDevice` /
      `getTrustDomainDevice`; the device list/update/delete legs are a later slice.
    - `createTrustDomainDevice` validates the required `deviceName`/`enabled`, the
      optional scalar fields, and the `hardwareAddress` (EUI-48 type + MAC
      pattern), but accepts and echoes the nested `bootstrappingInfo` as-is and
      never echoes the write-only `deviceCredential` (contents not validated); a
      freshly created device has no assigned `ipv4Address`/`ipv6Address` and is
      `connected`/`associated` `false` until association (no live onboarding). The
      `deviceId` is a deterministic version-5 UUID over `(trustDomainId,
      deviceName)`, so re-creating the same name in the same Trust Domain re-mints
      the same id (that is how the `409` duplicate is detected).
    - `createTrustDomain` admits only the access types this provider advertises
      (Wi-Fi WPA-Personal/Enterprise, Thread STRUCTURED). A canonical but
      unadvertised `Thread:TLV` access detail → `400 INVALID_ARGUMENT`.
    - `createTrustDomain` validates the required fields and each access detail's
      discriminated required keys, but not the nested field *values* (SSID
      pattern, hex-string lengths, Thread channel range) nor the `policies`
      object contents (accepted and echoed as-is) — a documented cut.
    - The write-only WPA `password` is stripped from the `TrustDomain` response.
    - The `trustDomainId` (and the audit `createdBy`/`modifiedBy`) are
      deterministic version-5 UUIDs derived from the request, not random —
      re-creating the same `(serviceId, name)` re-mints the same id (that is how
      the `409` duplicate is detected). The audit `createdBy`/`modifiedBy`
      identify the token subject, not a real operator account.
    - `getService` folds a malformed (non-UUID) `serviceId` into the same `404
      NOT_FOUND` as an unknown id (the catalog is regenerated per identity rather
      than stored, so the two are indistinguishable), mirroring the sibling
      `getNetworkAccessDevice`.
    - The Services catalog is a deterministic, representative set (no real billing
      backend): the returned service/site names are simulator defaults, keyed only
      to the identity. Each `serviceSite` now carries a deterministic
      `location.geographicPoint` (a WGS-84 point stable per identity/slot); the
      canonical `location.propertyAddress` (a civic address) remains omitted (it is
      optional in the schema). The point is a fixed, renderable coordinate, not a
      queryable spatial field, so it is not a scenario control plane.
    - The advertised capabilities are a fixed, representative set covering all four
      CAMARA access-type variants' families (Wi-Fi WPA-Personal, Wi-Fi
      WPA-Enterprise, Thread) and all four policy capabilities; the exact values
      are simulator defaults (schema-valid), not negotiated per operator.
  version: "wip"
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: "{apiRoot}/network-access-domains/vwip"
    variables:
      apiRoot:
        default: http://localhost:8080
        description: API root, e.g. the CamaraSim base URL.

paths:
  /trust-domains/capabilities:
    get:
      operationId: getTrustDomainCapabilities
      summary: Get Trust Domain capabilities
      description: |
        Retrieves the set of Trust Domain configuration capabilities supported by
        the API provider — the supported access types and their variants, and the
        policy limits (max devices, per-domain bandwidth bands, egress-list
        constraints) a caller may configure.

        There is no request body and no device identifier: capabilities are fixed
        provider configuration, so this operation has no parameter-driven control
        plane and always returns the same document (docs/DESIGN.md §7).
      security:
        - openId:
            - network-access-domains:trust-domains
      parameters:
        - $ref: "#/components/parameters/XCorrelator"
      responses:
        "200":
          description: Trust Domain capabilities supported by this API provider.
          headers:
            x-correlator:
              $ref: "#/components/headers/XCorrelator"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrustDomainCapabilities"
              examples:
                capabilities:
                  summary: The provider's fixed Trust Domain capabilities
                  value:
                    supportedAccessTypes:
                      - accessType: "Wi-Fi:WPA_PERSONAL"
                        wifiProperties:
                          ssidRequired: true
                          supportedSecurityModes:
                            - WPA2-Personal
                            - WPA3-Personal
                            - WPA2-WPA3-Personal
                          passwordConstraints:
                            minLength: 8
                            maxLength: 63
                            requireSpecialCharacters: false
                          authServerRequired: false
                      - accessType: "Wi-Fi:WPA_ENTERPRISE"
                        wifiProperties:
                          ssidRequired: true
                          supportedSecurityModes:
                            - WPA2-Enterprise
                            - WPA3-Enterprise
                          authServerRequired: true
                      - accessType: "Thread:STRUCTURED"
                        threadProperties:
                          supportedChannels:
                            min: 11
                            max: 26
                          networkKeyFormat: "32-hex-digits"
                          networkNameConstraints:
                            minLength: 1
                            maxLength: 16
                          maxDatasetLength: 254
                    supportedPolicies:
                      maxDevices:
                        minValue: 1
                        maxValue: 100
                      maxDomainDownstreamRate:
                        minValue: 1000000
                        maxValue: 1000000000
                      maxDomainUpstreamRate:
                        minValue: 1000000
                        maxValue: 1000000000
                      egressAllowedList:
                        maxEntries: 50
                        supportedDestinationTypes:
                          - IP
                          - FQDN
                          - CIDR
        "400":
          $ref: "../../shared/errors.yaml#/components/responses/InvalidArgument"
        "401":
          $ref: "../../shared/errors.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../../shared/errors.yaml#/components/responses/PermissionDenied"
        "500":
          $ref: "../../shared/errors.yaml#/components/responses/Internal"
        "503":
          $ref: "../../shared/errors.yaml#/components/responses/Unavailable"
      x-camarasim-scenarios:
        description: >-
          Provider capabilities are fixed operator configuration with no
          device/subscriber key, so this operation has no parameter-driven control
          plane (docs/DESIGN.md §7): a scoped token always yields the same
          document.
        cases:
          - input: a token carrying the network-access-domains:trust-domains scope
            result: "200 — the fixed TrustDomainCapabilities document"
          - input: a token without the scope
            result: "403 PERMISSION_DENIED"
          - input: no / invalid token
            result: "401 UNAUTHENTICATED"

  /trust-domains:
    post:
      operationId: createTrustDomain
      summary: Create a Trust Domain
      description: |
        Creates a Trust Domain — a group of devices on the subscriber's home
        network sharing a common access policy — for one of the caller's
        services. The caller submits a `TrustDomainCreate` (a `serviceId`, a
        human-readable `name`, an `enabled` flag, and 1–4 `accessDetails`); the
        simulator mints a server-assigned `trustDomainId`, stores the Trust
        Domain in memory, and returns the full `TrustDomain` (`201`).

        Three control planes drive the outcome (docs/DESIGN.md §7):

        1. **The token subject** — a reserved error suffix on the authenticated
           identity selects the canonical CAMARA error (an account-level plane,
           checked first, mirroring `getServices`/`getService`).
        2. **Request validation** — a missing/blank/oversized `name`, a missing
           `enabled`, a missing/malformed `serviceId`, an `accessDetails` that is
           empty or longer than 4, or an entry whose `accessType` is unknown, is
           not one this provider advertises (see
           `GET /trust-domains/capabilities`), or lacks its variant's required
           keys → `400 INVALID_ARGUMENT`.
        3. **Store state** — the `trustDomainId` is derived from the
           `(serviceId, name)` pair, so creating a Trust Domain with the same
           `name` for the same `serviceId` collides → `409` (duplicate name for
           service).
      security:
        - openId:
            - network-access-domains:trust-domains
      parameters:
        - $ref: "#/components/parameters/XCorrelator"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrustDomainCreate"
            examples:
              wifiPersonal:
                summary: A Trust Domain with one Wi-Fi WPA-Personal access detail
                value:
                  serviceId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                  name: "Primary WiFi Network"
                  description: "Primary home WiFi Network for all devices"
                  enabled: true
                  accessDetails:
                    - accessType: "Wi-Fi:WPA_PERSONAL"
                      ssid: "my-ssid"
                      securityMode:
                        password: "my-password"
                        securityModeType: "WPA3-Personal"
      responses:
        "201":
          description: The Trust Domain was created.
          headers:
            x-correlator:
              $ref: "#/components/headers/XCorrelator"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrustDomain"
              examples:
                created:
                  summary: The created Trust Domain (write-only password omitted)
                  value:
                    id: "b1e0f6a2-9c3d-5e4f-8a1b-2c3d4e5f6a7b"
                    serviceId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    name: "Primary WiFi Network"
                    description: "Primary home WiFi Network for all devices"
                    enabled: true
                    accessDetails:
                      - accessType: "Wi-Fi:WPA_PERSONAL"
                        ssid: "my-ssid"
                        securityMode:
                          securityModeType: "WPA3-Personal"
                    createdAt: "2024-01-01T09:00:00Z"
                    createdBy: "4a7c9e2d-1b3f-5a6c-9d8e-0f1a2b3c4d5e"
                    modifiedAt: "2024-01-01T09:00:00Z"
                    modifiedBy: "4a7c9e2d-1b3f-5a6c-9d8e-0f1a2b3c4d5e"
        "400":
          $ref: "../../shared/errors.yaml#/components/responses/InvalidArgument"
        "401":
          $ref: "../../shared/errors.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../../shared/errors.yaml#/components/responses/PermissionDenied"
        "404":
          $ref: "../../shared/errors.yaml#/components/responses/NotFound"
        "409":
          $ref: "../../shared/errors.yaml#/components/responses/Conflict"
        "429":
          $ref: "../../shared/errors.yaml#/components/responses/TooManyRequests"
        "500":
          $ref: "../../shared/errors.yaml#/components/responses/Internal"
        "503":
          $ref: "../../shared/errors.yaml#/components/responses/Unavailable"
      x-camarasim-scenarios:
        description: >-
          createTrustDomain has three control planes (docs/DESIGN.md §7): the
          token subject's reserved error suffix (checked first), request
          validation, and the in-memory store (a duplicate name-for-service
          collides). The trustDomainId is derived from the (serviceId, name)
          pair, so the same name for the same service re-mints the same id and is
          rejected as a duplicate.
        cases:
          - input: "a valid TrustDomainCreate for a fresh (serviceId, name)"
            result: "201 — the created TrustDomain (write-only password stripped)"
          - input: "a second create with the same (serviceId, name)"
            result: "409 — duplicate name for the service"
          - input: "a different name for the same serviceId"
            result: "201 — a distinct Trust Domain"
          - input: "missing/blank/over-64-char name, missing enabled, or malformed serviceId"
            result: "400 INVALID_ARGUMENT"
          - input: "accessDetails empty, longer than 4, or missing a variant's required keys"
            result: "400 INVALID_ARGUMENT"
          - input: "an accessType not advertised (e.g. Thread:TLV) or unknown"
            result: "400 INVALID_ARGUMENT"
          - input: "the token subject trailing digits are …404"
            result: "404 NOT_FOUND (reserved error suffix, account-level)"
          - input: "the token subject trailing digits are …429"
            result: "429 TOO_MANY_REQUESTS (reserved error suffix, account-level)"
          - input: a token without the network-access-domains:trust-domains scope
            result: "403 PERMISSION_DENIED"
          - input: no / invalid token
            result: "401 UNAUTHENTICATED"

  /trust-domains/{trustDomainId}:
    get:
      operationId: getTrustDomain
      summary: Retrieve a Trust Domain by id
      description: |
        Retrieves a single `TrustDomain` by the server-assigned `trustDomainId`
        that `createTrustDomain` returned.

        There is no request body and no device identifier: the operation is keyed
        only to the in-memory store (docs/DESIGN.md §7). The `trustDomainId` is an
        opaque, SHA-256-derived UUID the caller cannot construct, so it is not
        itself a scenario plane — a stored id → `200` with the persisted
        `TrustDomain` (the write-only WPA password was already stripped at
        create), any other id (never created or malformed) → `404 NOT_FOUND`. A
        malformed id folds into the same `404` (there is no store entry to
        distinguish it from an unknown one).
      security:
        - openId:
            - network-access-domains:trust-domains
      parameters:
        - $ref: "#/components/parameters/XCorrelator"
        - name: trustDomainId
          in: path
          required: true
          description: The server-assigned id of the Trust Domain to retrieve.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The requested Trust Domain.
          headers:
            x-correlator:
              $ref: "#/components/headers/XCorrelator"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrustDomain"
              examples:
                trustDomain:
                  summary: A stored Trust Domain (write-only password omitted)
                  value:
                    id: "b1e0f6a2-9c3d-5e4f-8a1b-2c3d4e5f6a7b"
                    serviceId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    name: "Primary WiFi Network"
                    description: "Primary home WiFi Network for all devices"
                    enabled: true
                    accessDetails:
                      - accessType: "Wi-Fi:WPA_PERSONAL"
                        ssid: "my-ssid"
                        securityMode:
                          securityModeType: "WPA3-Personal"
                    createdAt: "2024-01-01T09:00:00Z"
                    createdBy: "4a7c9e2d-1b3f-5a6c-9d8e-0f1a2b3c4d5e"
                    modifiedAt: "2024-01-01T09:00:00Z"
                    modifiedBy: "4a7c9e2d-1b3f-5a6c-9d8e-0f1a2b3c4d5e"
        "400":
          $ref: "../../shared/errors.yaml#/components/responses/InvalidArgument"
        "401":
          $ref: "../../shared/errors.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../../shared/errors.yaml#/components/responses/PermissionDenied"
        "404":
          $ref: "../../shared/errors.yaml#/components/responses/NotFound"
        "429":
          $ref: "../../shared/errors.yaml#/components/responses/TooManyRequests"
        "500":
          $ref: "../../shared/errors.yaml#/components/responses/Internal"
        "503":
          $ref: "../../shared/errors.yaml#/components/responses/Unavailable"
      x-camarasim-scenarios:
        description: >-
          getTrustDomain is keyed only to the in-memory store (docs/DESIGN.md §7).
          The trustDomainId is an opaque server-minted UUID, so store state is the
          only control plane: a stored id returns the persisted TrustDomain, any
          other id — unknown or malformed — is a 404 (folded, no store entry to
          tell them apart).
        cases:
          - input: "a trustDomainId returned by a prior createTrustDomain"
            result: "200 — the persisted TrustDomain (write-only password omitted)"
          - input: "a well-formed trustDomainId that was never created"
            result: "404 NOT_FOUND"
          - input: "a malformed (non-UUID) trustDomainId"
            result: "404 NOT_FOUND (folded, no store to distinguish it)"
          - input: a token without the network-access-domains:trust-domains scope
            result: "403 PERMISSION_DENIED"
          - input: no / invalid token
            result: "401 UNAUTHENTICATED"
    patch:
      operationId: updateTrustDomain
      summary: Update a Trust Domain by id
      description: |
        Updates a single `TrustDomain` in place by the server-assigned
        `trustDomainId` that `createTrustDomain` returned. The caller sends a
        `TrustDomainUpdate` — the mutable subset of a Trust Domain, **every field
        optional** — and only the fields present in the body are changed; an absent
        field is left unchanged. Per the CAMARA schema `accessDetails` is a **full
        replacement** (a supplied array replaces the stored one wholesale, it is not
        merged). The read-only identity/audit fields (`id`, `serviceId`,
        `createdAt`, `createdBy`) are immutable — a body that carries them has them
        ignored — and every successful update refreshes `modifiedAt`/`modifiedBy`.

        Two control planes (docs/DESIGN.md §7), mirroring the repo's other PATCH
        legs: the **request body** is validated first (so a body `400` wins over a
        `404`), then **store state** — the opaque server-minted `trustDomainId` is
        not itself a scenario plane, so a stored id → `200` with the updated
