                  summary: A stored device (write-only deviceCredential omitted)
                  value:
                    id: "c2f1a7b3-8d4e-5f6a-9b0c-1d2e3f4a5b6c"
                    deviceName: "Alice's Laptop"
                    deviceType: "LAPTOP"
                    enabled: true
                    hardwareAddress:
                      hardwareAddressType: "EUI-48"
                      value: "00:11:22:33:44:55"
                    connected: false
                    associated: false
                    createdAt: "2024-01-01T09:00:00Z"
                    createdBy: "4a7c9e2d-1b3f-5a6c-9d8e-0f1a2b3c4d5e"
                    modifiedAt: "2024-01-01T09:00:00Z"
                    modifiedBy: "4a7c9e2d-1b3f-5a6c-9d8e-0f1a2b3c4d5e"
        "400":
          $ref: "../../shared/errors.yaml#/components/responses/InvalidArgument"
        "401":
          $ref: "../../shared/errors.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../../shared/errors.yaml#/components/responses/PermissionDenied"
        "404":
          $ref: "../../shared/errors.yaml#/components/responses/NotFound"
        "429":
          $ref: "../../shared/errors.yaml#/components/responses/TooManyRequests"
        "500":
          $ref: "../../shared/errors.yaml#/components/responses/Internal"
        "503":
          $ref: "../../shared/errors.yaml#/components/responses/Unavailable"
      x-camarasim-scenarios:
        description: >-
          getTrustDomainDevice is keyed only to the in-memory device store
          (docs/DESIGN.md §7). The store is keyed by the full (trustDomainId,
          deviceId) pair and the deviceId is an opaque server-minted UUID, so —
          unlike the device create leg — the token subject is not a control plane
          and store state is the only plane: a stored pair returns the persisted
          TrustDomainDevice, any other pair (unknown parent, unknown device,
          another Trust Domain's device, or a malformed id) is a 404 (folded, one
          store lookup).
        cases:
          - input: "a (trustDomainId, deviceId) pair returned by a prior createTrustDomainDevice"
            result: "200 — the persisted TrustDomainDevice (write-only deviceCredential omitted)"
          - input: "a well-formed deviceId that was never created in the Trust Domain"
