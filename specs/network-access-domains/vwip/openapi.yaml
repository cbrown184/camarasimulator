          and the serviceId path parameter (docs/DESIGN.md §7). The subject's
          reserved error suffix selects the canonical CAMARA error (checked
          first); otherwise the serviceId is matched against the identity's
          deterministic catalog. A malformed (non-UUID) serviceId folds into the
          same 404 as an unknown id (the catalog is regenerated, not stored, so
          the two are indistinguishable).
        cases:
          - input: "a serviceId drawn from the identity's catalog"
            result: "200 — that Service"
          - input: "a well-formed serviceId the identity does not hold"
            result: "404 NOT_FOUND"
          - input: "a serviceId belonging to a different identity's catalog"
            result: "404 NOT_FOUND"
          - input: "a malformed (non-UUID) serviceId"
            result: "404 NOT_FOUND (folded, no store to distinguish it)"
          - input: "any serviceId when the subject trailing digits are …000"
            result: "404 NOT_FOUND (empty catalog)"
          - input: "any serviceId when the subject trailing digits are …404"
            result: "404 NOT_FOUND (reserved error suffix, account-level)"
          - input: "any serviceId when the subject trailing digits are …429"
            result: "429 TOO_MANY_REQUESTS (reserved error suffix, account-level)"
          - input: a token without the network-access-domains:services:read scope
            result: "403 PERMISSION_DENIED"
          - input: no / invalid token
            result: "401 UNAUTHENTICATED"

components:
  securitySchemes:
    openId:
      $ref: "../../auth/openapi.yaml#/components/securitySchemes/camaraOAuth"

  parameters:
    XCorrelator:
      name: x-correlator
      in: header
      required: false
      description: Correlation id for the request, echoed back on the response.
      schema:
        type: string

  headers:
    XCorrelator:
      description: The `x-correlator` from the request, echoed if one was sent.
      required: false
      schema:
        type: string

  schemas:
    TrustDomainCapabilities:
      type: object
      additionalProperties: false
      description: |
        Describes the Trust Domain configuration capabilities supported by this
        API provider.
      required:
        - supportedAccessTypes
      properties:
        supportedAccessTypes:
          type: array
          minItems: 1
          maxItems: 4
          description: List of supported access types and their variants.
          items:
            $ref: "#/components/schemas/SupportedAccessType"
        supportedPolicies:
          type: object
          additionalProperties: false
          description: Map of supported policy types to their capability details.
          properties:
            maxDevices:
              $ref: "#/components/schemas/MaxDevicesPolicyCapability"
            maxDomainDownstreamRate:
              $ref: "#/components/schemas/BandwidthPolicyCapability"
            maxDomainUpstreamRate:
              $ref: "#/components/schemas/BandwidthPolicyCapability"
            egressAllowedList:
              $ref: "#/components/schemas/EgressPolicyCapability"

    SupportedAccessType:
      type: object
      description: |
        A supported access type. `accessType` is the discriminator; the remaining
        properties belong to the matching variant (Wi-Fi variants carry
        `wifiProperties`, Thread variants carry `threadProperties`).
      required:
        - accessType
      discriminator:
        propertyName: accessType
      properties:
        accessType:
          type: string
          enum:
            - "Wi-Fi:WPA_PERSONAL"
            - "Wi-Fi:WPA_ENTERPRISE"
            - "Thread:STRUCTURED"
            - "Thread:TLV"
          description: The access type identifier.
        wifiProperties:
          $ref: "#/components/schemas/WiFiAccessTypeProperties"
        threadProperties:
          $ref: "#/components/schemas/ThreadAccessTypeProperties"

    WiFiAccessTypeProperties:
      type: object
      additionalProperties: false
      description: The configuration properties supported for a Wi-Fi access type.
      properties:
        ssidRequired:
          type: boolean
          example: true
        supportedSecurityModes:
          type: array
          maxItems: 5
          items:
            type: string
            enum:
              - WPA2-Personal
              - WPA3-Personal
              - WPA2-WPA3-Personal
              - WPA2-Enterprise
              - WPA3-Enterprise
        passwordConstraints:
          $ref: "#/components/schemas/PasswordConstraints"
        authServerRequired:
          type: boolean
          example: false

    PasswordConstraints:
      type: object
      additionalProperties: false
      description: The constraints on a Wi-Fi pre-shared-key / password.
      required:
        - minLength
        - maxLength
      properties:
        minLength:
          type: integer
          format: int32
          minimum: 8
          maximum: 63
          example: 8
        maxLength:
          type: integer
          format: int32
          minimum: 8
          maximum: 63
          example: 63
        requireSpecialCharacters:
          type: boolean
          example: false

    ThreadAccessTypeProperties:
      type: object
      additionalProperties: false
      description: The configuration properties supported for a Thread access type.
      properties:
        supportedChannels:
          type: object
          additionalProperties: false
          required:
            - min
            - max
          properties:
            min:
              type: integer
              minimum: 11
              maximum: 26
              example: 11
            max:
              type: integer
              minimum: 11
              maximum: 26
              example: 26
        networkKeyFormat:
          type: string
          enum:
            - "32-hex-digits"
        networkNameConstraints:
          type: object
          additionalProperties: false
          required:
            - minLength
            - maxLength
          properties:
            minLength:
              type: integer
              minimum: 1
              maximum: 16
              example: 1
            maxLength:
              type: integer
              minimum: 1
              maximum: 16
              example: 16
        maxDatasetLength:
          type: integer
          minimum: 1
          maximum: 254
          example: 254

    MaxDevicesPolicyCapability:
      type: object
      additionalProperties: false
      description: The supported range for the max-devices-per-domain policy.
      required:
        - maxValue
        - minValue
      properties:
        minValue:
          type: integer
          format: int32
          minimum: 1
          maximum: 1024
          example: 1
        maxValue:
          type: integer
          format: int32
          minimum: 1
          maximum: 1024
          example: 100

    BandwidthPolicyCapability:
      type: object
      additionalProperties: false
      description: The supported range (bits/second) for a per-domain bandwidth policy.
      required:
        - maxValue
        - minValue
      properties:
        minValue:
          type: integer
          format: int64
          minimum: 0
          maximum: 10000000000
          example: 1000000
        maxValue:
          type: integer
          format: int64
          minimum: 0
          maximum: 10000000000
          example: 1000000000

    EgressPolicyCapability:
      type: object
      additionalProperties: false
      description: The constraints on a Trust Domain egress allow-list policy.
      required:
        - maxEntries
        - supportedDestinationTypes
      properties:
        maxEntries:
          type: integer
          format: int32
          minimum: 1
          maximum: 1024
          example: 50
        supportedDestinationTypes:
          type: array
          maxItems: 3
          items:
            type: string
            enum:
              - IP
              - FQDN
              - CIDR

    ServiceId:
      type: string
      format: uuid
      description: |
        A unique identifier that represents a service account. A valid UUID (RFC
        4122, versions 1-5) using only lowercase hexadecimal characters.
      example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"

    ServiceList:
      type: array
      description: A list of services accessible to the calling identity.
      maxItems: 100
      items:
        $ref: "#/components/schemas/Service"

    Service:
      type: object
      description: |
        A service represents a logical commercial subscription or account
        relationship between a network operator and a subscriber (residential,
        commercial, public Wi-Fi, or other service types).
      required:
        - id
      properties:
        id:
          $ref: "#/components/schemas/ServiceId"
        name:
          type: string
          maxLength: 64
          description: Optional friendly name for the service.
          example: "Main Home Internet"
        description:
          type: string
          maxLength: 255
          description: Optional description of the service.
          example: "Internet subscription for primary residence"
        serviceSite:
          $ref: "#/components/schemas/ServiceSite"

    ServiceSite:
      type: object
      description: |
        A Service Site represents a subscriber location associated with one or
        more Network Access Devices.
      required:
        - id
      properties:
        id:
          $ref: "#/components/schemas/ServiceId"
        name:
          type: string
          maxLength: 64
          description: The name of the service site.
          example: "Primary Residence"
        description:
          type: string
          maxLength: 64
          description: A textual description of the service site.
          example: "123 Main Street"
        location:
          $ref: "#/components/schemas/Location"

    Location:
      type: object
      description: |
        The physical location of a service site. The canonical schema carries a
        WGS-84 `geographicPoint` and a civic `propertyAddress`; CamaraSim emits a
        deterministic `geographicPoint` only (`propertyAddress` is a documented
        cut). The point is a fixed, representative coordinate the caller can
        render, not a queryable spatial field, so it is not a scenario control
        plane (docs/DESIGN.md §7).
      properties:
        geographicPoint:
          $ref: "#/components/schemas/Point"

    Point:
      type: object
      description: A WGS-84 point (decimal degrees).
      required:
        - latitude
        - longitude
      properties:
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          example: 50.735851
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          example: 7.10066

    # --- Trust Domain create (createTrustDomain) --------------------------

    Uuid:
      type: string
      format: uuid
      minLength: 36
      maxLength: 36
      pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
      description: |
        A UUID (RFC 4122, versions 1-5) using only lowercase hexadecimal
        characters. CamaraSim mints server-assigned ids (the `trustDomainId`
        and the audit `createdBy`/`modifiedBy`) as deterministic, name-based
        version-5 UUIDs.
      example: "b1e0f6a2-9c3d-5e4f-8a1b-2c3d4e5f6a7b"

    DateTime:
      type: string
      format: date-time
      maxLength: 64
      description: |
        An RFC 3339 date-time with a time zone. CamaraSim emits the audit
        `createdAt`/`modifiedAt` stamps as UTC instants with a `Z` offset.
      example: "2024-01-01T09:00:00Z"

    Policies:
      type: object
      additionalProperties: true
      description: |
        Trust Domain policy limits (max devices, per-domain up/downstream
        bandwidth, egress allow-list) a caller may configure. CamaraSim accepts
        and echoes the object but does not validate its contents against the
        advertised capabilities — the full `Policies` shape is a documented cut.
        See `GET /trust-domains/capabilities` for the supported policy ranges.

    WpaPersonalDetail:
      type: object
      additionalProperties: false
      description: WPA Personal security mode configuration for Wi-Fi networks.
      required:
        - password
      properties:
        password:
          type: string
          writeOnly: true
          minLength: 8
          maxLength: 255
          pattern: "^[\\x20-\\x7E]{8,63}$"
          description: |
            The pre-shared key for the WPA Personal Wi-Fi network. Write-only —
            it is never echoed in a `TrustDomain` response.
          example: "my-password"
        securityModeType:
          type: string
          enum:
            - WPA2-Personal
            - WPA2-WPA3-Personal
            - WPA3-Personal
          description: |
            The security mode type for the WPA Personal Wi-Fi network. Leave
            blank to auto-select.
          example: "WPA3-Personal"

    WpaEnterpriseDetail:
      type: object
      additionalProperties: false
      description: WPA Enterprise security mode configuration for Wi-Fi networks.
      required:
        - securityModeType
      properties:
        authServer:
          type: string
          maxLength: 255
          description: The authentication server for the WPA Enterprise Wi-Fi network.
          example: "1.2.3.4"
        securityModeType:
          type: string
          enum:
            - WPA2-Enterprise
            - WPA3-Enterprise
          description: The security mode type for the WPA Enterprise Wi-Fi network.
          example: "WPA3-Enterprise"

    WiFiWpaPersonalAccessDetail:
      type: object
      additionalProperties: false
      description: Access details for Wi-Fi networks using WPA Personal security mode.
      required:
        - accessType
        - securityMode
      properties:
        accessType:
          type: string
          enum:
            - "Wi-Fi:WPA_PERSONAL"
          example: "Wi-Fi:WPA_PERSONAL"
        ssid:
          type: string
          minLength: 2
          maxLength: 32
          pattern: "^(?! )[\\x20-\\x7E]{2,32}(?<! )$"
          description: SSID (2-32 printable ASCII characters, no leading/trailing space).
          example: "my-ssid"
        securityMode:
          $ref: "#/components/schemas/WpaPersonalDetail"

    WiFiWpaEnterpriseAccessDetail:
      type: object
      additionalProperties: false
      description: Access details for Wi-Fi networks using WPA Enterprise security mode.
      required:
        - accessType
        - securityMode
      properties:
        accessType:
          type: string
          enum:
            - "Wi-Fi:WPA_ENTERPRISE"
          example: "Wi-Fi:WPA_ENTERPRISE"
        ssid:
          type: string
          minLength: 2
          maxLength: 32
          pattern: "^(?! )[\\x20-\\x7E]{2,32}(?<! )$"
          description: SSID (2-32 printable ASCII characters, no leading/trailing space).
          example: "my-ssid"
        securityMode:
          $ref: "#/components/schemas/WpaEnterpriseDetail"

    ThreadStructuredAccessDetail:
      type: object
      additionalProperties: false
      description: Access details for Thread networks using the structured format.
      required:
        - accessType
        - channel
        - extendedPanId
        - networkKey
        - networkName
        - panId
      properties:
        accessType:
          type: string
          enum:
            - "Thread:STRUCTURED"
          example: "Thread:STRUCTURED"
        channel:
          type: integer
          format: int32
          minimum: 11
          maximum: 26
          description: The Thread channel (IEEE 802.15.4 channel number).
          example: 13
        extendedPanId:
          type: string
          pattern: "^[0-9a-fA-F]{16}$"
          maxLength: 16
          description: The Extended PAN ID (16 hex digits).
          example: "d63e8e3e495ebbc3"
        networkKey:
          type: string
          pattern: "^[0-9a-fA-F]{32}$"
          maxLength: 32
          description: The Thread Network Key (32 hex digits).
          example: "dfd34f0f05cad978ec4e32b0413038ff"
        networkName:
          type: string
          minLength: 1
          maxLength: 16
          description: The Thread Network Name (1-16 ASCII characters).
          example: "Spec-Thread-B3AF"
        panId:
          type: string
          pattern: "^[0-9a-fA-F]{4}$"
          maxLength: 4
          description: The PAN ID (4 hex digits).
          example: "d63e"

    ThreadTlvAccessDetail:
      type: object
      additionalProperties: false
      description: |
        Access details for Thread networks using the TLV-encoded operational
        dataset. Present in the canonical schema, but **not advertised** by this
        provider (see `GET /trust-domains/capabilities`), so `createTrustDomain`
        rejects a Thread:TLV access detail with `400 INVALID_ARGUMENT`.
      required:
        - accessType
        - operationalDataset
      properties:
        accessType:
          type: string
          enum:
            - "Thread:TLV"
          example: "Thread:TLV"
        operationalDataset:
          type: string
          maxLength: 255
          description: The Thread operational dataset encoded as a TLV hex string.
          example: "0e08000000000000010010000102030405060708090a0b0c0d0e0f"

    AccessDetail:
      oneOf:
        - $ref: "#/components/schemas/WiFiWpaPersonalAccessDetail"
        - $ref: "#/components/schemas/WiFiWpaEnterpriseAccessDetail"
        - $ref: "#/components/schemas/ThreadStructuredAccessDetail"
        - $ref: "#/components/schemas/ThreadTlvAccessDetail"
      discriminator:
        propertyName: accessType
        mapping:
          "Wi-Fi:WPA_PERSONAL": "#/components/schemas/WiFiWpaPersonalAccessDetail"
          "Wi-Fi:WPA_ENTERPRISE": "#/components/schemas/WiFiWpaEnterpriseAccessDetail"
          "Thread:STRUCTURED": "#/components/schemas/ThreadStructuredAccessDetail"
          "Thread:TLV": "#/components/schemas/ThreadTlvAccessDetail"
      required:
        - accessType
      description: |
        Network access details for one access type. `accessType` is the
        discriminator; the remaining properties belong to the matching variant.

    TrustDomainUpdate:
      type: object
      description: The updatable fields of a Trust Domain.
      properties:
        name:
          type: string
          maxLength: 64
          description: Human-readable name for the Trust Domain.
          example: "Primary WiFi Network"
        description:
          type: string
          maxLength: 255
          description: Detailed description of the Trust Domain.
          example: "Primary home WiFi Network for all devices"
        enabled:
          type: boolean
          description: Whether the Trust Domain is currently enabled.
          example: true
        expiration:
          allOf:
            - $ref: "#/components/schemas/DateTime"
          description: |
            The expiration date and time of the Trust Domain. If omitted, the
            Trust Domain does not automatically expire.
        policies:
          $ref: "#/components/schemas/Policies"
        accessDetails:
          type: array
          minItems: 1
          maxItems: 4
          description: |
            The access configurations that define how devices may join the Trust
            Domain (1-4 entries). On creation the full list must be supplied.
          items:
            $ref: "#/components/schemas/AccessDetail"

    TrustDomainCreate:
      allOf:
        - $ref: "#/components/schemas/TrustDomainUpdate"
        - type: object
          properties:
            serviceId:
              $ref: "#/components/schemas/ServiceId"
      required:
        - name
        - enabled
        - accessDetails
        - serviceId
      description: The request body used to create a Trust Domain.

    TrustDomain:
      allOf:
        - type: object
          required:
            - id
          properties:
            id:
              allOf:
                - $ref: "#/components/schemas/Uuid"
              readOnly: true
              description: The server-assigned Trust Domain identifier.
        - $ref: "#/components/schemas/TrustDomainCreate"
        - type: object
          properties:
            createdAt:
              allOf:
                - $ref: "#/components/schemas/DateTime"
              readOnly: true
              description: When the Trust Domain was created.
            createdBy:
              allOf:
                - $ref: "#/components/schemas/Uuid"
              readOnly: true
              description: The identity that created the Trust Domain.
            modifiedAt:
              allOf:
                - $ref: "#/components/schemas/DateTime"
              readOnly: true
              description: When the Trust Domain was last modified.
            modifiedBy:
              allOf:
                - $ref: "#/components/schemas/Uuid"
              readOnly: true
              description: The identity that last modified the Trust Domain.
      description: |
        A Trust Domain. On the `createTrustDomain` response the write-only WPA
        `password` inside any `accessDetails` entry is omitted.

    DeviceType:
      type: string
      enum:
        - AUTOMOTIVE
        - DESKTOP
        - IOT
        - LAPTOP
        - MEDICAL
        - OTHER
        - SMARTPHONE
        - TABLET
        - TV
        - WEARABLE
      description: The category of device being registered in the Trust Domain.
      example: "LAPTOP"

    HardwareAddress:
      type: object
      additionalProperties: false
      required:
        - hardwareAddressType
        - value
      properties:
        hardwareAddressType:
          type: string
          enum:
            - "EUI-48"
          description: The hardware address type. Only EUI-48 (MAC-48) is supported.
          example: "EUI-48"
        value:
          type: string
          pattern: "^([0-9A-Fa-f]{2}[:-]){5}([0-9A-Fa-f]{2})$"
          description: |
            The device's EUI-48 hardware (MAC) address — six 2-hex-digit groups
            separated by `:` or `-`.
          example: "00:11:22:33:44:55"
      description: A device hardware (MAC) address.

    BootstrappingInfo:
      type: object
      additionalProperties: true
      description: |
        Provisioning/bootstrapping details for onboarding the device (e.g. a DPP,
        Matter, or WKSO protocol configuration with a `protocolPreference`
        ordering). CamaraSim accepts and echoes the object but does not validate
        its protocol internals — the full `BootstrappingInfo` shape is a
        documented cut.

    DeviceCredential:
      type: object
      additionalProperties: true
      writeOnly: true
      description: |
        Per-device or shared credential material for the device (e.g. a
        `credentialAction` of `GENERATE` or `ASSIGN`). Write-only — CamaraSim
        accepts it on create but never echoes it in a `TrustDomainDevice`
        response, and does not validate its internals (a documented cut).

    TrustDomainDeviceUpdate:
      type: object
      description: The updatable fields of a Trust Domain Device.
      properties:
        deviceName:
          type: string
          minLength: 1
          maxLength: 255
          description: Human-readable name for the device.
          example: "Alice's Laptop"
        deviceType:
          $ref: "#/components/schemas/DeviceType"
        enabled:
          type: boolean
          description: Whether the device is permitted to authenticate to the Trust Domain.
          example: true
        blocked:
          type: boolean
          description: Whether the device is currently blocked from forwarding data.
          example: false
        hardwareAddress:
          $ref: "#/components/schemas/HardwareAddress"
        bootstrappingInfo:
          $ref: "#/components/schemas/BootstrappingInfo"
        deviceCredential:
          $ref: "#/components/schemas/DeviceCredential"

    TrustDomainDeviceCreate:
      allOf:
        - $ref: "#/components/schemas/TrustDomainDeviceUpdate"
        - type: object
          properties:
            externalId:
              type: string
              minLength: 1
              maxLength: 255
              description: A caller-supplied external identifier for the device.
              example: "asset-42"
      required:
        - deviceName
        - enabled
      description: The request body used to register a device in a Trust Domain.

    TrustDomainDevice:
      allOf:
        - type: object
          required:
            - id
          properties:
            id:
              allOf:
                - $ref: "#/components/schemas/Uuid"
              readOnly: true
              description: The server-assigned device identifier.
        - $ref: "#/components/schemas/TrustDomainDeviceCreate"
        - type: object
          properties:
            ipv4Address:
              type: object
              additionalProperties: true
              readOnly: true
              description: |
                The device's assigned IPv4 address, once associated. CamaraSim
                omits it until the device is associated (a documented cut — no
                live onboarding).
            ipv6Address:
              type: string
              readOnly: true
              description: |
                The device's assigned IPv6 address, once associated. Omitted by
                CamaraSim until association (a documented cut).
            connected:
              type: boolean
              readOnly: true
              description: |
                Whether the device is currently present on the network. A
                freshly created device is `false`.
              example: false
            associated:
              type: boolean
              readOnly: true
              description: |
                Whether the device has completed onboarding/association. A
                freshly created device is `false`.
              example: false
            createdAt:
              allOf:
                - $ref: "#/components/schemas/DateTime"
              readOnly: true
              description: When the device was created.
            createdBy:
              allOf:
                - $ref: "#/components/schemas/Uuid"
              readOnly: true
              description: The identity that created the device.
            modifiedAt:
              allOf:
                - $ref: "#/components/schemas/DateTime"
              readOnly: true
              description: When the device was last modified.
            modifiedBy:
              allOf:
                - $ref: "#/components/schemas/Uuid"
              readOnly: true
              description: The identity that last modified the device.
      description: |
        A device registered in a Trust Domain. On the `createTrustDomainDevice`
        response the write-only `deviceCredential` is omitted, and
        `connected`/`associated` are `false` with no assigned `ipv4Address`/
        `ipv6Address` until the device associates.
