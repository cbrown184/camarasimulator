      parameters:
        - $ref: "#/components/parameters/XCorrelator"
        - name: trustDomainId
          in: path
          required: true
          description: The server-assigned id of the Trust Domain the device belongs to.
          schema:
            type: string
            format: uuid
        - name: deviceId
          in: path
          required: true
          description: The server-assigned id of the device to retrieve.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The requested Trust Domain Device.
          headers:
