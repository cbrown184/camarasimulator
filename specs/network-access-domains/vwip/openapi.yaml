# CamaraSim — Network Access Domains, API version vwip
# (CAMARA NetworkAccessManagement / Network Access Domains, wip).
#
# Vendored from the CAMARA NetworkAccessManagement "Network Access Domains" API
# (work-in-progress — no released version yet, so mounted at its canonical `vwip`
# base path `/network-access-domains/vwip`, like its sibling Network Access
# Devices and the other pre-1.0 wip APIs) and annotated with CamaraSim's
# functional cases (docs/DESIGN.md §7, §9). Backed by
# `src/apis/network_access_domains/vwip.rs`; spec and code must not drift.
#
# So far this vendored slice serves two read-only endpoints:
#   * `GET /trust-domains/capabilities` (getTrustDomainCapabilities) — the
#     provider-level capabilities document describing which Trust Domain access
#     types and policy limits this API provider supports. It has no request body
#     and no device identifier, so — unlike the identifier-keyed APIs — it carries
#     no reserved-error scenario plane: it always answers the same fixed document.
#   * `GET /services` (getServices) — the caller's Services catalog. It has no
#     request body either, but it is keyed to the authenticated identity, so its
#     control plane is the token subject (DESIGN §7): a reserved error suffix →
#     the canonical CAMARA error; else the subject's trailing three digits fix the
#     returned ServiceList deterministically.
# The single-service `GET /services/{serviceId}` read and the Trust Domain CRUD
# legs remain to be added in later slices.
openapi: 3.0.3
info:
  title: Network Access Domains
  description: |
    Service for configuring **home-network access domains** — Trust Domains that
    group devices under a common access policy (Wi-Fi or Thread) on the
    subscriber's home network. This is part of the CAMARA Home Devices family and
    the CamaraSim reference double for the CAMARA NetworkAccessManagement
    "Network Access Domains" API (wip).

    ## `GET /trust-domains/capabilities`

    Returns the set of Trust Domain configuration capabilities the API provider
    supports: which access types (Wi-Fi WPA-Personal/Enterprise, Thread) and
    their properties, plus the policy limits (max devices, per-domain
    up/downstream bandwidth bands, egress-list constraints) a caller may configure
    when creating a Trust Domain. It requires the `network-access-domains:trust-domains`
    scope.

    ## `GET /services`

    Returns the caller's **Services** catalog — a `ServiceList` of the logical
    commercial subscriptions / account relationships the authenticated identity
    holds, each tied to a `serviceSite` (a subscriber location). It requires the
    `network-access-domains:services:read` scope.

    ## Functional cases — the input is the control plane (docs/DESIGN.md §7)

    **`getTrustDomainCapabilities`** — provider capabilities are fixed operator
    configuration, not keyed to any device or subscriber, so this operation has
    **no** parameter-driven control plane: given a token carrying the required
    scope it always answers the same deterministic `TrustDomainCapabilities`
    document (`200`).

    **`getServices`** has no request body either, but it is keyed to the
    authenticated identity, so its control plane is the **token subject**: a
    reserved error suffix on the subject → the canonical CAMARA error; otherwise
    the subject's trailing three digits `d` fix the catalog deterministically —
    `d == 0` (`…000` / no digits) → `200 []` (nothing associated; a list never
    404s), else `((d - 1) % 3) + 1` services (1–3), each with a deterministic
    UUID-shaped `id` and `serviceSite`.

    For both, a missing/invalid token → `401`; a token without the endpoint's
    scope → `403` (both from the shared resource-server layer).

    ## Documented cuts

    - Only the read-only `getTrustDomainCapabilities` and `getServices` legs are
      implemented so far; the single-service `getService`
      (`GET /services/{serviceId}`) read and the stateful Trust Domain / Trust
      Domain Device CRUD resources are later slices.
    - The Services catalog is a deterministic, representative set (no real billing
      backend): the returned service/site names are simulator defaults, keyed only
      to the identity, and `serviceSite.location` (geo/address) is omitted (both
      are optional in the schema).
    - The advertised capabilities are a fixed, representative set covering all four
      CAMARA access-type variants' families (Wi-Fi WPA-Personal, Wi-Fi
      WPA-Enterprise, Thread) and all four policy capabilities; the exact values
      are simulator defaults (schema-valid), not negotiated per operator.
  version: "wip"
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: "{apiRoot}/network-access-domains/vwip"
    variables:
      apiRoot:
        default: http://localhost:8080
        description: API root, e.g. the CamaraSim base URL.

paths:
  /trust-domains/capabilities:
    get:
      operationId: getTrustDomainCapabilities
      summary: Get Trust Domain capabilities
      description: |
        Retrieves the set of Trust Domain configuration capabilities supported by
        the API provider — the supported access types and their variants, and the
        policy limits (max devices, per-domain bandwidth bands, egress-list
        constraints) a caller may configure.

        There is no request body and no device identifier: capabilities are fixed
        provider configuration, so this operation has no parameter-driven control
        plane and always returns the same document (docs/DESIGN.md §7).
      security:
        - openId:
            - network-access-domains:trust-domains
      parameters:
        - $ref: "#/components/parameters/XCorrelator"
      responses:
        "200":
          description: Trust Domain capabilities supported by this API provider.
          headers:
            x-correlator:
              $ref: "#/components/headers/XCorrelator"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrustDomainCapabilities"
              examples:
                capabilities:
                  summary: The provider's fixed Trust Domain capabilities
                  value:
                    supportedAccessTypes:
                      - accessType: "Wi-Fi:WPA_PERSONAL"
                        wifiProperties:
                          ssidRequired: true
                          supportedSecurityModes:
                            - WPA2-Personal
                            - WPA3-Personal
                            - WPA2-WPA3-Personal
                          passwordConstraints:
                            minLength: 8
                            maxLength: 63
                            requireSpecialCharacters: false
                          authServerRequired: false
                      - accessType: "Wi-Fi:WPA_ENTERPRISE"
                        wifiProperties:
                          ssidRequired: true
                          supportedSecurityModes:
                            - WPA2-Enterprise
                            - WPA3-Enterprise
                          authServerRequired: true
                      - accessType: "Thread:STRUCTURED"
                        threadProperties:
                          supportedChannels:
                            min: 11
                            max: 26
                          networkKeyFormat: "32-hex-digits"
                          networkNameConstraints:
                            minLength: 1
                            maxLength: 16
                          maxDatasetLength: 254
                    supportedPolicies:
                      maxDevices:
                        minValue: 1
                        maxValue: 100
                      maxDomainDownstreamRate:
                        minValue: 1000000
                        maxValue: 1000000000
                      maxDomainUpstreamRate:
                        minValue: 1000000
                        maxValue: 1000000000
                      egressAllowedList:
                        maxEntries: 50
                        supportedDestinationTypes:
                          - IP
                          - FQDN
                          - CIDR
        "400":
          $ref: "../../shared/errors.yaml#/components/responses/InvalidArgument"
        "401":
          $ref: "../../shared/errors.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../../shared/errors.yaml#/components/responses/PermissionDenied"
        "500":
          $ref: "../../shared/errors.yaml#/components/responses/Internal"
        "503":
          $ref: "../../shared/errors.yaml#/components/responses/Unavailable"
      x-camarasim-scenarios:
        description: >-
          Provider capabilities are fixed operator configuration with no
          device/subscriber key, so this operation has no parameter-driven control
          plane (docs/DESIGN.md §7): a scoped token always yields the same
          document.
        cases:
          - input: a token carrying the network-access-domains:trust-domains scope
            result: "200 — the fixed TrustDomainCapabilities document"
          - input: a token without the scope
            result: "403 PERMISSION_DENIED"
          - input: no / invalid token
            result: "401 UNAUTHENTICATED"

  /services:
    get:
      operationId: getServices
      summary: Retrieve the services for the authenticated identity
      description: |
        Retrieves the caller's `ServiceList` — the logical commercial
        subscriptions / account relationships (each tied to a `serviceSite`) the
        authenticated identity holds.

        There is no request body: the operation is keyed to the authenticated
        identity (the token subject), which is its control plane
        (docs/DESIGN.md §7). A list never 404s — an identity with nothing
        associated yields an empty array.
      security:
        - openId:
            - network-access-domains:services:read
      parameters:
        - $ref: "#/components/parameters/XCorrelator"
      responses:
        "200":
          description: The services associated with the authenticated identity.
          headers:
            x-correlator:
              $ref: "#/components/headers/XCorrelator"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceList"
              examples:
                twoServices:
                  summary: An identity with two services
                  value:
                    - id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                      name: "Main Home Internet"
                      description: "Internet subscription for primary residence"
                      serviceSite:
                        id: "123e4567-e89b-12d3-a456-426614174000"
                        name: "Primary Residence"
                        description: "123 Main Street"
                    - id: "123e4567-e89b-12d3-a456-426614174001"
                      name: "Vacation Home Internet"
                      description: "Internet subscription for vacation home"
                      serviceSite:
                        id: "123e4567-e89b-12d3-a456-426614174002"
                        name: "Vacation Home"
                        description: "45 Lakeside Road"
                empty:
                  summary: An identity with no associated services
                  value: []
        "400":
          $ref: "../../shared/errors.yaml#/components/responses/InvalidArgument"
        "401":
          $ref: "../../shared/errors.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../../shared/errors.yaml#/components/responses/PermissionDenied"
        "404":
          $ref: "../../shared/errors.yaml#/components/responses/NotFound"
        "429":
          $ref: "../../shared/errors.yaml#/components/responses/TooManyRequests"
        "500":
          $ref: "../../shared/errors.yaml#/components/responses/Internal"
        "503":
          $ref: "../../shared/errors.yaml#/components/responses/Unavailable"
      x-camarasim-scenarios:
        description: >-
          getServices is keyed to the authenticated identity (the token subject),
          which is its control plane (docs/DESIGN.md §7). A reserved error suffix
          on the subject selects the canonical CAMARA error; otherwise the
          subject's trailing three digits `d` fix the ServiceList
          deterministically.
        cases:
          - input: "subject trailing digits …000 (or no digits)"
            result: "200 — an empty ServiceList (nothing associated)"
          - input: "subject trailing digits …001"
            result: "200 — 1 service"
          - input: "subject trailing digits …005"
            result: "200 — 2 services ((5-1) % 3 + 1)"
          - input: "subject trailing digits …003"
            result: "200 — 3 services"
          - input: "subject trailing digits …404"
            result: "404 NOT_FOUND (reserved error suffix)"
          - input: "subject trailing digits …429"
            result: "429 TOO_MANY_REQUESTS (reserved error suffix)"
          - input: a token without the network-access-domains:services:read scope
            result: "403 PERMISSION_DENIED"
          - input: no / invalid token
            result: "401 UNAUTHENTICATED"

components:
  securitySchemes:
    openId:
      $ref: "../../auth/openapi.yaml#/components/securitySchemes/camaraOAuth"

  parameters:
    XCorrelator:
      name: x-correlator
      in: header
      required: false
      description: Correlation id for the request, echoed back on the response.
      schema:
        type: string

  headers:
    XCorrelator:
      description: The `x-correlator` from the request, echoed if one was sent.
      required: false
      schema:
        type: string

  schemas:
    TrustDomainCapabilities:
      type: object
      additionalProperties: false
      description: |
        Describes the Trust Domain configuration capabilities supported by this
        API provider.
      required:
        - supportedAccessTypes
      properties:
        supportedAccessTypes:
          type: array
          minItems: 1
          maxItems: 4
          description: List of supported access types and their variants.
          items:
            $ref: "#/components/schemas/SupportedAccessType"
        supportedPolicies:
          type: object
          additionalProperties: false
          description: Map of supported policy types to their capability details.
          properties:
            maxDevices:
              $ref: "#/components/schemas/MaxDevicesPolicyCapability"
            maxDomainDownstreamRate:
              $ref: "#/components/schemas/BandwidthPolicyCapability"
            maxDomainUpstreamRate:
              $ref: "#/components/schemas/BandwidthPolicyCapability"
            egressAllowedList:
              $ref: "#/components/schemas/EgressPolicyCapability"

    SupportedAccessType:
      type: object
      description: |
        A supported access type. `accessType` is the discriminator; the remaining
        properties belong to the matching variant (Wi-Fi variants carry
        `wifiProperties`, Thread variants carry `threadProperties`).
      required:
        - accessType
      discriminator:
        propertyName: accessType
      properties:
        accessType:
          type: string
          enum:
            - "Wi-Fi:WPA_PERSONAL"
            - "Wi-Fi:WPA_ENTERPRISE"
            - "Thread:STRUCTURED"
            - "Thread:TLV"
          description: The access type identifier.
        wifiProperties:
          $ref: "#/components/schemas/WiFiAccessTypeProperties"
        threadProperties:
          $ref: "#/components/schemas/ThreadAccessTypeProperties"

    WiFiAccessTypeProperties:
      type: object
      additionalProperties: false
      description: The configuration properties supported for a Wi-Fi access type.
      properties:
        ssidRequired:
          type: boolean
          example: true
        supportedSecurityModes:
          type: array
          maxItems: 5
          items:
            type: string
            enum:
              - WPA2-Personal
              - WPA3-Personal
              - WPA2-WPA3-Personal
              - WPA2-Enterprise
              - WPA3-Enterprise
        passwordConstraints:
          $ref: "#/components/schemas/PasswordConstraints"
        authServerRequired:
          type: boolean
          example: false

    PasswordConstraints:
      type: object
      additionalProperties: false
      description: The constraints on a Wi-Fi pre-shared-key / password.
      required:
        - minLength
        - maxLength
      properties:
        minLength:
          type: integer
          format: int32
          minimum: 8
          maximum: 63
          example: 8
        maxLength:
          type: integer
          format: int32
          minimum: 8
          maximum: 63
          example: 63
        requireSpecialCharacters:
          type: boolean
          example: false

    ThreadAccessTypeProperties:
      type: object
      additionalProperties: false
      description: The configuration properties supported for a Thread access type.
      properties:
        supportedChannels:
          type: object
          additionalProperties: false
          required:
            - min
            - max
          properties:
            min:
              type: integer
              minimum: 11
              maximum: 26
              example: 11
            max:
              type: integer
              minimum: 11
              maximum: 26
              example: 26
        networkKeyFormat:
          type: string
          enum:
            - "32-hex-digits"
        networkNameConstraints:
          type: object
          additionalProperties: false
          required:
            - minLength
            - maxLength
          properties:
            minLength:
              type: integer
              minimum: 1
              maximum: 16
              example: 1
            maxLength:
              type: integer
              minimum: 1
              maximum: 16
              example: 16
        maxDatasetLength:
          type: integer
          minimum: 1
          maximum: 254
          example: 254

    MaxDevicesPolicyCapability:
      type: object
      additionalProperties: false
      description: The supported range for the max-devices-per-domain policy.
      required:
        - maxValue
        - minValue
      properties:
        minValue:
          type: integer
          format: int32
          minimum: 1
          maximum: 1024
          example: 1
        maxValue:
          type: integer
          format: int32
          minimum: 1
          maximum: 1024
          example: 100

    BandwidthPolicyCapability:
      type: object
      additionalProperties: false
      description: The supported range (bits/second) for a per-domain bandwidth policy.
      required:
        - maxValue
        - minValue
      properties:
        minValue:
          type: integer
          format: int64
          minimum: 0
          maximum: 10000000000
          example: 1000000
        maxValue:
          type: integer
          format: int64
          minimum: 0
          maximum: 10000000000
          example: 1000000000

    EgressPolicyCapability:
      type: object
      additionalProperties: false
      description: The constraints on a Trust Domain egress allow-list policy.
      required:
        - maxEntries
        - supportedDestinationTypes
      properties:
        maxEntries:
          type: integer
          format: int32
          minimum: 1
          maximum: 1024
          example: 50
        supportedDestinationTypes:
          type: array
          maxItems: 3
          items:
            type: string
            enum:
              - IP
              - FQDN
              - CIDR

    ServiceId:
      type: string
      format: uuid
      description: |
        A unique identifier that represents a service account. A valid UUID (RFC
        4122, versions 1-5) using only lowercase hexadecimal characters.
      example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"

    ServiceList:
      type: array
      description: A list of services accessible to the calling identity.
      maxItems: 100
      items:
        $ref: "#/components/schemas/Service"

    Service:
      type: object
      description: |
        A service represents a logical commercial subscription or account
        relationship between a network operator and a subscriber (residential,
        commercial, public Wi-Fi, or other service types).
      required:
        - id
      properties:
        id:
          $ref: "#/components/schemas/ServiceId"
        name:
          type: string
          maxLength: 64
          description: Optional friendly name for the service.
          example: "Main Home Internet"
        description:
          type: string
          maxLength: 255
          description: Optional description of the service.
          example: "Internet subscription for primary residence"
        serviceSite:
          $ref: "#/components/schemas/ServiceSite"

    ServiceSite:
      type: object
      description: |
        A Service Site represents a subscriber location associated with one or
        more Network Access Devices.
      required:
        - id
      properties:
        id:
          $ref: "#/components/schemas/ServiceId"
        name:
          type: string
          maxLength: 64
          description: The name of the service site.
          example: "Primary Residence"
        description:
          type: string
          maxLength: 64
          description: A textual description of the service site.
          example: "123 Main Street"
