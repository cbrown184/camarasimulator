  /trust-domains/{trustDomainId}/devices:
    post:
      operationId: createTrustDomainDevice
      summary: Register a device in a Trust Domain
      description: |
        Registers a device inside an existing Trust Domain. The caller submits a
        `TrustDomainDeviceCreate` (a required `deviceName` + `enabled`, plus the
        optional `externalId`/`deviceType`/`blocked`/`hardwareAddress`/
        `bootstrappingInfo`/`deviceCredential`); the simulator mints a
        server-assigned `deviceId`, stores the device in memory under its owning
        Trust Domain, and returns the full `TrustDomainDevice` (`201`).

        Four control planes drive the outcome (docs/DESIGN.md §7):

        1. **The token subject** — a reserved error suffix on the authenticated
           identity selects the canonical CAMARA error (an account-level plane,
           checked first, mirroring `createTrustDomain`).
        2. **Request validation** — a missing/blank/oversized `deviceName`, a
           missing or non-boolean `enabled`, an out-of-range `externalId`, a
           non-boolean `blocked`, an unknown `deviceType`, or a malformed
           `hardwareAddress` (`hardwareAddressType` other than `EUI-48`, or a
           `value` that is not an EUI-48 MAC) → `400 INVALID_ARGUMENT`.
        3. **Parent cross-reference** — the `{trustDomainId}` path must name a
           Trust Domain already created (in the in-memory store), else
           `404 NOT_FOUND`. Validation is checked before this, so a body `400`
           wins over the parent `404`.
        4. **Store state** — the `deviceId` is derived from the
           `(trustDomainId, deviceName)` pair, so creating a device with the same
           `deviceName` in the same Trust Domain collides → `409` (duplicate
           device name in the Trust Domain).

        A freshly created device is not yet `associated`/`connected` and holds no
        assigned network address, so `connected`/`associated` are rendered
        `false` and `ipv4Address`/`ipv6Address` are omitted until association (a
        documented cut — the simulator has no live onboarding). The write-only
        `deviceCredential` is stripped from the echoed `TrustDomainDevice`, and
        the nested `bootstrappingInfo`/`deviceCredential` contents are validated
        only for object shape (documented cuts, mirroring the Trust Domain
        `policies`).
      security:
        - openId:
            - network-access-domains:devices
      parameters:
        - $ref: "#/components/parameters/XCorrelator"
        - name: trustDomainId
          in: path
          required: true
          description: The server-assigned id of the Trust Domain to add the device to.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrustDomainDeviceCreate"
            examples:
              laptop:
                summary: A laptop identified by its EUI-48 hardware address
                value:
                  deviceName: "Alice's Laptop"
                  deviceType: "LAPTOP"
                  enabled: true
                  hardwareAddress:
                    hardwareAddressType: "EUI-48"
                    value: "00:11:22:33:44:55"
      responses:
        "201":
          description: The device was registered in the Trust Domain.
          headers:
            x-correlator:
              $ref: "#/components/headers/XCorrelator"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrustDomainDevice"
              examples:
                created:
                  summary: The created device (write-only deviceCredential omitted)
                  value:
                    id: "c2f1a7b3-8d4e-5f6a-9b0c-1d2e3f4a5b6c"
                    deviceName: "Alice's Laptop"
                    deviceType: "LAPTOP"
                    enabled: true
                    hardwareAddress:
                      hardwareAddressType: "EUI-48"
                      value: "00:11:22:33:44:55"
                    connected: false
                    associated: false
                    createdAt: "2024-01-01T09:00:00Z"
                    createdBy: "4a7c9e2d-1b3f-5a6c-9d8e-0f1a2b3c4d5e"
                    modifiedAt: "2024-01-01T09:00:00Z"
                    modifiedBy: "4a7c9e2d-1b3f-5a6c-9d8e-0f1a2b3c4d5e"
        "400":
          $ref: "../../shared/errors.yaml#/components/responses/InvalidArgument"
        "401":
          $ref: "../../shared/errors.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../../shared/errors.yaml#/components/responses/PermissionDenied"
        "404":
          $ref: "../../shared/errors.yaml#/components/responses/NotFound"
        "409":
          $ref: "../../shared/errors.yaml#/components/responses/Conflict"
        "429":
          $ref: "../../shared/errors.yaml#/components/responses/TooManyRequests"
        "500":
          $ref: "../../shared/errors.yaml#/components/responses/Internal"
        "503":
          $ref: "../../shared/errors.yaml#/components/responses/Unavailable"
      x-camarasim-scenarios:
        description: >-
          createTrustDomainDevice has four control planes (docs/DESIGN.md §7): the
          token subject's reserved error suffix (checked first), request
          validation, the parent Trust Domain's existence, and the in-memory
          device store (a duplicate deviceName in the Trust Domain collides). The
          deviceId is derived from the (trustDomainId, deviceName) pair, so the
          same name in the same Trust Domain re-mints the same id and is rejected
          as a duplicate.
        cases:
          - input: "a valid TrustDomainDeviceCreate for an existing Trust Domain"
            result: "201 — the created TrustDomainDevice (deviceCredential stripped, connected/associated false)"
          - input: "a second create with the same deviceName in the same Trust Domain"
            result: "409 — duplicate device name in the Trust Domain"
          - input: "a different deviceName in the same Trust Domain"
            result: "201 — a distinct device"
          - input: "missing/blank/over-255-char deviceName, missing/ill-typed enabled, or out-of-range externalId"
            result: "400 INVALID_ARGUMENT"
          - input: "an unknown deviceType, or a hardwareAddress with a non-EUI-48 type or a value that is not an EUI-48 MAC"
            result: "400 INVALID_ARGUMENT"
          - input: "an invalid body against an unknown trustDomainId"
            result: "400 INVALID_ARGUMENT (validation precedes the parent lookup)"
          - input: "a valid body against a well-formed but never-created trustDomainId"
            result: "404 NOT_FOUND (parent Trust Domain does not exist)"
          - input: "the token subject trailing digits are …404"
            result: "404 NOT_FOUND (reserved error suffix, account-level, before the parent lookup)"
          - input: "the token subject trailing digits are …429"
            result: "429 TOO_MANY_REQUESTS (reserved error suffix, account-level)"
          - input: a token without the network-access-domains:devices scope
            result: "403 PERMISSION_DENIED"
          - input: no / invalid token
            result: "401 UNAUTHENTICATED"

  /trust-domains/{trustDomainId}/devices/{deviceId}:
    get:
      operationId: getTrustDomainDevice
      summary: Retrieve a device in a Trust Domain by id
      description: |
        Retrieves a single `TrustDomainDevice` by the server-assigned `deviceId`
        that `createTrustDomainDevice` returned, inside its owning
        `trustDomainId`.

        There is no request body: the operation is keyed only to the in-memory
        device store (docs/DESIGN.md §7). Unlike the device *create* leg — which
        keys off the token subject to reach the account-level reserved-error set —
        the `deviceId` is an opaque, SHA-256-derived UUID over the
        `(trustDomainId, deviceName)` pair that the caller cannot construct, so it
        is not itself a scenario plane and the token subject is not consulted (the
        read is store-only, mirroring `getTrustDomain`). A stored
        `(trustDomainId, deviceId)` pair → `200` with the persisted
        `TrustDomainDevice` (the write-only `deviceCredential` was already stripped
        at create); any other pair → `404 NOT_FOUND`. Because the store is keyed by
        the full pair, an unknown parent Trust Domain, an unknown device, a device
        that belongs to a *different* Trust Domain, and a malformed id all fold
        into the same `404` (one store lookup).
      security:
        - openId:
