# CamaraSim — Region Device Count, API version v0.2 (CAMARA 0.2.0).
#
# Vendored from the CAMARA Region Device Count API (region-device-count 0.2.0,
# meta-release r2.2 — the latest published version) and annotated with
# CamaraSim's parameter-driven functional cases (docs/DESIGN.md §7, §9). Backed
# by `src/apis/region_device_count/v0_2.rs`; spec and code must not drift.
#
# Mounted under its real published name/version (mirroring the KYC Match v0.3 /
# Customer Insights v0.2 / Connectivity Insights v0.6 decisions — DESIGN §9).
#
# Serves the synchronous `POST /count`. The API's asynchronous `sink`/CloudEvents
# delivery surface is a documented cut (mirroring the deferred TLS/notification
# work across the stateful APIs): a `sink` is accepted (and unblocks the large-
# region case) but no callback is delivered.
openapi: 3.0.3
info:
  title: Region Device Count
  description: |
    Returns how many devices are within a geographic region (a `CIRCLE` or a
    `POLYGON`) during an optional time interval — a privacy-preserving aggregate
    count with a coverage `status`, never a per-device location.

    This is the CamaraSim reference double for CAMARA Region Device Count 0.2.0.
    Unlike most CAMARA APIs it is **not** identifier-keyed (there is no
    phone/device id); it is protected by a two-legged access token carrying the
    `region-device-count:count` scope, and its functional cases are driven by the
    **area geometry** and the optional `filter`.

    ## Functional cases — the input is the control plane (docs/DESIGN.md §7)

    Two control planes key off the region's **characteristic radius** `r`
    (a `CIRCLE`'s `radius` in metres; a `POLYGON`'s `sqrt(area / π)`), plus the
    optional `filter`:

    - **Region size** — a region too large to answer:
      - `r > 1 000 000` m → `400 REGION_DEVICE_COUNT.UNSUPPPORTED_REQUEST` (too
        large for any processing; the triple-`P` code is verbatim from CAMARA).
      - `500 000 < r ≤ 1 000 000` m → answerable only asynchronously: with no
        `sink` → `400 REGION_DEVICE_COUNT.UNSUPPORTED_SYNC_RESPONSE`; with a
        `sink` it is accepted and answered **synchronously** (async delivery is
        not modelled — a documented cut).
    - **Status / count** — otherwise the trailing three digits `d` of `round(r)`
      pick the coverage case:
      - `d == 429` → `429 TOO_MANY_REQUESTS` (a rate limit reachable from input).
      - `d == 1` → `PART_OF_AREA_NOT_SUPPORTED` (a `count` for the covered ~50%).
      - `d == 2` → `AREA_NOT_SUPPORTED` (no `count`).
      - `d == 3` → `DENSITY_BELOW_PRIVACY_THRESHOLD` (no `count`).
      - `d == 4` → `TIME_INTERVAL_NO_DATA_FOUND` (no `count`).
      - any other `d` (incl. `0` / fewer than three digits) → `SUPPORTED_AREA`
        (with a `count`).
    - **Filter** — when a `count` is returned, it is proportional to the region's
      area at a fixed density (500 devices/km²) and **narrowed by `filter`**: each
      selected `roamingStatus`/`deviceType` category contributes its fixed share
      (`non-roaming` 0.85, `roaming` 0.15; `human device` 0.70, `IoT device`
      0.25, `other` 0.05), so `filter` is a genuine second control plane (the same
      region returns a smaller count when filtered).

    ## Validation

    - `CIRCLE` missing `center`/`radius` → `400
      REGION_DEVICE_COUNT.INVALID_CIRCLE_AREA`; `radius < 1` or a `center` out of
      range → `400 INVALID_ARGUMENT`.
    - `POLYGON` `boundary` not 3–15 valid points (or a degenerate zero-area
      shape) → `400 REGION_DEVICE_COUNT.INVALID_POLYGON_AREA`.
    - `starttime`/`endtime` one-without-the-other → `400
      REGION_DEVICE_COUNT.TIME_INVALID_ARGUMENT`; `endtime` before `starttime` →
      `400 REGION_DEVICE_COUNT.INVALID_END_DATE`; malformed timestamp → `400
      INVALID_ARGUMENT`.
    - `filter` present but empty, or an out-of-enum value → `400 INVALID_ARGUMENT`.
    - `sinkCredential.credentialType` other than `ACCESSTOKEN` → `400
      INVALID_CREDENTIAL`; non-`bearer` `accessTokenType` → `400 INVALID_TOKEN`.

    Examples: a `CIRCLE` `radius: 2000` → `SUPPORTED_AREA` count 6283;
    `radius: 2002` → `AREA_NOT_SUPPORTED`; `radius: 2429` → `429`;
    `radius: 1000001` → `400 UNSUPPPORTED_REQUEST`.
  version: "0.2.0"
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: "{apiRoot}/region-device-count/v0.2"
    variables:
      apiRoot:
        default: http://localhost:8080
        description: API root, e.g. the CamaraSim base URL.

paths:
  /count:
    post:
      operationId: count
      summary: Count devices in a region
      description: |
        Returns the number of devices in the supplied `area` during the optional
        time interval, together with a coverage `status`.

        See the API description for the parameter-driven functional cases. The
        asynchronous `sink` delivery path is not modelled: a `sink` is accepted
        (and unblocks the large-region case) but no callback is delivered.
      security:
        - openId:
            - region-device-count:count
      parameters:
        - $ref: "#/components/parameters/XCorrelator"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegionDeviceCountRequestBody"
      responses:
        "200":
          description: The device count and coverage status for the region.
          headers:
            x-correlator:
              $ref: "#/components/headers/XCorrelator"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegionDeviceCountResponse"
              examples:
                supported:
                  summary: Fully supported area (count returned)
                  value:
                    count: 6283
                    status: SUPPORTED_AREA
                partial:
                  summary: Partially supported area (count for the covered part)
                  value:
                    count: 3142
                    status: PART_OF_AREA_NOT_SUPPORTED
                belowThreshold:
                  summary: Below the privacy threshold (no count)
                  value:
                    status: DENSITY_BELOW_PRIVACY_THRESHOLD
        "400":
          description: |
            400 — invalid request. CamaraSim returns the shared `INVALID_ARGUMENT`
            for a malformed body / out-of-range `center` / `radius < 1` /
            malformed time / empty or bad `filter`, plus the Region Device Count
            specific codes: `REGION_DEVICE_COUNT.INVALID_CIRCLE_AREA`,
            `REGION_DEVICE_COUNT.INVALID_POLYGON_AREA`,
            `REGION_DEVICE_COUNT.TIME_INVALID_ARGUMENT`,
            `REGION_DEVICE_COUNT.INVALID_END_DATE`,
            `REGION_DEVICE_COUNT.UNSUPPORTED_SYNC_RESPONSE`,
            `REGION_DEVICE_COUNT.UNSUPPPORTED_REQUEST` (triple-`P`, verbatim from
            CAMARA), `INVALID_CREDENTIAL`, and `INVALID_TOKEN`.
          headers:
            x-correlator:
              $ref: "#/components/headers/XCorrelator"
          content:
            application/json:
              schema:
                $ref: "../../shared/errors.yaml#/components/schemas/CamaraError"
              examples:
                invalidCircleArea:
                  summary: CIRCLE missing center or radius
                  value:
                    status: 400
                    code: REGION_DEVICE_COUNT.INVALID_CIRCLE_AREA
                    message: A CIRCLE area requires both `center` and `radius`.
                unsupportedSync:
                  summary: Too large for a synchronous response
                  value:
                    status: 400
                    code: REGION_DEVICE_COUNT.UNSUPPORTED_SYNC_RESPONSE
                    message: The requested area/time is too large for a synchronous response; supply a `sink`.
                unsupportedRequest:
                  summary: Too large for any processing
                  value:
                    status: 400
                    code: REGION_DEVICE_COUNT.UNSUPPPORTED_REQUEST
                    message: The requested area/time is too large to be processed.
        "401":
          $ref: "../../shared/errors.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../../shared/errors.yaml#/components/responses/PermissionDenied"
        "429":
          $ref: "../../shared/errors.yaml#/components/responses/TooManyRequests"
      x-camarasim-scenarios:
        description: >-
          The coverage status and count are selected from the region's
          characteristic radius `r` (a CIRCLE's radius; a POLYGON's
          sqrt(area/π)) and the optional filter (docs/DESIGN.md §7). Canonical
          Region Device Count 0.2.0 also declares 410 GONE for the asynchronous
          callback path, which CamaraSim does not model (async delivery is a
          documented cut).
        cases:
          - input: "radius > 1 000 000 m"
            result: "400 REGION_DEVICE_COUNT.UNSUPPPORTED_REQUEST"
          - input: "500 000 < radius ≤ 1 000 000 m, no sink"
            result: "400 REGION_DEVICE_COUNT.UNSUPPORTED_SYNC_RESPONSE"
          - input: "500 000 < radius ≤ 1 000 000 m, with sink"
            result: "200 — answered synchronously (no async callback delivered)"
          - input: "radius round trailing digits …429"
            result: "429 TOO_MANY_REQUESTS"
          - input: "radius round trailing digits …001"
            result: "200 PART_OF_AREA_NOT_SUPPORTED (count for the covered ~50%)"
          - input: "radius round trailing digits …002"
            result: "200 AREA_NOT_SUPPORTED (no count)"
          - input: "radius round trailing digits …003"
            result: "200 DENSITY_BELOW_PRIVACY_THRESHOLD (no count)"
          - input: "radius round trailing digits …004"
            result: "200 TIME_INTERVAL_NO_DATA_FOUND (no count)"
          - input: "any other radius (e.g. …000)"
            result: "200 SUPPORTED_AREA with a count (density 500/km², narrowed by filter)"
          - input: "filter with roamingStatus/deviceType"
            result: "200 — count narrowed by the selected categories' fixed shares"

components:
  securitySchemes:
    openId:
      $ref: "../../auth/openapi.yaml#/components/securitySchemes/camaraOAuth"

  parameters:
    XCorrelator:
      name: x-correlator
      in: header
      required: false
      description: Correlation id for the request, echoed back on the response.
      schema:
        type: string

  headers:
    XCorrelator:
      description: The `x-correlator` from the request, echoed if one was sent.
      required: false
      schema:
        type: string

  schemas:
    RegionDeviceCountRequestBody:
      type: object
      required:
        - area
      properties:
        area:
          $ref: "#/components/schemas/Area"
        starttime:
          type: string
          format: date-time
          nullable: true
          description: Start of the time interval (RFC 3339). Must accompany `endtime`.
          example: "2023-07-03T14:27:08.312+02:00"
        endtime:
          type: string
          format: date-time
          nullable: true
          description: End of the time interval (RFC 3339). Must accompany `starttime`.
          example: "2023-07-04T14:27:08.312+02:00"
        filter:
          $ref: "#/components/schemas/Filter"
        sink:
          type: string
          format: uri
          description: >-
            Callback URL for asynchronous delivery. CamaraSim does not deliver a
            callback (async delivery is a documented cut) but accepts a `sink`,
            which unblocks the large-region case.
          example: "https://application-server.com/callback"
        sinkCredential:
          $ref: "#/components/schemas/SinkCredential"

    Area:
      type: object
      description: >-
        A geographic area, discriminated by `areaType` (`CIRCLE` or `POLYGON`).
      required:
        - areaType
      properties:
        areaType:
          type: string
          enum: [CIRCLE, POLYGON]
          description: The area type.
        center:
          $ref: "#/components/schemas/Point"
        radius:
          type: number
          description: Radius of a CIRCLE area, in metres.
          minimum: 1
        boundary:
          type: array
          description: The ordered vertices of a POLYGON area (3–15 points).
          minItems: 3
          maxItems: 15
          items:
            $ref: "#/components/schemas/Point"

    Point:
      type: object
      required:
        - latitude
        - longitude
      properties:
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180

    Filter:
      type: object
      description: >-
        Narrows the count. At least one criterion must be present; each is a
        non-empty array of enum values.
      minProperties: 1
      properties:
        roamingStatus:
          type: array
          minItems: 1
          items:
            type: string
            enum: [roaming, non-roaming]
        deviceType:
          type: array
          minItems: 1
          items:
            type: string
            enum: ["human device", "IoT device", "other"]

    SinkCredential:
      type: object
      description: >-
        Credential for the callback `sink`. Only `ACCESSTOKEN` with a `bearer`
        `accessTokenType` is supported (else `400 INVALID_CREDENTIAL` /
        `400 INVALID_TOKEN`). Read leniently so a `PLAIN`/`REFRESHTOKEN`
        credential parses and is then rejected by its `credentialType`.
      required:
        - credentialType
      properties:
        credentialType:
          type: string
          enum: [PLAIN, ACCESSTOKEN, REFRESHTOKEN]
        accessToken:
          type: string
        accessTokenExpiresUtc:
          type: string
          format: date-time
        accessTokenType:
          type: string
          enum: [bearer]

    RegionDeviceCountResponse:
      type: object
      required:
        - status
      properties:
        count:
          type: integer
          format: int64
          minimum: 0
          description: >-
            The device count. Present for `SUPPORTED_AREA` and
            `PART_OF_AREA_NOT_SUPPORTED`; absent otherwise.
        status:
          type: string
          enum:
            - SUPPORTED_AREA
            - PART_OF_AREA_NOT_SUPPORTED
            - AREA_NOT_SUPPORTED
            - DENSITY_BELOW_PRIVACY_THRESHOLD
            - TIME_INTERVAL_NO_DATA_FOUND
          description: The coverage status for the requested region/interval.
