# CamaraSim — Carrier Billing, API version v0.5 (CAMARA 0.5.0, release r3.2).
#
# Vendored from the CAMARA Carrier Billing API (carrier-billing 0.5.0, the first
# public release, shipped in release r3.2) and annotated with CamaraSim's
# parameter-driven functional cases (docs/DESIGN.md §7, §9). Backed by
# `src/apis/carrier_billing/v0_5.rs`; spec and code must not drift.
#
# Carrier Billing has never reached 1.0.0, so — like KYC Match v0.3 and Location
# Retrieval v0.4 — it is mounted under its real published sub-1.0 version
# `/carrier-billing/v0.5` rather than a loose "v1" (DESIGN §9).
#
# This slice serves only `POST /payments` (the one-step `createPayment`). The
# read/prepare/validate/confirm/cancel operations are later slices.
openapi: 3.0.3
info:
  title: Carrier Billing
  description: |
    Charges a purchase to an end user's mobile account: the operator adds it to
    the phone bill or deducts it from prepaid credit. This is the CamaraSim
    reference double for CAMARA Carrier Billing 0.5.0.

    In this version only **one-off** (one-step) payments are covered:
    `POST /payments` creates *and* charges a payment in a single call, so a
    happy path returns `201` with `paymentStatus: "succeeded"`. There is no real
    billing system — the outcome is chosen deterministically from the input.

    The account to charge is identified either by `amountTransaction.phoneNumber`
    in the request body (two-legged / CIBA) or by the identity a three-legged
    access token authenticated (in which case `phoneNumber` is omitted). The
    endpoint requires the `carrier-billing:payments:create` scope.

    ## Functional cases — the input is the control plane (docs/DESIGN.md §7)

    Two independent control planes:

    1. **The charged phone number** — the submitted
       `amountTransaction.phoneNumber`, else the access token subject (`sub`).
       If its trailing three digits name a reserved CAMARA status, the endpoint
       answers with that canonical CAMARA error instead of charging (shared
       convention — see the referenced `errors.yaml`): `…400`, `…401`, `…403`,
       `…404`, `…409`, `…422`, `…429`, `…500`, `…503`. A malformed submitted
       `phoneNumber` → `400 INVALID_ARGUMENT`; no `phoneNumber` and a non-E.164
       token subject (the account cannot be identified) →
       `422 MISSING_IDENTIFIER`.
    2. **The requested `amount`** (`paymentAmount.chargingInformation.amount`):
       below the schema minimum `0.001` → `400 INVALID_ARGUMENT`; above the
       simulator's authorised ceiling of `1000` (currency not modelled) →
       `422 CARRIER_BILLING.UNAUTHORIZED_AMOUNT`; otherwise the charge
       **succeeds**.

    The identifier plane is evaluated before the amount plane, so a
    reserved-error phone number wins even when the amount is also out of range.

    Examples: `+123456789012` charging `9.99` → `201 succeeded`; `+123456789404`
    → `404 NOT_FOUND`; `+123456789012` charging `5000` →
    `422 CARRIER_BILLING.UNAUTHORIZED_AMOUNT`.

    ## Documented cuts (this slice)

    - Only the one-step `POST /payments` is implemented. Nothing reads a payment
      back yet, so the created payment is **not** persisted.
    - `sink` / `sinkCredential` are accepted for schema fidelity but not acted on
      (Carrier Billing charging notifications are a later slice).
  version: "0.5.0"
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: "{apiRoot}/carrier-billing/v0.5"
    variables:
      apiRoot:
        default: http://localhost:8080
        description: API root, e.g. the CamaraSim base URL.

paths:
  /payments:
    post:
      operationId: createPayment
      summary: Create (and, one-step, charge) a payment
      description: |
        Creates a new payment to charge to an end user's mobile account. In the
        one-step flow covered by this version the payment is charged immediately,
        so a happy path returns `201` with `paymentStatus: "succeeded"`.

        See the API description for the parameter-driven functional cases.
      security:
        - openId:
            - carrier-billing:payments:create
      parameters:
        - $ref: "#/components/parameters/XCorrelator"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePayment"
      responses:
        "201":
          description: The payment was created (and, one-step, charged).
          headers:
            x-correlator:
              $ref: "#/components/headers/XCorrelator"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentCreated"
              examples:
                succeeded:
                  summary: One-step charge succeeded
                  value:
                    paymentId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    amountTransaction:
                      phoneNumber: "+123456789012"
                      paymentAmount:
                        chargingInformation:
                          amount: 9.99
                          currency: EUR
                          description: A digital good
                      referenceCode: ref-001
                    paymentStatus: succeeded
                    paymentCreationDate: "2024-01-01T14:27:08Z"
                    paymentDate: "2024-01-01T14:27:08Z"
        "400":
          description: |
            400 — invalid request. CamaraSim returns `INVALID_ARGUMENT` for a
            malformed body, a malformed `phoneNumber`, or an `amount` below the
            schema minimum `0.001`, plus the reserved-suffix `…400` case.
          content:
            application/json:
              schema:
                $ref: "../../shared/errors.yaml#/components/schemas/CamaraError"
              example:
                status: 400
                code: INVALID_ARGUMENT
                message: Client specified an invalid argument, request body or query param.
        "401":
          $ref: "../../shared/errors.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../../shared/errors.yaml#/components/responses/PermissionDenied"
        "404":
          $ref: "../../shared/errors.yaml#/components/responses/NotFound"
        "409":
          $ref: "../../shared/errors.yaml#/components/responses/Conflict"
        "422":
          description: |
            422 — unprocessable. CamaraSim returns `MISSING_IDENTIFIER` when the
            account cannot be identified, `CARRIER_BILLING.UNAUTHORIZED_AMOUNT`
            when the `amount` exceeds the authorised ceiling, or the reserved
            shared `SERVICE_NOT_APPLICABLE` for the `…422` suffix.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CarrierBillingError"
              examples:
                unauthorizedAmount:
                  summary: Amount above the authorised ceiling
                  value:
                    status: 422
                    code: CARRIER_BILLING.UNAUTHORIZED_AMOUNT
                    message: Unauthorized amount requested.
                missingIdentifier:
                  summary: The account cannot be identified
                  value:
                    status: 422
                    code: MISSING_IDENTIFIER
                    message: The phone number cannot be identified.
        "429":
          $ref: "../../shared/errors.yaml#/components/responses/TooManyRequests"
        "500":
          $ref: "../../shared/errors.yaml#/components/responses/Internal"
        "503":
          $ref: "../../shared/errors.yaml#/components/responses/Unavailable"
      x-camarasim-scenarios:
        description: >-
          Result selected from two control planes (docs/DESIGN.md §7): the charged
          phone number (submitted `amountTransaction.phoneNumber`, else the access
          token subject) and the requested `amount`. Reserved error suffixes come
          from the shared convention in errors.yaml; the identifier plane is
          checked first. Note: CamaraSim exposes the full shared error set so
          every reserved case is reachable — canonical Carrier Billing 0.5.0 also
          declares 410 GONE, which CamaraSim does not model in this slice.
        cases:
          - input: phone number ending in a reserved error suffix (e.g. …404)
            result: the canonical CAMARA error for that status
          - input: valid phone number, amount in `[0.001, 1000]`
            result: '201 { paymentStatus: "succeeded" }'
          - input: amount below `0.001`
            result: "400 INVALID_ARGUMENT"
          - input: amount above `1000`
            result: "422 CARRIER_BILLING.UNAUTHORIZED_AMOUNT"
          - input: malformed `phoneNumber`
            result: "400 INVALID_ARGUMENT"
          - input: no `phoneNumber` and a non-E.164 token subject
            result: "422 MISSING_IDENTIFIER"

components:
  securitySchemes:
    openId:
      $ref: "../../auth/openapi.yaml#/components/securitySchemes/camaraOAuth"

  parameters:
    XCorrelator:
      name: x-correlator
      in: header
      required: false
      description: Correlation id for the request, echoed back on the response.
      schema:
        type: string

  headers:
    XCorrelator:
      description: The `x-correlator` from the request, echoed if one was sent.
      required: false
      schema:
        type: string

  schemas:
    CreatePayment:
      type: object
      description: Request to create (and, one-step, charge) a payment.
      required:
        - amountTransaction
      properties:
        amountTransaction:
          $ref: "#/components/schemas/AmountTransactionInput"
        sink:
          type: string
          format: uri
          pattern: '^https://.+$'
          description: >-
            Optional HTTPS callback for charging notifications. Accepted for
            schema fidelity but not acted on in this slice.
        sinkCredential:
          $ref: "#/components/schemas/SinkCredential"

    AmountTransactionInput:
      type: object
      description: What to charge and — for a two-legged / CIBA token — to whom.
      required:
        - paymentAmount
        - referenceCode
      properties:
        phoneNumber:
          type: string
          description: >-
            The mobile account to charge, in E.164 format (starting with `+`).
            Optional: omit it to charge the account identified by a three-legged
            access token.
          pattern: '^\+[1-9][0-9]{4,14}$'
          example: "+123456789012"
        clientCorrelator:
          type: string
          description: Client-supplied correlation id, echoed on the response.
        paymentAmount:
          $ref: "#/components/schemas/PaymentAmountForCharge"
        referenceCode:
          type: string
          description: Merchant reference for the payment.
          example: ref-001

    PaymentAmountForCharge:
      type: object
      description: The amount to charge, plus optional metadata and line items.
      required:
        - chargingInformation
      properties:
        chargingInformation:
          $ref: "#/components/schemas/ChargingInformation"
        chargingMetaData:
          $ref: "#/components/schemas/ChargingMetaData"
        paymentDetails:
          type: array
          minItems: 1
          description: Optional line items making up the total.
          items:
            $ref: "#/components/schemas/PaymentItem"

    ChargingInformation:
      type: object
      description: The money to charge.
      required:
        - amount
        - currency
        - description
      properties:
        amount:
          type: number
          format: float
          minimum: 0.001
          multipleOf: 0.001
          description: The amount to charge (at least `0.001`).
          example: 9.99
        currency:
          type: string
          description: ISO 4217 currency code.
          example: EUR
        description:
          type: string
          description: Human-readable description of the charge.
          example: A digital good
        isTaxIncluded:
          type: boolean
          default: false
          description: Whether `amount` already includes tax.
        taxAmount:
          type: number
          format: float
          minimum: 0
          multipleOf: 0.001
          description: The tax portion of `amount`, if any.

    ChargingMetaData:
      type: object
      description: >-
        Optional merchant / channel metadata. Echoed verbatim by CamaraSim; not
        used to drive functional cases.
      properties:
        merchantName:
          type: string
        merchantIdentifier:
          type: string
        fee:
          type: number
          multipleOf: 0.01
        purchaseCategoryCode:
          type: string
        channel:
          type: string
        serviceId:
          type: string
        productId:
          type: string

    PaymentItem:
      type: object
      description: A single line item of a payment.
      required:
        - id
        - amount
        - currency
        - description
      properties:
        id:
          type: string
        amount:
          type: number
          format: float
          minimum: 0.001
          multipleOf: 0.001
        currency:
          type: string
        description:
          type: string
        isTaxIncluded:
          type: boolean
          default: false
        taxAmount:
          type: number
          format: float
          minimum: 0
          multipleOf: 0.001

    SinkCredential:
      type: object
      description: >-
        Credential for the callback `sink`. Accepted for schema fidelity but not
        applied in this slice.
      required:
        - credentialType
      properties:
        credentialType:
          type: string
          enum:
            - PLAIN
            - ACCESSTOKEN
            - REFRESHTOKEN

    PaymentCreated:
      type: object
      description: A created payment.
      required:
        - paymentId
        - amountTransaction
        - paymentStatus
        - paymentCreationDate
      properties:
        paymentId:
          type: string
          description: Server-assigned, opaque, UUID-shaped payment id.
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        amountTransaction:
          $ref: "#/components/schemas/AmountTransaction"
        paymentStatus:
          type: string
          description: >-
            The payment's status. In the one-step flow a happy path is
            `succeeded`.
          enum:
            - processing
            - pending_validation
            - denied
            - reserved
            - succeeded
            - cancelled
        paymentCreationDate:
          type: string
          format: date-time
          description: When the payment was created (RFC 3339, `Z` offset).
        paymentDate:
          type: string
          format: date-time
          description: When the payment was charged (RFC 3339, `Z` offset).

    AmountTransaction:
      type: object
      description: The echoed charge, with the resolved `phoneNumber`.
      required:
        - phoneNumber
        - paymentAmount
        - referenceCode
      properties:
        phoneNumber:
          type: string
          pattern: '^\+[1-9][0-9]{4,14}$'
          description: The account that was charged.
        clientCorrelator:
          type: string
        paymentAmount:
          $ref: "#/components/schemas/PaymentAmountForCharge"
        referenceCode:
          type: string

    CarrierBillingError:
      type: object
      description: |
        The CAMARA error body with Carrier-Billing-specific `code` values (a
        superset of the shared base catalog for this API's 422 cases).
      required:
        - status
        - code
        - message
      properties:
        status:
          type: integer
          description: The HTTP status code, echoed in the body.
        code:
          type: string
          description: Machine-readable CAMARA / Carrier Billing error code.
          enum:
            - SERVICE_NOT_APPLICABLE
            - MISSING_IDENTIFIER
            - CARRIER_BILLING.UNAUTHORIZED_AMOUNT
        message:
          type: string
          description: Human-readable explanation.
