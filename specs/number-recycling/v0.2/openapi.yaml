# CamaraSim — Number Recycling, API version v0.2 (CAMARA 0.2.0, r2.2).
#
# Vendored from the CAMARA Number Recycling API (release r2.2 → number-recycling
# 0.2.0, the latest published version — so mounted at its real sub-1.0 base path
# `/v0.2`, like KYC Match / Device Identifier / Location Retrieval / Call
# Forwarding Signal) and annotated with CamaraSim's parameter-driven functional
# cases (docs/DESIGN.md §7, §9). Backed by `src/apis/number_recycling/v0_2.rs`;
# spec and code must not drift.
#
# Serves `POST /check`.
openapi: 3.0.3
info:
  title: Number Recycling
  description: |
    Service that answers whether the **subscriber** behind a phone number has
    changed since a caller-supplied reference date — i.e. whether the number has
    been reassigned ("recycled") to a new person. It is an account-integrity /
    anti-fraud signal: a service that once bound a number to a user can ask
    whether that binding still holds before trusting the number for account
    recovery, notifications, or KYC.

    This is the CamaraSim reference double for CAMARA Number Recycling 0.2.0. The
    `/check` endpoint requires the `number-recycling:check` scope.

    ## Identifier resolution — two-legged vs three-legged

    Faithful to CAMARA, the `phoneNumber` in the request body is valid *only* in
    two-legged auth. In a three-legged token the line is already identified by
    the token **subject** (`sub`), so the number must not be resubmitted:

    - `phoneNumber` present **and** the token subject is itself an E.164 number
      (a line-authenticated three-legged token) → `422 UNNECESSARY_IDENTIFIER`.
    - `phoneNumber` present, subject not a line → the submitted number is the
      identifier (two-legged).
    - `phoneNumber` absent, subject is an E.164 number → the subject is the
      identifier (three-legged).
    - `phoneNumber` absent **and** the subject is not a line → the line cannot be
      identified → `422 MISSING_IDENTIFIER`.

    ## Functional cases — the input is the control plane (docs/DESIGN.md §7)

    Two independent control planes drive the answer:

    - **Reserved error suffix (identifier).** If the resolved identifier's
      trailing three digits name a reserved CAMARA status, the endpoint answers
      with that canonical CAMARA error (shared convention — see the referenced
      `errors.yaml`): `…400`, `…401`, `…403`, `…404`, `…409`, `…422`, `…429`,
      `…500`, `…503`.
    - **Recycling verdict (identifier digits × `specifiedDate`).** Otherwise the
      identifier's trailing three digits are read as **days since the subscriber
      last changed** (`0`–`999`), so the last change happened *today − digits
      days*. The number is reported recycled iff that change is strictly after
      `specifiedDate` — equivalently `(today − specifiedDate) > digits`. This
      makes `specifiedDate` a genuine second control plane: the **same** number
      reads `phoneNumberRecycled: false` against a recent reference date and
      `true` against an old one. An identifier with no digits is treated as
      *changed today* (`digits = 0`).

    `specifiedDate` is validated: a malformed or impossible calendar date →
    `400 INVALID_ARGUMENT`; a date in the future → `400 OUT_OF_RANGE`.

    Example: `+123456789050` (subscriber changed 50 days ago) with a
    `specifiedDate` 100 days ago → `phoneNumberRecycled: true`; the same number
    with a `specifiedDate` 30 days ago → `false`; `+123456789404` →
    `404 NOT_FOUND`.

    CamaraSim exposes the full shared reserved-error set here so every reserved
    suffix is reachable; canonical Number Recycling 0.2.0 declares a subset
    (400/401/403/404/422/429).
  version: "0.2.0"
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: "{apiRoot}/number-recycling/v0.2"
    variables:
      apiRoot:
        default: http://localhost:8080
        description: API root, e.g. the CamaraSim base URL.

paths:
  /check:
    post:
      operationId: checkNumberRecycling
      summary: Check whether the subscriber of the phone number has changed
      description: |
        Answers whether the subscriber behind the phone number changed after the
        supplied `specifiedDate` (`{ "phoneNumberRecycled": true|false }`).

        The line is identified by the submitted `phoneNumber` (two-legged) or by
        the access-token subject (three-legged) — see the API description for the
        identifier-resolution rules and the parameter-driven functional cases
        (the trailing three digits encode days-since-the-last-subscriber-change,
        compared against `specifiedDate`).
      security:
        - openId:
            - number-recycling:check
      parameters:
        - $ref: "#/components/parameters/XCorrelator"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCheckNumRecycling"
      responses:
        "200":
          description: The number-recycling verdict for the line.
          headers:
            x-correlator:
              $ref: "#/components/headers/XCorrelator"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckNumRecyclingInfo"
              examples:
                recycled:
                  summary: Subscriber changed after the reference date
                  value:
                    phoneNumberRecycled: true
                notRecycled:
                  summary: No change after the reference date (happy path)
                  value:
                    phoneNumberRecycled: false
        "400":
          description: |
            400 — invalid request. CamaraSim returns `INVALID_ARGUMENT` for a
            malformed body or an unparseable/impossible `specifiedDate`, and
            `OUT_OF_RANGE` when `specifiedDate` is in the future.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NumberRecyclingError"
              examples:
                invalidArgument:
                  summary: Malformed body or `specifiedDate`
                  value:
                    status: 400
                    code: INVALID_ARGUMENT
                    message: "`specifiedDate` must be a valid RFC 3339 full-date (YYYY-MM-DD)."
                outOfRange:
                  summary: `specifiedDate` in the future
                  value:
                    status: 400
                    code: OUT_OF_RANGE
                    message: "`specifiedDate` must not be in the future."
        "401":
          $ref: "../../shared/errors.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../../shared/errors.yaml#/components/responses/PermissionDenied"
        "404":
          $ref: "../../shared/errors.yaml#/components/responses/NotFound"
        "409":
          $ref: "../../shared/errors.yaml#/components/responses/Conflict"
        "422":
          description: |
            422 — unprocessable. CamaraSim returns `MISSING_IDENTIFIER` when the
            line cannot be identified (no `phoneNumber` and a non-line subject),
            `UNNECESSARY_IDENTIFIER` when a `phoneNumber` is submitted on a
            three-legged line token, or the reserved shared
            `SERVICE_NOT_APPLICABLE` for the `…422` suffix.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NumberRecyclingError"
              examples:
                missingIdentifier:
                  summary: The line cannot be identified
                  value:
                    status: 422
                    code: MISSING_IDENTIFIER
                    message: The phone number cannot be identified.
                unnecessaryIdentifier:
                  summary: The number is already identified by the token
                  value:
                    status: 422
                    code: UNNECESSARY_IDENTIFIER
                    message: The phone number is already identified by the access token.
                serviceNotApplicable:
                  summary: Reserved `…422` suffix
                  value:
                    status: 422
                    code: SERVICE_NOT_APPLICABLE
                    message: The service is not available for the provided identifier.
        "429":
          $ref: "../../shared/errors.yaml#/components/responses/TooManyRequests"
        "500":
          $ref: "../../shared/errors.yaml#/components/responses/Internal"
        "503":
          $ref: "../../shared/errors.yaml#/components/responses/Unavailable"
      x-camarasim-scenarios:
        description: >-
          Result selected from the resolved line identifier and `specifiedDate`
          (docs/DESIGN.md §7). The identifier's trailing three digits are
          days-since-the-last-subscriber-change; recycled iff that change is
          strictly after `specifiedDate`. Reserved error suffixes come from the
          shared convention in errors.yaml.
        cases:
          - input: identifier ending in a reserved error suffix (e.g. …404)
            result: the canonical CAMARA error for that status
          - input: "identifier whose trailing digits (daysAgo) < (today − specifiedDate)"
            result: "200 { phoneNumberRecycled: true }"
          - input: "identifier whose trailing digits (daysAgo) >= (today − specifiedDate)"
            result: "200 { phoneNumberRecycled: false }"
          - input: same number, an older specifiedDate vs a recent one
            result: recycled flips true → false (specifiedDate is a control plane)
          - input: no phoneNumber, an E.164 token subject (three-legged)
            result: same cases, driven by the subject's trailing three digits
          - input: phoneNumber submitted on a three-legged line token
            result: "422 UNNECESSARY_IDENTIFIER"
          - input: no phoneNumber and a non-line token subject
            result: "422 MISSING_IDENTIFIER"
          - input: malformed or impossible specifiedDate
            result: "400 INVALID_ARGUMENT"
          - input: specifiedDate in the future
            result: "400 OUT_OF_RANGE"

components:
  securitySchemes:
    openId:
      $ref: "../../auth/openapi.yaml#/components/securitySchemes/camaraOAuth"

  parameters:
    XCorrelator:
      name: x-correlator
      in: header
      required: false
      description: Correlation id for the request, echoed back on the response.
      schema:
        type: string

  headers:
    XCorrelator:
      description: The `x-correlator` from the request, echoed if one was sent.
      required: false
      schema:
        type: string

  schemas:
    CreateCheckNumRecycling:
      type: object
      description: |
        Request to check whether a phone number's subscriber changed after a
        reference date. The `phoneNumber` is valued only in two-legged
        authentication; supplying it with a three-legged (line) token yields
        `422 UNNECESSARY_IDENTIFIER`.
      required:
        - specifiedDate
      properties:
        phoneNumber:
          type: string
          description: A phone number in E.164 format (starting with `+`).
          pattern: '^\+[1-9][0-9]{4,14}$'
          example: "+123456789012"
        specifiedDate:
          type: string
          format: date
          description: >-
            The reference date (RFC 3339 full-date, `YYYY-MM-DD`). The response
            reports whether the subscriber changed strictly after this date. Must
            not be in the future.
          example: "2025-01-01"

    CheckNumRecyclingInfo:
      type: object
      description: The number-recycling verdict for the line.
      required:
        - phoneNumberRecycled
      properties:
        phoneNumberRecycled:
          type: boolean
          description: >-
            `true` when the subscriber behind the phone number changed after
            `specifiedDate` (the number was recycled), `false` otherwise.

    NumberRecyclingError:
      description: >-
        The CAMARA error body for this API — the shared `CamaraError` shape with
        the Number Recycling `code` set (adds `OUT_OF_RANGE` and the 422
        identifier codes).
      allOf:
        - $ref: "../../shared/errors.yaml#/components/schemas/CamaraError"
        - type: object
          properties:
            code:
              type: string
              enum:
                - INVALID_ARGUMENT
                - OUT_OF_RANGE
                - UNAUTHENTICATED
                - PERMISSION_DENIED
                - NOT_FOUND
                - IDENTIFIER_NOT_FOUND
                - MISSING_IDENTIFIER
                - UNNECESSARY_IDENTIFIER
                - SERVICE_NOT_APPLICABLE
                - CONFLICT
                - TOO_MANY_REQUESTS
                - INTERNAL
                - UNAVAILABLE
