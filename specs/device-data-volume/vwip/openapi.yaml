# CamaraSim — Device Data Volume, API version vwip (CAMARA work-in-progress).
#
# Vendored from the CAMARA Device Data Volume API (device-data-volume) and
# annotated with CamaraSim's parameter-driven functional cases (docs/DESIGN.md
# §7, §9). Backed by `src/apis/device_data_volume/vwip.rs`; spec and code must
# not drift.
#
# Device Data Volume has no released version yet — its upstream `main` spec is
# versioned `wip` — so, unlike the published sub-1.0 APIs (KYC Match v0.3,
# Location Retrieval v0.4), its canonical base path is literally `vwip`. This
# tracks the work-in-progress spec; a numbered version will be added when CAMARA
# cuts a release.
#
# Serves `POST /retrieve` (`retrieveDataVolume`) and `POST /check`
# (`checkDataVolume`). `retrieve` reports the device's *consumed* bucket; `check`
# answers a boolean against its *remaining* volume vs a caller-supplied threshold.
openapi: 3.0.3
info:
  title: Device Data Volume
  description: |
    Returns a coarse, bucketed figure for how much data a device has consumed —
    one of `<200MiB` / `<1GiB` / `<5GiB` / `>=5GiB` — never a precise byte count.

    This is the CamaraSim reference double for CAMARA Device Data Volume
    (work-in-progress). The device can be identified either by the `device` object
    in the request body (two-legged / CIBA) or by the identity a three-legged
    access token authenticated (in which case `device` is omitted). The endpoint
    requires the `device-data-volume:read` scope.

    ## Identifier resolution (two-legged vs three-legged)

    The `device` object is only meaningful in two-legged auth. In a three-legged
    token the device is already identified by the token subject:

    - `device` carries an identifier **and** the token subject is itself an
      E.164 line (a device-authenticated three-legged token) →
      `422 UNNECESSARY_IDENTIFIER`.
    - `device` carries an identifier, subject not a line → that identifier is
      used (two-legged). Precedence: `phoneNumber` → `networkAccessIdentifier` →
      the IPv4 `publicAddress` → `ipv6Address`.
    - `device` absent, subject is an E.164 line → the subject is the identifier
      (three-legged).
    - `device` absent **and** the subject is not a line → the device cannot be
      identified → `422 MISSING_IDENTIFIER`.
    - `device` present but carrying **no** identifier (`minProperties: 1`
      violated) → `400 INVALID_ARGUMENT`.

    ## Functional cases — the input is the control plane (docs/DESIGN.md §7)

    Two control planes drive the answer:

    1. **Reserved error suffix** — if the resolved identifier's trailing three
       digits name a reserved CAMARA status, the endpoint answers with that
       canonical CAMARA error instead of a result (shared convention — see the
       referenced `errors.yaml`): `…400`, `…401`, `…403`, `…404`, `…409`, `…422`,
       `…429`, `…500`, `…503`. This plane is checked first.
    2. **Data-volume category** — otherwise the identifier's trailing three digits
       index a fixed lowest-first table `[<200MiB, <1GiB, <5GiB, >=5GiB]`
       (`digits % 4`; `…000` / no trailing digits → the first entry, `<200MiB`),
       so the reported bucket is a genuine control plane (the same input always
       returns the same category).

    `lastStatusTime` is the current instant (the simulator always treats usage as
    freshly measured). The schema marks it nullable — "no known measurement" — but
    CamaraSim always has a fresh figure, so it is never `null`.

    The response echoes the device back only when the identifier is a
    `phoneNumber` (the CAMARA `DeviceResponse` carries only `phoneNumber`); for an
    IP-/NAI-keyed request the `device` field is omitted.

    Examples: `+123456789000` → `<200MiB` (index 0); `+123456789002` → `<5GiB`
    (`2 % 4 == 2`); `+123456789003` → `>=5GiB`; `+123456789404` → `404 NOT_FOUND`.
  version: "wip"
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: "{apiRoot}/device-data-volume/vwip"
    variables:
      apiRoot:
        default: http://localhost:8080
        description: API root, e.g. the CamaraSim base URL.

paths:
  /retrieve:
    post:
      operationId: retrieveDataVolume
      summary: Retrieve a device's consumed data volume (bucketed)
      description: |
        Returns the coarse data-volume category the device has consumed. Supply a
        `device`, or omit it to use the device identified by a three-legged access
        token.

        See the API description for the identifier-resolution rules and the
        parameter-driven functional cases.
      security:
        - openId:
            - device-data-volume:read
      parameters:
        - $ref: "#/components/parameters/XCorrelator"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetrieveDataVolumeRequest"
      responses:
        "200":
          description: The device's consumed data volume, bucketed.
          headers:
            x-correlator:
              $ref: "#/components/headers/XCorrelator"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrieveDataVolumeResponse"
              examples:
                lightUsage:
                  summary: A lightly-used device (…000)
                  value:
                    dataVolumeCategory: "<200MiB"
                    lastStatusTime: "2024-01-01T14:27:08Z"
                    device:
                      phoneNumber: "+123456789000"
                heavyUsage:
                  summary: A heavily-used device (…003)
                  value:
                    dataVolumeCategory: ">=5GiB"
                    lastStatusTime: "2024-01-01T14:27:08Z"
                    device:
                      phoneNumber: "+123456789003"
        "400":
          description: |
            400 — bad request. CamaraSim returns `INVALID_ARGUMENT` for a
            malformed body, an empty `device`, or a bad `phoneNumber`.
          headers:
            x-correlator:
              $ref: "#/components/headers/XCorrelator"
          content:
            application/json:
              schema:
                $ref: "../../shared/errors.yaml#/components/schemas/CamaraError"
              examples:
                invalidArgument:
                  summary: Malformed request
                  value:
                    status: 400
                    code: INVALID_ARGUMENT
                    message: "`device` must contain at least one identifier."
        "401":
          $ref: "../../shared/errors.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../../shared/errors.yaml#/components/responses/PermissionDenied"
        "404":
          description: |
            404 — not found. CamaraSim returns the reserved shared `NOT_FOUND` for
            an identifier with the `…404` suffix.
          headers:
            x-correlator:
              $ref: "#/components/headers/XCorrelator"
          content:
            application/json:
              schema:
                $ref: "../../shared/errors.yaml#/components/schemas/CamaraError"
              examples:
                notFound:
                  summary: Reserved `…404` suffix
                  value:
                    status: 404
                    code: NOT_FOUND
                    message: The specified resource was not found.
        "409":
          $ref: "../../shared/errors.yaml#/components/responses/Conflict"
        "422":
          description: |
            422 — unprocessable. CamaraSim returns `MISSING_IDENTIFIER` when the
            device cannot be identified (no `device` and a non-line subject),
            `UNNECESSARY_IDENTIFIER` when a `device` is submitted on a
            three-legged device token, or the reserved shared
            `SERVICE_NOT_APPLICABLE` for the `…422` suffix.
          headers:
            x-correlator:
              $ref: "#/components/headers/XCorrelator"
          content:
            application/json:
              schema:
                $ref: "../../shared/errors.yaml#/components/schemas/CamaraError"
              examples:
                missingIdentifier:
                  summary: The device cannot be identified
                  value:
                    status: 422
                    code: MISSING_IDENTIFIER
                    message: The device cannot be identified.
                unnecessaryIdentifier:
                  summary: The device is already identified by the token
                  value:
                    status: 422
                    code: UNNECESSARY_IDENTIFIER
                    message: The device is already identified by the access token.
        "429":
          $ref: "../../shared/errors.yaml#/components/responses/TooManyRequests"
        "500":
          $ref: "../../shared/errors.yaml#/components/responses/Internal"
        "503":
          $ref: "../../shared/errors.yaml#/components/responses/Unavailable"
      x-camarasim-scenarios:
        description: >-
          The data-volume category is selected from the identifier (the first
          present device identifier, else the access token subject) whose trailing
          three digits drive the case (docs/DESIGN.md §7). Reserved error suffixes
          come from the shared convention in errors.yaml. Canonical Device Data
          Volume (wip) also declares 422 IDENTIFIER sub-cases and a 404
          IDENTIFIER_NOT_FOUND; CamaraSim models the shared reserved-suffix
          convention plus the identifier-resolution 422s, and exposes the full
          shared error set so every reserved case is reachable.
        cases:
          - input: identifier ending in a reserved error suffix (e.g. …404)
            result: the canonical CAMARA error for that status
          - input: "identifier ending in …000 (or no trailing digits)"
            result: "200 — dataVolumeCategory <200MiB"
          - input: "any other identifier tail d"
            result: "200 — dataVolumeCategory = [<200MiB,<1GiB,<5GiB,>=5GiB][d % 4]"
          - input: "`device` present but carrying no identifier"
            result: "400 INVALID_ARGUMENT"
          - input: "`device` submitted on a three-legged line token"
            result: "422 UNNECESSARY_IDENTIFIER"
          - input: no `device` and a non-line token subject
            result: "422 MISSING_IDENTIFIER"

  /check:
    post:
      operationId: checkDataVolume
      summary: Check a device's remaining data volume against a threshold
      description: |
        Answers whether the device's **remaining** data volume exceeds a
        caller-supplied `volumeToCheck` threshold — a boolean, never a byte count.
        Supply a `device`, or omit it to use the device identified by a
        three-legged access token.

        The identifier-resolution rules match `retrieve`. The answer is driven by
        two control planes (docs/DESIGN.md §7):

        1. **Reserved error suffix** — the resolved identifier's trailing three
           digits naming a reserved CAMARA status → that canonical error (checked
           first, so e.g. `…500` is a 500 INTERNAL, not a result).
        2. **Remaining volume vs threshold** — otherwise the identifier's trailing
           three digits `d` fix the device's remaining volume at `d * 10` MiB
           (`…000` / no digits → `0` MiB), and `thresholdExceeded` is
           `remaining_MiB > volumeToCheck` (with `GiB` normalised as
           `value * 1024` MiB). So `volumeToCheck` is a genuine second control
           plane — the same device flips true↔false as the threshold moves.

        `volumeToCheck` is **required**; a `value` outside `0..=1024` → `400
        OUT_OF_RANGE`, checked before the identifier is resolved.
      security:
        - openId:
            - device-data-volume:read
      parameters:
        - $ref: "#/components/parameters/XCorrelator"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckDataVolumeRequest"
      responses:
        "200":
          description: Whether the device's remaining data volume exceeds the threshold.
          headers:
            x-correlator:
              $ref: "#/components/headers/XCorrelator"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckDataVolumeResponse"
              examples:
                exceeds:
                  summary: 2000 MiB remaining exceeds a 1 GiB threshold (…200)
                  value:
                    thresholdExceeded: true
                    lastStatusTime: "2024-01-01T14:27:08Z"
                    device:
                      phoneNumber: "+123456789200"
                belowThreshold:
                  summary: 500 MiB remaining does not exceed a 1 GiB threshold (…050)
                  value:
                    thresholdExceeded: false
                    lastStatusTime: "2024-01-01T14:27:08Z"
                    device:
                      phoneNumber: "+123456789050"
        "400":
          description: |
            400 — bad request. CamaraSim returns `OUT_OF_RANGE` for a
            `volumeToCheck.value` outside `0..=1024`, or `INVALID_ARGUMENT` for a
            missing/malformed body, a missing `volumeToCheck`, an unknown `unit`,
            an empty `device`, or a bad `phoneNumber`.
          headers:
            x-correlator:
              $ref: "#/components/headers/XCorrelator"
          content:
            application/json:
              schema:
                $ref: "../../shared/errors.yaml#/components/schemas/CamaraError"
              examples:
                outOfRange:
                  summary: value outside 0..=1024
                  value:
                    status: 400
                    code: OUT_OF_RANGE
                    message: "`volumeToCheck.value` must be in the range 0..=1024."
                invalidArgument:
                  summary: Missing volumeToCheck
                  value:
                    status: 400
                    code: INVALID_ARGUMENT
                    message: "Request body is not a valid CheckDataVolumeRequest (`volumeToCheck` is required)."
        "401":
          $ref: "../../shared/errors.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../../shared/errors.yaml#/components/responses/PermissionDenied"
        "404":
          description: |
            404 — not found. CamaraSim returns the reserved shared `NOT_FOUND` for
            an identifier with the `…404` suffix.
          headers:
            x-correlator:
              $ref: "#/components/headers/XCorrelator"
          content:
            application/json:
              schema:
                $ref: "../../shared/errors.yaml#/components/schemas/CamaraError"
              examples:
                notFound:
                  summary: Reserved `…404` suffix
                  value:
                    status: 404
                    code: NOT_FOUND
                    message: The specified resource was not found.
        "409":
          $ref: "../../shared/errors.yaml#/components/responses/Conflict"
        "422":
          description: |
            422 — unprocessable. CamaraSim returns `MISSING_IDENTIFIER` when the
            device cannot be identified (no `device` and a non-line subject),
            `UNNECESSARY_IDENTIFIER` when a `device` is submitted on a
            three-legged device token, or the reserved shared
            `SERVICE_NOT_APPLICABLE` for the `…422` suffix.
          headers:
            x-correlator:
              $ref: "#/components/headers/XCorrelator"
          content:
            application/json:
              schema:
                $ref: "../../shared/errors.yaml#/components/schemas/CamaraError"
              examples:
                missingIdentifier:
                  summary: The device cannot be identified
                  value:
                    status: 422
                    code: MISSING_IDENTIFIER
                    message: The device cannot be identified.
                unnecessaryIdentifier:
                  summary: The device is already identified by the token
                  value:
                    status: 422
                    code: UNNECESSARY_IDENTIFIER
                    message: The device is already identified by the access token.
        "429":
          $ref: "../../shared/errors.yaml#/components/responses/TooManyRequests"
        "500":
          $ref: "../../shared/errors.yaml#/components/responses/Internal"
        "503":
          $ref: "../../shared/errors.yaml#/components/responses/Unavailable"
      x-camarasim-scenarios:
        description: >-
          The verdict is `remaining_MiB > threshold_MiB`, where the remaining
          volume is fixed by the resolved identifier's trailing three digits `d`
          as `d * 10` MiB and the threshold is `volumeToCheck` normalised to MiB
          (`GiB` → value*1024). The identifier plane (reserved error suffixes from
          the shared convention in errors.yaml) is checked first, and the
          `volumeToCheck.value` range is validated before that. Canonical Device
          Data Volume (wip) also declares 422 IDENTIFIER sub-cases and a 404
          IDENTIFIER_NOT_FOUND; CamaraSim models the shared reserved-suffix
          convention plus the identifier-resolution 422s.
        cases:
          - input: "`volumeToCheck` missing or `value` outside 0..=1024"
            result: "400 (INVALID_ARGUMENT / OUT_OF_RANGE) — checked first"
          - input: identifier ending in a reserved error suffix (e.g. …404)
            result: the canonical CAMARA error for that status
          - input: "identifier tail d, threshold t MiB with d*10 > t"
            result: "200 — thresholdExceeded true"
          - input: "identifier tail d, threshold t MiB with d*10 <= t"
            result: "200 — thresholdExceeded false (…000 → 0 MiB, never exceeds)"
          - input: "`device` submitted on a three-legged line token"
            result: "422 UNNECESSARY_IDENTIFIER"
          - input: no `device` and a non-line token subject
            result: "422 MISSING_IDENTIFIER"

components:
  securitySchemes:
    openId:
      $ref: "../../auth/openapi.yaml#/components/securitySchemes/camaraOAuth"

  parameters:
    XCorrelator:
      name: x-correlator
      in: header
      required: false
      description: Correlation id for the request, echoed back on the response.
      schema:
        type: string

  headers:
    XCorrelator:
      description: The `x-correlator` from the request, echoed if one was sent.
      required: false
      schema:
        type: string

  schemas:
    RetrieveDataVolumeRequest:
      type: object
      description: >-
        Request the consumed data volume for a device. `device` is optional: omit
        it to use the device identified by a three-legged access token.
      properties:
        device:
          $ref: "#/components/schemas/Device"

    Device:
      type: object
      description: >-
        Identifies the device. At least one identifier must be present. Optional
        at the request level: omit `device` to use the device identified by a
        three-legged access token. CamaraSim keys its functional cases off the
        first present identifier, in the order phoneNumber →
        networkAccessIdentifier → ipv4Address.publicAddress → ipv6Address.
      minProperties: 1
      properties:
        phoneNumber:
          type: string
          description: A phone number in E.164 format (starting with `+`).
          pattern: '^\+[1-9][0-9]{4,14}$'
          example: "+123456789012"
        networkAccessIdentifier:
          type: string
          description: A network access identifier assigned by the operator.
          example: "user012@example.com"
        ipv4Address:
          $ref: "#/components/schemas/DeviceIpv4Addr"
        ipv6Address:
          type: string
          description: The device's IPv6 address.
          example: "2001:db8::11"

    DeviceIpv4Addr:
      type: object
      description: >-
        The device's IPv4 address information. CamaraSim reads `publicAddress` as
        the identifier; `privateAddress`/`publicPort` are accepted for fidelity.
      properties:
        publicAddress:
          type: string
          example: "203.0.113.12"
        privateAddress:
          type: string
          example: "192.0.2.25"
        publicPort:
          type: integer
          format: int32
          minimum: 0
          maximum: 65535
          example: 59765

    RetrieveDataVolumeResponse:
      type: object
      description: The device's consumed data volume, as a coarse bucket.
      required:
        - lastStatusTime
        - dataVolumeCategory
      properties:
        device:
          $ref: "#/components/schemas/DeviceResponse"
        lastStatusTime:
          type: string
          format: date-time
          nullable: true
          description: >-
            When the reported figure was last measured (RFC 3339, UTC). Nullable
            in CAMARA for "no known measurement"; CamaraSim always reports a fresh
            time.
          example: "2024-01-01T14:27:08Z"
        dataVolumeCategory:
          type: string
          description: The coarse bucket of data the device has consumed.
          enum:
            - "<200MiB"
            - "<1GiB"
            - "<5GiB"
            - ">=5GiB"
          example: "<200MiB"

    DeviceResponse:
      type: object
      description: >-
        The device echoed back on a success. Per CAMARA this carries only
        `phoneNumber`, so CamaraSim echoes it only for a phone-number-keyed
        request (omitted for an IP-/NAI-keyed one).
      properties:
        phoneNumber:
          type: string
          pattern: '^\+[1-9][0-9]{4,14}$'
          example: "+123456789012"

    CheckDataVolumeRequest:
      type: object
      description: >-
        Check whether a device's remaining data volume exceeds a threshold.
        `device` is optional (omit it to use the device identified by a
        three-legged access token); `volumeToCheck` is required.
      required:
        - volumeToCheck
      properties:
        device:
          $ref: "#/components/schemas/Device"
        volumeToCheck:
          $ref: "#/components/schemas/VolumeToCheck"

    VolumeToCheck:
      type: object
      description: The volume threshold to compare the device's remaining volume against.
      required:
        - value
        - unit
      properties:
        value:
          type: integer
          format: int32
          minimum: 0
          maximum: 1024
          description: >-
            The threshold magnitude. CamaraSim rejects a value outside
            `0..=1024` with `400 OUT_OF_RANGE`.
          example: 500
        unit:
          $ref: "#/components/schemas/VolumeUnitEnum"

    VolumeUnitEnum:
      type: string
      description: >-
        The unit of `volumeToCheck.value`, where `MiB` is 2^20 bytes and `GiB`
        is 2^30 bytes. An unknown unit → `400 INVALID_ARGUMENT`.
      enum:
        - MiB
        - GiB
      example: MiB

    CheckDataVolumeResponse:
      type: object
      description: Whether the device's remaining data volume exceeds the threshold.
      required:
        - lastStatusTime
        - thresholdExceeded
      properties:
        device:
          $ref: "#/components/schemas/DeviceResponse"
        lastStatusTime:
          type: string
          format: date-time
          nullable: true
          description: >-
            When the reported figure was last measured (RFC 3339, UTC). Nullable
            in CAMARA for "no known measurement"; CamaraSim always reports a fresh
            time.
          example: "2024-01-01T14:27:08Z"
        thresholdExceeded:
          type: boolean
          description: >-
            Whether the device's remaining data volume exceeds the given
            threshold (`remaining_MiB > volumeToCheck` in MiB).
          example: true
