openapi: 3.0.3
info:
  title: IoT SIM Fraud Prevention
  description: |
    API for SIM card binding/unbinding and regional restriction management.

    # Introduction
    This API provides operations to manage security mechanisms for IoT SIM cards:
    - **Bind**: associate a SIM card with a specific device (IMEI) or restrict its operation to a geographic area.
    - **Unbind**: remove an existing binding or area restriction.
    - **Query**: retrieve the current binding status or area restriction for a device.

    When a device attempts to use the network, the operator checks the binding/restriction.
    If the IMEI reported does not match the bound one, or the device location is outside the allowed area,
    network services are automatically blocked.

    # Relevant terms and definitions
    * **SIM card**: IoT network card (subscriber identity module).
    * **Binding**: mechanism linking a SIM card to a specific terminal device (IMEI) to prevent misuse.
    * **Device**: any physical entity that can connect to a network.
    * **IMEI**: International Mobile Equipment Identity, a unique 15-digit identifier for mobile devices.

    # API Functionality
    The upstream CAMARA API exposes three endpoints: `POST /bind`, `POST /unbind`,
    and `POST /query`.

    # CamaraSim scope (documented cut)
    This simulator currently mounts **`POST /query` for `queryType: IMEIBIND` only**
    — a stateless, non-spatial, device-identifier-keyed query. The bind/unbind
    operations are stateful mutations and the `AREALIMIT` query type is spatial
    (a geographic `Circle` restriction); both are **deferred** (see
    `PROGRESS.md`). Accordingly the `QueryType` enum below is trimmed to
    `[IMEIBIND]`: a request with `queryType: AREALIMIT` is rejected with
    `400 INVALID_ARGUMENT` (it is not a value this deployment accepts), and the
    `/bind` and `/unbind` paths are not served. The simulator never drifts from
    the operations it actually implements.

    # Authorization and authentication
    The "Camara Security and Interoperability Profile" provides details of how an API consumer requests an access token. Please refer to Identity and Consent Management (https://github.com/camaraproject/IdentityAndConsentManagement/) for the released version of the profile.

    The specific authorization flows to be used will be agreed upon during the onboarding process, happening between the API consumer and the API provider, taking into account the declared purpose for accessing the API, whilst also being subject to the prevailing legal framework dictated by local legislation.

    In cases where personal data is processed by the API and users can exercise their rights through mechanisms such as opt-in and/or opt-out, the use of three-legged access tokens is mandatory. This ensures that the API remains in compliance with privacy regulations, upholding the principles of transparency and user-centric privacy-by-design.

    # Additional CAMARA error responses
    The list of error codes in this API specification is not exhaustive. Therefore the API specification MAY not document some non-mandatory error statuses as indicated in `CAMARA API Design Guide`.
    Please refer to the `CAMARA_common.yaml` of the Commonalities Release associated to this API version for a complete list of error responses. The applicable Commonalities Release can be identified in the `API Readiness Checklist` document associated to this API version.
    As a specific rule, error `501 - NOT_IMPLEMENTED` can be only a possible error response if it is explicitly documented in the API.

  version: wip
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  x-camara-commonalities: 0.7.0
externalDocs:
  description: Project repository and documentation
  url: https://github.com/camaraproject/IoTSIMFraudPrevention
servers:
  - url: "{apiRoot}/iot-sim-fraud-prevention/vwip"
    variables:
      apiRoot:
        default: http://localhost:8080
        description: API root
tags:
  - name: Query card fraud prevention
    description: Operations for querying current binding and restriction status
paths:
  /query:
    post:
      tags:
        - Query card fraud prevention
      summary: IoT SIM Fraud Prevention Query
      description: |
        Retrieve the current IMEI binding status for a device (operationId
        `query`).

        The device is identified either by a `device` object in the request body
        (two-legged / CIBA) or — when `device` is omitted — by the identity a
        three-legged access token authenticated. Exactly one identification path
        must be used:
        - a `device` **and** a three-legged token → `422 UNNECESSARY_IDENTIFIER`;
        - no `device` **and** a two-legged token → `422 MISSING_IDENTIFIER`.

        ## Functional cases — the input is the control plane (docs/DESIGN.md §7)

        The identifier is the first present identifier of the submitted `device`
        (precedence: `phoneNumber`, `networkAccessIdentifier`, the IPv4
        `publicAddress`, then `ipv6Address`) or, when no `device` is supplied, the
        access token subject (`sub`) of a three-legged token. Its trailing three
        digits select the case:

        - **Reserved error suffix** — if those trailing three digits name a
          reserved CAMARA status (`…400`, `…401`, `…403`, `…404`, `…409`, `…422`,
          `…429`, `…500`, `…503`), the endpoint answers with that canonical CAMARA
          error instead of a result (shared convention across identifier-keyed
          APIs).
        - **odd trailing digits** — the SIM is **bound** to a device:
          `imeiBind: { bindStatus: "BOUND", bindImei: "<15-digit IMEI>" }`. The
          reported `bindImei` is deterministic from the identifier — a fixed TAC
          (`35209900`), a 6-digit serial equal to the identifier's zero-padded
          trailing digits, and a GSMA Luhn check digit — so the same device always
          reports the same bound IMEI.
        - **any other input** (the happy-path default: an even tail, a `…000`
          tail, or an identifier with no trailing digits) — the SIM is **not
          bound**: `imeiBind: { bindStatus: "UNBOUND" }` with no `bindImei`.

        Examples: `+123456789011` → `BOUND` with a bound IMEI; `+123456789012`,
        `+123456789000` → `UNBOUND`; `+123456789404` → `404 NOT_FOUND`.
      operationId: query
      parameters:
        - $ref: "#/components/parameters/x-correlator"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryRequest"
            examples:
              INPUT_PHONE_NUMBER:
                summary: query For One Device By Phone Number
                description: Use a device's number for query operation
                value:
                  device:
                    phoneNumber: "+123456789011"
                  queryType: "IMEIBIND"
              INPUT_NETWORK_ACCESS_IDENTIFIER:
                summary: query For One Device By Network Access Identifier
                description: Use a device's network access identifier for query operations
                value:
                  device:
                    networkAccessIdentifier: "123456789@domain.com"
                  queryType: "IMEIBIND"
              INPUT_IPV4_ADDRESS:
                summary: query For One Device By IPv4 Address
                description: Use the IPv4 address of a device for query operations
                value:
                  device:
                    ipv4Address:
                      publicAddress: "203.0.113.0"
                      publicPort: 59765
                  queryType: "IMEIBIND"
              INPUT_IPV6_ADDRESS:
                summary: query For One Device By IPv6 Address
                description: Use the IPv6 address of a device for query operations
                value:
                  device:
                    ipv6Address: "2001:db8:85a3:8d3:1319:8a2e:370:7344"
                  queryType: "IMEIBIND"
              INPUT_THREE_LEGGED:
                summary: query For One Device By 3 Legged Token
                description: Use a 3 Legged Token for query operations (no device object needed)
                value:
                  queryType: "IMEIBIND"
      responses:
        "200":
          description: The result of query the device
          headers:
            x-correlator:
              $ref: "#/components/headers/x-correlator"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryFraudPreventionResponse"
              examples:
                IMEI_BIND_BOUND:
                  summary: BINDIMEI RESULT (BOUND)
                  description: The SIM is bound to a device IMEI
                  value:
                    imeiBind:
                      bindImei: "352099000000117"
                      bindStatus: "BOUND"
                IMEI_BIND_UNBOUND:
                  summary: BINDIMEI RESULT (UNBOUND)
                  description: No IMEI is bound to the SIM
                  value:
                    imeiBind:
                      bindStatus: "UNBOUND"
        "400":
          $ref: "#/components/responses/QueryBadRequest400"
        "401":
          $ref: "#/components/responses/Generic401"
        "403":
          $ref: "#/components/responses/Generic403"
        "404":
          $ref: "#/components/responses/Generic404"
        "422":
          $ref: "#/components/responses/Query422"
        "429":
          $ref: "#/components/responses/Generic429"
      security:
        - openId:
            - "iot-sim-fraud-prevention:query"

components:
  securitySchemes:
    openId:
      description: |
        OAuth2.0 Client Credentials authentication.
      type: openIdConnect
      openIdConnectUrl: "/.well-known/openid-configuration"
  parameters:
    x-correlator:
      name: x-correlator
      in: header
      description: Correlation id for the different services
      schema:
        $ref: "#/components/schemas/XCorrelator"
  headers:
    x-correlator:
      description: Correlation id for the different services
      schema:
        $ref: "#/components/schemas/XCorrelator"
  schemas:
    XCorrelator:
      type: string
      description: Correlation id for the request
      example: "123e4567-e89b-12d3-a456-426614174000"
      pattern: ^[a-zA-Z0-9-_:;.\/<>{}]{0,256}$

    # ---------- Device ----------
    Device:
      description: |
        End-user device able to connect to a mobile network.
        The developer can choose to provide one or more of the following identifiers:
        * `ipv4Address`
        * `ipv6Address`
        * `phoneNumber`
        * `networkAccessIdentifier`
        If multiple identifiers are provided, they MUST belong to the same device.
      type: object
      properties:
        phoneNumber:
          $ref: "#/components/schemas/PhoneNumber"
        networkAccessIdentifier:
          $ref: "#/components/schemas/NetworkAccessIdentifier"
        ipv4Address:
          $ref: "#/components/schemas/DeviceIpv4Addr"
        ipv6Address:
          $ref: "#/components/schemas/DeviceIpv6Address"
      minProperties: 1

    PhoneNumber:
      description: A public identifier addressing a telephone subscription, formatted according to E.164 with a leading '+'.
      type: string
      pattern: '^\+[1-9][0-9]{4,14}$'
      example: "+123456789"

    NetworkAccessIdentifier:
      description: A public identifier addressing a subscription in a mobile network (e.g., GPSI formatted as External Identifier).
      type: string
      example: "123456789@domain.com"

    DeviceIpv4Addr:
      type: object
      description: |
        Identification of a device using its IPv4 address.
        At least one of `privateAddress` or `publicPort` must be provided together with `publicAddress`.
      properties:
        publicAddress:
          $ref: "#/components/schemas/SingleIpv4Addr"
        privateAddress:
          $ref: "#/components/schemas/SingleIpv4Addr"
        publicPort:
          $ref: "#/components/schemas/Port"
      anyOf:
        - required: [publicAddress, privateAddress]
        - required: [publicAddress, publicPort]
      example:
        publicAddress: "84.125.93.10"
        publicPort: 59765

    SingleIpv4Addr:
      description: A single IPv4 address with no subnet mask.
      type: string
      format: ipv4
      example: "84.125.93.10"

    Port:
      description: TCP or UDP port number.
      type: integer
      minimum: 0
      maximum: 65535

    DeviceIpv6Address:
      description: |
        A single IPv6 address identifying the device.
      type: string
      format: ipv6
      example: "2001:db8:85a3:8d3:1319:8a2e:370:7344"

    # ---------- Query ----------
    QueryType:
      type: string
      description: |
        The type of query. The upstream CAMARA API also defines `AREALIMIT`
        (a geographic area restriction); this simulator implements the
        non-spatial `IMEIBIND` query only, so the enum is trimmed accordingly
        (documented cut — see the API description).
      enum:
        - IMEIBIND

    QueryRequest:
      description: Request to query the current status.
      type: object
      properties:
        device:
          $ref: "#/components/schemas/Device"
        queryType:
          $ref: "#/components/schemas/QueryType"
      required:
        - queryType

    QueryFraudPreventionResponse:
      description: Response containing the requested status.
      type: object
      properties:
        imeiBind:
          $ref: "#/components/schemas/ImeiBind"

    ImeiBind:
      description: IMEI binding status and bound IMEI (if any).
      type: object
      properties:
        bindImei:
          $ref: "#/components/schemas/BindImei"
        bindStatus:
          $ref: "#/components/schemas/BindStatus"

    BindImei:
      description: The IMEI currently bound to the SIM card (15 digits).
      type: string
      example: "352099001761481"

    BindStatus:
      description: |
        Status of the IMEI binding.
        - `BOUND`: an IMEI is bound.
        - `UNBOUND`: no IMEI is bound.
      type: string
      enum:
        - BOUND
        - UNBOUND

    # ---------- Error ----------
    ErrorInfo:
      description: Common error schema.
      type: object
      required:
        - status
        - code
        - message
      properties:
        status:
          type: integer
          description: HTTP status code.
        code:
          type: string
          description: Error code.
        message:
          type: string
          description: Human-readable explanation.

  # ---------- Responses ----------
  responses:
    QueryBadRequest400:
      description: Bad Request
      headers:
        x-correlator:
          $ref: "#/components/headers/x-correlator"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorInfo"
              - type: object
                properties:
                  status:
                    enum:
                      - 400
                  code:
                    enum:
                      - INVALID_ARGUMENT
                      - OUT_OF_RANGE
          examples:
            Insufficient Device Parameters:
              description: Sufficient parameters must be provided to allow the target UE to be identified
              value:
                status: 400
                code: INVALID_ARGUMENT
                message: "At least one of phoneNumber, networkAccessIdentifier, ipv4Address and ipv6Address must be specified"
            Insufficient QueryType Parameters:
              value:
                status: 400
                code: INVALID_ARGUMENT
                message: "QueryType must be specified"
            Invalid Phone Number:
              value:
                status: 400
                code: INVALID_ARGUMENT
                message: "Invalid format: phoneNumber"
            Invalid QueryType Value:
              value:
                status: 400
                code: INVALID_ARGUMENT
                message: "The value of queryType can only be IMEIBIND"

    Generic401:
      description: Unauthorized
      headers:
        x-correlator:
          $ref: "#/components/headers/x-correlator"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorInfo"
              - type: object
                properties:
                  status:
                    enum:
                      - 401
                  code:
                    enum:
                      - UNAUTHENTICATED
          examples:
            GENERIC_401_UNAUTHENTICATED:
              description: Request cannot be authenticated
              value:
                status: 401
                code: UNAUTHENTICATED
                message: Request not authenticated due to missing, invalid, or expired credentials.

    Generic403:
      description: Forbidden
      headers:
        x-correlator:
          $ref: "#/components/headers/x-correlator"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorInfo"
              - type: object
                properties:
                  status:
                    enum:
                      - 403
                  code:
                    enum:
                      - PERMISSION_DENIED
          examples:
            GENERIC_403_PERMISSION_DENIED:
              description: Permission denied. OAuth2 token access does not have the required scope or when the user fails operational security
              value:
                status: 403
                code: PERMISSION_DENIED
                message: Client does not have sufficient permissions to perform this action.

    Generic404:
      description: Not found
      headers:
        x-correlator:
          $ref: "#/components/headers/x-correlator"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorInfo"
              - type: object
                properties:
                  status:
                    enum:
                      - 404
                  code:
                    enum:
                      - NOT_FOUND
                      - IDENTIFIER_NOT_FOUND
          examples:
            GENERIC_404_NOT_FOUND:
              description: Resource is not found
              value:
                status: 404
                code: NOT_FOUND
                message: The specified resource is not found.

    Query422:
      description: Unprocessable Content
      headers:
        x-correlator:
          $ref: "#/components/headers/x-correlator"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorInfo"
              - type: object
                properties:
                  status:
                    enum:
                      - 422
                  code:
                    enum:
                      - MISSING_IDENTIFIER
                      - UNSUPPORTED_IDENTIFIER
                      - UNNECESSARY_IDENTIFIER
          examples:
            Unnecessary Identifier:
              description: An explicit identifier has been provided for the device when this is already identified by the access token
              value:
                status: 422
                code: UNNECESSARY_IDENTIFIER
                message: An explicit identifier has been provided for the device when this is already identified by the access token
            Missing Identifier:
              description: An identifier is not included in the request and the device cannot be identified from the 2-legged access token
              value:
                status: 422
                code: MISSING_IDENTIFIER
                message: The device cannot be identified.

    Generic429:
      description: Too Many Requests
      headers:
        x-correlator:
          $ref: "#/components/headers/x-correlator"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorInfo"
              - type: object
                properties:
                  status:
                    enum:
                      - 429
                  code:
                    enum:
                      - QUOTA_EXCEEDED
                      - TOO_MANY_REQUESTS
          examples:
            GENERIC_429_TOO_MANY_REQUESTS:
              description: API Server request limit is overpassed
              value:
                status: 429
                code: TOO_MANY_REQUESTS
                message: Rejected due to request rate limit overpassed.
