# CamaraSim — Optimal Edge Discovery, API version vwip (CAMARA work-in-progress).
#
# Vendored from the CAMARA Optimal Edge Discovery API (optimal-edge-discovery) and
# annotated with CamaraSim's parameter-driven functional cases (docs/DESIGN.md §7,
# §9). Backed by `src/apis/optimal_edge_discovery/vwip.rs`; spec and code must not
# drift.
#
# Optimal Edge Discovery has no released version yet — its upstream `main` spec is
# versioned `wip` — so, unlike the published sub-1.0 APIs (KYC Match v0.3, Location
# Retrieval v0.4), its canonical base path is literally `vwip`. This tracks the
# work-in-progress spec; a numbered version will be added when CAMARA cuts a
# release.
#
# Serves `POST /retrieve-optimal-edge-cloud-zones` (`discoverOptimalEdge`): the
# ranked list of edge cloud zones optimal for a device. (The read-only
# `GET /regions` is deferred to a later slice.)
openapi: 3.0.3
info:
  title: Optimal Edge Discovery
  description: |
    Returns a **ranked** list (1–20) of the edge cloud zones best suited to run an
    application's workload for a device — the ranked successor to Simple Edge
    Discovery (which answers a single closest zone). The answer is a list of
    `EdgeCloudZone`s (`{ edgeCloudZoneId, edgeCloudZoneName, edgeCloudProvider,
    edgeCloudRegion?, edgeCloudZoneStatus? }`), never the device's coordinates. The
    top zone is the recommended (`active`) one; the rest are ranked alternatives.

    This is the CamaraSim reference double for CAMARA Optimal Edge Discovery
    (work-in-progress). The device can be identified either by the `device` object
    in the request body (two-legged / CIBA) or by the identity a three-legged
    access token authenticated (in which case `device` is omitted). The endpoint
    requires the `optimal-edge-discovery:edge-zones:read` scope.

    ## Identifier resolution (two-legged vs three-legged)

    The `device` object is only meaningful in two-legged auth. In a three-legged
    token the device is already identified by the token subject:

    - `device` carries an identifier **and** the token subject is itself an
      E.164 line (a device-authenticated three-legged token) →
      `422 UNNECESSARY_IDENTIFIER`.
    - `device` carries an identifier, subject not a line → that identifier is
      used (two-legged). Precedence: `phoneNumber` → `networkAccessIdentifier` →
      the IPv4 `publicAddress` → `ipv6Address`.
    - `device` absent, subject is an E.164 line → the subject is the identifier
      (three-legged).
    - `device` absent **and** the subject is not a line → the device cannot be
      identified → `422 MISSING_IDENTIFIER`.
    - `device` present but carrying **no** identifier (`minProperties: 1`
      violated) → `400 INVALID_ARGUMENT`.

    ## Functional cases — the input is the control plane (docs/DESIGN.md §7)

    Three planes drive the answer:

    1. **`applicationProfileId`** — required; a missing or non-UUID value →
       `400 INVALID_ARGUMENT` (a structural plane, checked before the identifier).
    2. **`edgeCloudRegion`** — optional; when present it filters the candidate
       zones to that region. A malformed region (violating the pattern) →
       `400 INVALID_ARGUMENT`; a well-formed but unknown region (no zones there) →
       `404 NOT_FOUND`. A genuine second plane over the ranking.
    3. **Reserved error suffix** — if the resolved identifier's trailing three
       digits name a reserved CAMARA status, the endpoint answers with that
       canonical CAMARA error instead of a result (shared convention — see the
       referenced `errors.yaml`): `…400`, `…401`, `…403`, `…404`, `…409`, `…422`,
       `…429`, `…500`, `…503`. Checked first among the business planes.
    4. **Ranking** — otherwise the identifier's trailing three digits `d`
       (`0..=999`; `…000` / no trailing digits → 0) fix the ranking over the
       candidate zones: the optimal (top) zone is index `d % len`, and the list
       length is `(d % 3) + 1` (1–3 zones), wrapping the fixed 6-entry zone table.
       The top zone's `edgeCloudZoneStatus` is `active`, the rest `inactive`. So
       the same input always returns the same ranked list.

    The response echoes the device back only when the identifier is a
    `phoneNumber` (the CAMARA `DeviceResponse` carries only `phoneNumber`); for an
    IP-/NAI-keyed request the `device` field is omitted. The `applicationProfileId`
    is echoed back.

    Examples: `+123456789000` → 1 zone `[eu-west-1]` (`active`); `+123456789013` →
    2 zones from index `13 % 6 == 1`; `edgeCloudRegion: us-east-1` → only that
    region's zone(s); `+123456789404` → `404 NOT_FOUND`.
  version: "wip"
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: "{apiRoot}/optimal-edge-discovery/vwip"
    variables:
      apiRoot:
        default: http://localhost:8080
        description: API root, e.g. the CamaraSim base URL.

paths:
  /retrieve-optimal-edge-cloud-zones:
    post:
      operationId: discoverOptimalEdge
      summary: Discover the edge cloud zones optimal for a device
      description: |
        Returns a ranked list of the edge cloud zones optimal for running an
        application (identified by `applicationProfileId`) for the device. Supply a
        `device`, or omit it to use the device identified by a three-legged access
        token; optionally narrow the search with `edgeCloudRegion`.

        See the API description for the identifier-resolution rules and the
        parameter-driven functional cases.
      security:
        - openId:
            - optimal-edge-discovery:edge-zones:read
      parameters:
        - $ref: "#/components/parameters/XCorrelator"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OptimalEdgeDiscoveryInfo"
      responses:
        "200":
          description: The ranked list of edge cloud zones optimal for the device.
          headers:
            x-correlator:
              $ref: "#/components/headers/XCorrelator"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EdgeDiscoveryResponse"
              examples:
                single:
                  summary: A single optimal zone (…000)
                  value:
                    edgeCloudZones:
                      - edgeCloudZoneId: "00000000-0000-0000-0000-000000000000"
                        edgeCloudZoneName: camarasim-edge-eu-west-1
                        edgeCloudProvider: CamaraSim Edge
                        edgeCloudRegion: eu-west-1
                        edgeCloudZoneStatus: active
                    applicationProfileId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    device:
                      phoneNumber: "+123456789000"
                ranked:
                  summary: Two ranked zones (…013)
                  value:
                    edgeCloudZones:
                      - edgeCloudZoneId: "00000000-0000-0000-0000-000000000000"
                        edgeCloudZoneName: camarasim-edge-eu-central-1
                        edgeCloudProvider: CamaraSim Edge
                        edgeCloudRegion: eu-central-1
                        edgeCloudZoneStatus: active
                      - edgeCloudZoneId: "11111111-1111-1111-1111-111111111111"
                        edgeCloudZoneName: camarasim-edge-us-east-1
                        edgeCloudProvider: CamaraSim Edge
                        edgeCloudRegion: us-east-1
                        edgeCloudZoneStatus: inactive
                    applicationProfileId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        "400":
          description: |
            400 — bad request. CamaraSim returns `INVALID_ARGUMENT` for a malformed
            body, a missing/non-UUID `applicationProfileId`, a malformed
            `edgeCloudRegion`, an empty `device`, or a bad `phoneNumber`.
          headers:
            x-correlator:
              $ref: "#/components/headers/XCorrelator"
          content:
            application/json:
              schema:
                $ref: "../../shared/errors.yaml#/components/schemas/CamaraError"
              examples:
                invalidArgument:
                  summary: Missing applicationProfileId
                  value:
                    status: 400
                    code: INVALID_ARGUMENT
                    message: "`applicationProfileId` is required."
        "401":
          $ref: "../../shared/errors.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../../shared/errors.yaml#/components/responses/PermissionDenied"
        "404":
          description: |
            404 — not found. CamaraSim returns the shared `NOT_FOUND` for a
            well-formed but unknown `edgeCloudRegion` (no zones there), or for an
            identifier with the reserved `…404` suffix.
          headers:
            x-correlator:
              $ref: "#/components/headers/XCorrelator"
          content:
            application/json:
              schema:
                $ref: "../../shared/errors.yaml#/components/schemas/CamaraError"
              examples:
                notFound:
                  summary: Unknown region / reserved `…404` suffix
                  value:
                    status: 404
                    code: NOT_FOUND
                    message: The specified resource was not found.
        "409":
          $ref: "../../shared/errors.yaml#/components/responses/Conflict"
        "422":
          description: |
            422 — unprocessable. CamaraSim returns `MISSING_IDENTIFIER` when the
            device cannot be identified (no `device` and a non-line subject),
            `UNNECESSARY_IDENTIFIER` when a `device` is submitted on a three-legged
            device token, or the reserved shared `SERVICE_NOT_APPLICABLE` for the
            `…422` suffix.
          headers:
            x-correlator:
              $ref: "#/components/headers/XCorrelator"
          content:
            application/json:
              schema:
                $ref: "../../shared/errors.yaml#/components/schemas/CamaraError"
              examples:
                missingIdentifier:
                  summary: The device cannot be identified
                  value:
                    status: 422
                    code: MISSING_IDENTIFIER
                    message: The device cannot be identified.
                unnecessaryIdentifier:
                  summary: The device is already identified by the token
                  value:
                    status: 422
                    code: UNNECESSARY_IDENTIFIER
                    message: The device is already identified by the access token.
        "429":
          $ref: "../../shared/errors.yaml#/components/responses/TooManyRequests"
        "500":
          $ref: "../../shared/errors.yaml#/components/responses/Internal"
        "503":
          $ref: "../../shared/errors.yaml#/components/responses/Unavailable"
      x-camarasim-scenarios:
        description: >-
          The ranked edge cloud zones are selected from the identifier (the first
          present device identifier, else the access token subject) whose trailing
          three digits `d` drive the case (docs/DESIGN.md §7): the optimal (top)
          zone is index `d % 6` over a fixed 6-entry zone table and the list length
          is `(d % 3) + 1` (1–3 zones). A required `applicationProfileId` (UUID) and
          an optional `edgeCloudRegion` filter add two more planes; a well-formed
          but unknown region yields 404. Reserved error suffixes come from the
          shared convention in errors.yaml and are checked first among the business
          planes. Canonical Optimal Edge Discovery (wip) declares 422 IDENTIFIER
          sub-cases (MISSING_IDENTIFIER / UNNECESSARY_IDENTIFIER); CamaraSim models
          the shared reserved-suffix convention plus the identifier-resolution 422s,
          and exposes the full shared error set so every reserved case is reachable.
        cases:
          - input: "`applicationProfileId` missing or not a UUID"
            result: "400 INVALID_ARGUMENT"
          - input: "`edgeCloudRegion` violating `^[A-Za-z0-9-]+$`"
            result: "400 INVALID_ARGUMENT"
          - input: identifier ending in a reserved error suffix (e.g. …404)
            result: the canonical CAMARA error for that status
          - input: "identifier ending in …000 (or no trailing digits)"
            result: "200 — 1 zone at index 0, edgeCloudZoneStatus active"
          - input: "any other identifier tail d"
            result: "200 — (d % 3) + 1 zones from index d % 6; top zone active, rest inactive"
          - input: "`edgeCloudRegion` naming a known region"
            result: "200 — only that region's zone(s)"
          - input: "`edgeCloudRegion` well-formed but unknown"
            result: "404 NOT_FOUND"
          - input: "`device` present but carrying no identifier"
            result: "400 INVALID_ARGUMENT"
          - input: "`device` submitted on a three-legged line token"
            result: "422 UNNECESSARY_IDENTIFIER"
          - input: no `device` and a non-line token subject
            result: "422 MISSING_IDENTIFIER"

components:
  securitySchemes:
    openId:
      $ref: "../../auth/openapi.yaml#/components/securitySchemes/camaraOAuth"

  parameters:
    XCorrelator:
      name: x-correlator
      in: header
      required: false
      description: Correlation id for the request, echoed back on the response.
      schema:
        type: string

  headers:
    XCorrelator:
      description: The `x-correlator` from the request, echoed if one was sent.
      required: false
      schema:
        type: string

  schemas:
    OptimalEdgeDiscoveryInfo:
      type: object
      description: >-
        Discover the edge cloud zones optimal for a device. `applicationProfileId`
        is required; `device` is optional (omit it to use the device identified by
        a three-legged access token); `edgeCloudRegion` optionally narrows the
        search to one region.
      required:
        - applicationProfileId
      properties:
        applicationProfileId:
          type: string
          format: uuid
          maxLength: 36
          description: >-
            The application profile whose requirements the zones are ranked
            against. CamaraSim validates it is a UUID but does not resolve it
            against a profile store (a documented cut).
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        device:
          $ref: "#/components/schemas/Device"
        edgeCloudRegion:
          type: string
          pattern: '^[A-Za-z0-9-]+$'
          maxLength: 64
          description: >-
            Optionally narrow the search to a single edge cloud region. A
            well-formed but unknown region yields 404.
          example: "us-east-1"

    Device:
      type: object
      description: >-
        Identifies the device. At least one identifier must be present. Optional
        at the request level: omit `device` to use the device identified by a
        three-legged access token. CamaraSim keys its functional cases off the
        first present identifier, in the order phoneNumber →
        networkAccessIdentifier → ipv4Address.publicAddress → ipv6Address.
      minProperties: 1
      properties:
        phoneNumber:
          type: string
          description: A phone number in E.164 format (starting with `+`).
          pattern: '^\+[1-9][0-9]{4,14}$'
          example: "+123456789012"
        networkAccessIdentifier:
          type: string
          description: A network access identifier assigned by the operator.
          example: "user012@example.com"
        ipv4Address:
          $ref: "#/components/schemas/DeviceIpv4Addr"
        ipv6Address:
          type: string
          description: The device's IPv6 address.
          example: "2001:db8::11"

    DeviceIpv4Addr:
      type: object
      description: >-
        The device's IPv4 address information. CamaraSim reads `publicAddress` as
        the identifier; `privateAddress`/`publicPort` are accepted for fidelity.
      properties:
        publicAddress:
          type: string
          example: "203.0.113.12"
        privateAddress:
          type: string
          example: "192.0.2.25"
        publicPort:
          type: integer
          format: int32
          minimum: 0
          maximum: 65535
          example: 59765

    EdgeDiscoveryResponse:
      type: object
      description: The ranked edge cloud zones optimal for the device.
      required:
        - edgeCloudZones
      properties:
        edgeCloudZones:
          type: array
          minItems: 1
          maxItems: 20
          description: >-
            The ranked zones, best-first. CamaraSim returns `(d % 3) + 1` zones
            (1–3) from the fixed table, starting at index `d % 6`.
          items:
            $ref: "#/components/schemas/EdgeCloudZone"
        applicationProfileId:
          type: string
          format: uuid
          description: The `applicationProfileId` from the request, echoed back.
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        device:
          $ref: "#/components/schemas/DeviceResponse"

    EdgeCloudZone:
      type: object
      description: An edge cloud zone (MEC region), never the device's coordinates.
      required:
        - edgeCloudZoneId
        - edgeCloudZoneName
        - edgeCloudProvider
      properties:
        edgeCloudZoneId:
          type: string
          format: uuid
          description: >-
            A stable, UUID-shaped id derived from the zone name (SHA-256); stable
            per zone regardless of which device resolves to it.
          example: "5d803d3f-e8dc-4e1a-9f7e-2a4c9c0d3b21"
        edgeCloudZoneName:
          type: string
          maxLength: 64
          example: camarasim-edge-eu-west-1
        edgeCloudProvider:
          type: string
          maxLength: 64
          example: CamaraSim Edge
        edgeCloudRegion:
          type: string
          pattern: '^[A-Za-z0-9-]+$'
          example: eu-west-1
        edgeCloudZoneStatus:
          $ref: "#/components/schemas/EdgeCloudZoneStatus"

    EdgeCloudZoneStatus:
      type: string
      description: >-
        The zone's status in the ranked list. CamaraSim marks the optimal (top)
        zone `active` and the ranked alternatives `inactive`; the schema default
        `unknown` is not emitted (a documented cut).
      enum:
        - active
        - inactive
        - unknown
      default: unknown
      example: active

    DeviceResponse:
      type: object
      description: >-
        The device echoed back on a success. Per CAMARA this carries only
        `phoneNumber`, so CamaraSim echoes it only for a phone-number-keyed
        request (omitted for an IP-/NAI-keyed one).
      properties:
        phoneNumber:
          type: string
          pattern: '^\+[1-9][0-9]{4,14}$'
          example: "+123456789012"
