# CamaraSim — Device Visit Location, API version vwip (CAMARA work-in-progress).
#
# Vendored from the CAMARA Device Visit Location API (device-visit-location) and
# annotated with CamaraSim's parameter-driven functional cases (docs/DESIGN.md
# §7, §9). Backed by `src/apis/device_visit_location/vwip.rs`; spec and code must
# not drift.
#
# Device Visit Location has no released version yet — its upstream `main` spec is
# versioned `wip` — so, unlike the published sub-1.0 APIs (KYC Match v0.3,
# Location Retrieval v0.4), its canonical base path is literally `vwip`. This
# tracks the work-in-progress spec; a numbered version will be added when CAMARA
# cuts a release.
#
# Serves `POST /retrieve`.
openapi: 3.0.3
info:
  title: Device Visit Location
  description: |
    Returns the places a device has been over a caller-supplied time window, as a
    coarse list of geographic codes (postal codes with their country) — never
    precise coordinates. It is an anti-fraud / identity-assurance signal.

    This is the CamaraSim reference double for CAMARA Device Visit Location
    (work-in-progress). The device can be identified either by the `device` object
    in the request body (two-legged / CIBA) or by the identity a three-legged
    access token authenticated (in which case `device` is omitted). The endpoint
    requires the `device-visit-location:retrieve` scope.

    ## Identifier resolution (two-legged vs three-legged)

    The `device` object is only meaningful in two-legged auth. In a three-legged
    token the device is already identified by the token subject:

    - `device` carries an identifier **and** the token subject is itself an
      E.164 line (a device-authenticated three-legged token) →
      `422 UNNECESSARY_IDENTIFIER`.
    - `device` carries an identifier, subject not a line → that identifier is
      used (two-legged). Precedence: `phoneNumber` → `networkAccessIdentifier` →
      the IPv4 `publicAddress` → `ipv6Address`.
    - `device` absent, subject is an E.164 line → the subject is the identifier
      (three-legged).
    - `device` absent **and** the subject is not a line → the device cannot be
      identified → `422 MISSING_IDENTIFIER`.
    - `device` present but carrying **no** identifier (`minProperties: 1`
      violated) → `400 INVALID_ARGUMENT`.

    ## Functional cases — the input is the control plane (docs/DESIGN.md §7)

    Two control planes drive the answer:

    1. **The identifier** (the resolved device id):
       - **Reserved error suffix** — if the identifier's trailing three digits
         name a reserved CAMARA status, the endpoint answers with that canonical
         CAMARA error instead of a result (shared convention — see the referenced
         `errors.yaml`): `…400`, `…401`, `…403`, `…404`, `…409`, `…422`, `…429`,
         `…500`, `…503`. This plane is checked first, so it dominates the
         time-window and data planes.
       - **No visit data** — otherwise an identifier whose trailing three digits
         are `000` (or with no trailing digits) → `404
         DEVICE_VISIT_LOCATION.DATA_NOT_FOUND`. "No data" is a 404, not an empty
         list, because the success `geoCodeList` is non-empty (`minItems: 1`).
       - **Visited places** — any other tail `d` yields `((d - 1) % 3) + 1`
         geographic codes (1–3), the `i`-th on `COUNTRIES[(d + i) % 6]` over a
         fixed `[US, GB, DE, FR, ES, IT]` table with a deterministic postal code,
         so both the number of places and the countries are a genuine control
         plane (the same input always returns the same list).

    2. **The time window** (`startTime` / `endTime`, both required, RFC 3339):
       - A malformed timestamp → `400 INVALID_ARGUMENT`.
       - `endTime` strictly before `startTime` → `400
         DEVICE_VISIT_LOCATION.INVALID_END_DATE`.
       The window is validated after the reserved-error plane but before the data
       plane, so it too is reachable deterministically from the input.

    Examples: `+123456789012` over a valid window → `200` with 3 postal codes;
    `+123456789001` → 1 postal code; `+123456789000` → `404 DATA_NOT_FOUND`;
    `+123456789404` → `404 NOT_FOUND`; a window with `endTime < startTime` →
    `400 DEVICE_VISIT_LOCATION.INVALID_END_DATE`.
  version: "wip"
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: "{apiRoot}/device-visit-location/vwip"
    variables:
      apiRoot:
        default: http://localhost:8080
        description: API root, e.g. the CamaraSim base URL.

paths:
  /retrieve:
    post:
      operationId: retrieveDeviceVisitLocation
      summary: Retrieve a device's visited locations
      description: |
        Returns the geographic codes a device visited during the requested time
        window. Supply a `device`, or omit it to use the device identified by a
        three-legged access token.

        See the API description for the identifier-resolution rules and the
        parameter-driven functional cases.
      security:
        - openId:
            - device-visit-location:retrieve
      parameters:
        - $ref: "#/components/parameters/XCorrelator"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetrieveVisitLocationRequest"
      responses:
        "200":
          description: The device's visited locations.
          headers:
            x-correlator:
              $ref: "#/components/headers/XCorrelator"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrieveVisitLocationResponse"
              examples:
                threePlaces:
                  summary: A device (…012) that visited three places
                  value:
                    geoCodeList:
                      - countryCode: US
                        codeType: PostalCode
                        codeValue: "01651"
                      - countryCode: GB
                        codeType: PostalCode
                        codeValue: "02622"
                      - countryCode: DE
                        codeType: PostalCode
                        codeValue: "03593"
        "400":
          description: |
            400 — bad request. CamaraSim returns `INVALID_ARGUMENT` for a
            malformed body, an empty `device`, a bad `phoneNumber`, or a malformed
            `startTime`/`endTime`; and `DEVICE_VISIT_LOCATION.INVALID_END_DATE`
            when `endTime` is earlier than `startTime`.
          headers:
            x-correlator:
              $ref: "#/components/headers/XCorrelator"
          content:
            application/json:
              schema:
                $ref: "../../shared/errors.yaml#/components/schemas/CamaraError"
              examples:
                invalidArgument:
                  summary: Malformed request
                  value:
                    status: 400
                    code: INVALID_ARGUMENT
                    message: "`startTime` and `endTime` must be valid RFC 3339 date-times."
                invalidEndDate:
                  summary: endTime earlier than startTime
                  value:
                    status: 400
                    code: DEVICE_VISIT_LOCATION.INVALID_END_DATE
                    message: "`endTime` must not be earlier than `startTime`."
        "401":
          $ref: "../../shared/errors.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../../shared/errors.yaml#/components/responses/PermissionDenied"
        "404":
          description: |
            404 — not found. CamaraSim returns
            `DEVICE_VISIT_LOCATION.DATA_NOT_FOUND` when the device has no recorded
            visit data in the window (the `…000` tail), or the reserved shared
            `NOT_FOUND` for the `…404` suffix.
          headers:
            x-correlator:
              $ref: "#/components/headers/XCorrelator"
          content:
            application/json:
              schema:
                $ref: "../../shared/errors.yaml#/components/schemas/CamaraError"
              examples:
                dataNotFound:
                  summary: No visit data for the device in the window
                  value:
                    status: 404
                    code: DEVICE_VISIT_LOCATION.DATA_NOT_FOUND
                    message: No visit location data was found for the device in the requested time window.
                notFound:
                  summary: Reserved `…404` suffix
                  value:
                    status: 404
                    code: NOT_FOUND
                    message: The specified resource was not found.
        "409":
          $ref: "../../shared/errors.yaml#/components/responses/Conflict"
        "422":
          description: |
            422 — unprocessable. CamaraSim returns `MISSING_IDENTIFIER` when the
            device cannot be identified (no `device` and a non-line subject),
            `UNNECESSARY_IDENTIFIER` when a `device` is submitted on a
            three-legged device token, or the reserved shared
            `SERVICE_NOT_APPLICABLE` for the `…422` suffix.
          headers:
            x-correlator:
              $ref: "#/components/headers/XCorrelator"
          content:
            application/json:
              schema:
                $ref: "../../shared/errors.yaml#/components/schemas/CamaraError"
              examples:
                missingIdentifier:
                  summary: The device cannot be identified
                  value:
                    status: 422
                    code: MISSING_IDENTIFIER
                    message: The device cannot be identified.
                unnecessaryIdentifier:
                  summary: The device is already identified by the token
                  value:
                    status: 422
                    code: UNNECESSARY_IDENTIFIER
                    message: The device is already identified by the access token.
        "429":
          $ref: "../../shared/errors.yaml#/components/responses/TooManyRequests"
        "500":
          $ref: "../../shared/errors.yaml#/components/responses/Internal"
        "503":
          $ref: "../../shared/errors.yaml#/components/responses/Unavailable"
      x-camarasim-scenarios:
        description: >-
          The visited-location list is selected from the identifier (the first
          present device identifier, else the access token subject) whose trailing
          three digits drive the case (docs/DESIGN.md §7). Reserved error suffixes
          come from the shared convention in errors.yaml. Canonical Device Visit
          Location (wip) also declares the 422 IDENTIFIER_MISMATCH /
          SERVICE_NOT_APPLICABLE / UNSUPPORTED_IDENTIFIER and 404
          IDENTIFIER_NOT_FOUND sub-cases; CamaraSim models the shared
          reserved-suffix convention plus the identifier-resolution 422s and the
          DATA_NOT_FOUND 404, and exposes the full shared error set so every
          reserved case is reachable.
        cases:
          - input: identifier ending in a reserved error suffix (e.g. …404)
            result: the canonical CAMARA error for that status
          - input: "identifier ending in …000 (or no trailing digits)"
            result: "404 DEVICE_VISIT_LOCATION.DATA_NOT_FOUND"
          - input: "any other identifier tail d (valid window)"
            result: "200 — geoCodeList of ((d-1)%3)+1 codes, countries from [US,GB,DE,FR,ES,IT]"
          - input: "startTime or endTime malformed"
            result: "400 INVALID_ARGUMENT"
          - input: "endTime earlier than startTime (non-reserved identifier)"
            result: "400 DEVICE_VISIT_LOCATION.INVALID_END_DATE"
          - input: "`device` present but carrying no identifier"
            result: "400 INVALID_ARGUMENT"
          - input: "`device` submitted on a three-legged line token"
            result: "422 UNNECESSARY_IDENTIFIER"
          - input: no `device` and a non-line token subject
            result: "422 MISSING_IDENTIFIER"

components:
  securitySchemes:
    openId:
      $ref: "../../auth/openapi.yaml#/components/securitySchemes/camaraOAuth"

  parameters:
    XCorrelator:
      name: x-correlator
      in: header
      required: false
      description: Correlation id for the request, echoed back on the response.
      schema:
        type: string

  headers:
    XCorrelator:
      description: The `x-correlator` from the request, echoed if one was sent.
      required: false
      schema:
        type: string

  schemas:
    RetrieveVisitLocationRequest:
      type: object
      description: Request the visited locations for a device over a time window.
      required:
        - startTime
        - endTime
      properties:
        device:
          $ref: "#/components/schemas/Device"
        startTime:
          type: string
          format: date-time
          description: Start of the time window (RFC 3339, UTC).
          example: "2024-01-01T00:00:00Z"
        endTime:
          type: string
          format: date-time
          description: End of the time window (RFC 3339, UTC). Must not be earlier than `startTime`.
          example: "2024-01-08T00:00:00Z"

    Device:
      type: object
      description: >-
        Identifies the device. At least one identifier must be present. Optional
        at the request level: omit `device` to use the device identified by a
        three-legged access token. CamaraSim keys its functional cases off the
        first present identifier, in the order phoneNumber →
        networkAccessIdentifier → ipv4Address.publicAddress → ipv6Address.
      minProperties: 1
      properties:
        phoneNumber:
          type: string
          description: A phone number in E.164 format (starting with `+`).
          pattern: '^\+[1-9][0-9]{4,14}$'
          example: "+123456789012"
        networkAccessIdentifier:
          type: string
          description: A network access identifier assigned by the operator.
          example: "user012@example.com"
        ipv4Address:
          $ref: "#/components/schemas/DeviceIpv4Addr"
        ipv6Address:
          type: string
          description: The device's IPv6 address.
          example: "2001:db8::11"

    DeviceIpv4Addr:
      type: object
      description: >-
        The device's IPv4 address information. CamaraSim reads `publicAddress` as
        the identifier; `privateAddress`/`publicPort` are accepted for fidelity.
      properties:
        publicAddress:
          type: string
          example: "203.0.113.12"
        privateAddress:
          type: string
          example: "192.0.2.25"
        publicPort:
          type: integer
          format: int32
          minimum: 0
          maximum: 65535
          example: 59765

    RetrieveVisitLocationResponse:
      type: object
      description: The device's visited locations as a list of geographic codes.
      required:
        - geoCodeList
      properties:
        geoCodeList:
          type: array
          minItems: 1
          description: The geographic codes the device visited in the window.
          items:
            $ref: "#/components/schemas/GeographicalCode"

    GeographicalCode:
      type: object
      description: A single visited place, encoded as a country + postal code.
      required:
        - countryCode
        - codeType
        - codeValue
      properties:
        countryCode:
          type: string
          description: The visited country (ISO 3166-1 alpha-2).
          example: "FR"
        codeType:
          type: string
          description: The type of geographic code. CamaraSim always returns `PostalCode`.
          enum: [PostalCode]
          example: "PostalCode"
        codeValue:
          type: string
          description: The geographic code value (a postal code for `PostalCode`).
          example: "01651"
