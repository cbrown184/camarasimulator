openapi: 3.0.3
info:
  title: CamaraSim Authorization Server
  description: |
    OpenID Connect / OAuth2 authorization surface for CamaraSim, per the CAMARA
    **Security & Interoperability Profile** (see docs/DESIGN.md §6).

    This spec is authored (not vendored from an upstream API) because it describes
    the simulator's own auth server rather than a CAMARA business API. It grows one
    endpoint per pass; endpoints advertised in the discovery document but not yet
    listed here are implemented in later passes.
  version: 0.0.1
  license:
    name: Apache-2.0
servers:
  - url: /
paths:
  /.well-known/openid-configuration:
    get:
      operationId: getOpenidConfiguration
      summary: OIDC discovery document
      description: |
        Returns the OpenID Connect discovery metadata (OpenID Connect Discovery 1.0
        / RFC 8414) for the CamaraSim authorization server.

        Absolute endpoint URLs are derived from the request. The base URL is, in
        order of precedence:
          1. the `CAMARASIM_ISSUER` environment variable, if set; otherwise
          2. `X-Forwarded-Proto` (default `http`) + `Host` (default
             `localhost:8080`).

        The document advertises the full CAMARA auth surface: the three grant types
        (`client_credentials`, `authorization_code`, and CIBA), RS256 token signing,
        S256 PKCE, and CIBA `poll` delivery.
      responses:
        "200":
          description: Discovery metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenIdConfiguration"
              example:
                issuer: http://localhost:8080
                authorization_endpoint: http://localhost:8080/oauth2/authorize
                token_endpoint: http://localhost:8080/oauth2/token
                jwks_uri: http://localhost:8080/oauth2/jwks
                backchannel_authentication_endpoint: http://localhost:8080/bc-authorize
                response_types_supported: [code]
                grant_types_supported:
                  - client_credentials
                  - authorization_code
                  - urn:openid:params:grant-type:ciba
                token_endpoint_auth_methods_supported:
                  - client_secret_basic
                  - client_secret_post
                  - private_key_jwt
                subject_types_supported: [public]
                id_token_signing_alg_values_supported: [RS256]
                code_challenge_methods_supported: [S256]
                scopes_supported: [openid]
                backchannel_token_delivery_modes_supported: [poll]
                backchannel_authentication_request_signing_alg_values_supported: [RS256]
                backchannel_user_code_parameter_supported: false
  /oauth2/jwks:
    get:
      operationId: getJwks
      summary: JSON Web Key Set
      description: |
        Returns the JWK Set (RFC 7517) containing the public key(s) used to
        verify the signatures of JWTs issued by the token endpoint. This is the
        `jwks_uri` advertised by the discovery document.

        The simulator holds a single **fixed, public, simulator-only** RSA key
        (RS256). Because the key is fixed and bundled in the binary, this
        document is deterministic across boots and processes — clients and tests
        may rely on a stable `kid`. The key is not secret and must never be used
        to protect anything real.

        Each key is published as an RSA JWK with `use: "sig"`, `alg: "RS256"`, a
        stable `kid`, and base64url-encoded modulus (`n`) and exponent (`e`).
      responses:
        "200":
          description: The JWK Set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JwkSet"
              example:
                keys:
                  - kty: RSA
                    use: sig
                    alg: RS256
                    kid: camarasim-rs256-1
                    n: sZF66T5sGVzmmAJcP9oQkfEtklHIsVGAtmmXaYTOX_c5Xde6bX4SrXIgsvr3lJ9gm-6y9IL0_Da69kiMR4iK1AAoNWa2spRTXPbzFTAue3nU0PJ-PR3OT-x7RZOMI0JvgWME3AVkDlWM5kbtaf84RibIqyJqO9xhNAjfkMJDCpkj-qhUz7U_Eync2Gk8GmLBo1LOLYyzGCn6IG5dHUmjIgP7Q2PEoXftB0Z1l7S2yx46i3XvIjSpEixsqEjbLpoEBqH7xlc_UKBZzK5Tm3qjBhOH7W_tcj9CdhrPDjdt9rKo85d8lTpz2Za4hTrtx12eO31hGjmPQVVS4F53MYdosQ
                    e: AQAB
  /oauth2/token:
    post:
      operationId: token
      summary: OAuth2 token endpoint
      description: |
        Issues access tokens (RFC 6749 §3.2). The request body is
        `application/x-www-form-urlencoded`.

        **Implemented grant:** `client_credentials` (RFC 6749 §4.4) — the CAMARA
        two-legged flow for APIs that need no end-user context (docs/DESIGN.md §6).
        The grants `authorization_code` and
        `urn:openid:params:grant-type:ciba` are advertised by discovery but not
        yet implemented in this build and currently return
        `unsupported_grant_type`.

        **Issued token.** A real, signed **RS256** JWT with an `at+jwt` header
        (RFC 9068) whose `kid` matches the key published at `/oauth2/jwks`, so
        clients can verify it. Claims: `iss`, `aud` (both the issuer base URL),
        `sub` and `client_id` (the authenticated client), `scope` (the granted
        scope string), `iat`, `exp` (`iat` + 3600s), and a unique `jti`.

        ### Simulator functional cases (docs/DESIGN.md §7)

        The simulator authenticates the **shape** of the flow, not real secrets:

        - **Client authentication** is required. The `client_id` is resolved from
          either `client_secret_basic` (HTTP Basic `Authorization` header) or
          `client_secret_post` (`client_id` form field). Any secret value is
          accepted. If no `client_id` can be resolved the request fails with
          `invalid_client` (HTTP 401).
        - **Scope selection.** The requested `scope` (space-delimited) is granted
          verbatim: it becomes the token's `scope` claim and the response `scope`.
          Omit `scope` for an empty grant (no `scope` in the response).
        - **Expiry** is fixed at 3600 seconds (`expires_in`).

        Errors use the OAuth2 token-endpoint format (RFC 6749 §5.2) with
        `Cache-Control: no-store`:
          - missing `grant_type` → `invalid_request` (400)
          - unknown / not-yet-implemented `grant_type` → `unsupported_grant_type` (400)
          - no client authentication → `invalid_client` (401)
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/TokenRequest"
      responses:
        "200":
          description: Access token issued.
          headers:
            Cache-Control:
              schema:
                type: string
              description: Always `no-store` (RFC 6749 §5.1).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
              example:
                access_token: eyJhbGciOiJSUzI1NiIsInR5cCI6ImF0K2p3dCIsImtpZCI6ImNhbWFyYXNpbS1yczI1Ni0xIn0.eyJpc3MiOiJodHRwOi8vbG9jYWxob3N0OjgwODAifQ.signature
                token_type: Bearer
                expires_in: 3600
                scope: dpv:FraudPreventionAndDetection#check-sim-swap
        "400":
          description: Invalid request or unsupported grant type.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
              example:
                error: unsupported_grant_type
                error_description: the authorization server does not support this grant type
        "401":
          description: Client authentication failed / missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
              example:
                error: invalid_client
                error_description: client authentication required (client_secret_basic or client_secret_post)
components:
  schemas:
    TokenRequest:
      type: object
      required:
        - grant_type
      properties:
        grant_type:
          type: string
          description: |
            The OAuth2 grant type. Only `client_credentials` is implemented in
            this build; `authorization_code` and the CIBA grant are advertised by
            discovery but return `unsupported_grant_type` for now.
          enum:
            - client_credentials
            - authorization_code
            - urn:openid:params:grant-type:ciba
        scope:
          type: string
          description: |
            Space-delimited requested scopes (e.g. a CAMARA purpose scope such as
            `dpv:FraudPreventionAndDetection#check-sim-swap`). Granted verbatim by
            the simulator.
        client_id:
          type: string
          description: |
            Client identifier for `client_secret_post` authentication. May instead
            be supplied via HTTP Basic (`client_secret_basic`). Any secret is
            accepted by the simulator.
        client_secret:
          type: string
          description: Client secret. Accepted but not validated by the simulator.
    TokenResponse:
      type: object
      required:
        - access_token
        - token_type
        - expires_in
      properties:
        access_token:
          type: string
          description: A signed RS256 JWT (`at+jwt`), verifiable against `/oauth2/jwks`.
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Token lifetime in seconds (fixed at 3600).
        scope:
          type: string
          description: The granted scope. Omitted when no scope was requested.
    OAuthError:
      type: object
      description: OAuth2 token-endpoint error (RFC 6749 §5.2).
      required:
        - error
      properties:
        error:
          type: string
          enum:
            - invalid_request
            - invalid_client
            - invalid_grant
            - unauthorized_client
            - unsupported_grant_type
            - invalid_scope
        error_description:
          type: string
    JwkSet:
      type: object
      required:
        - keys
      properties:
        keys:
          type: array
          items:
            $ref: "#/components/schemas/Jwk"
    Jwk:
      type: object
      description: A JSON Web Key (RFC 7517). Only RSA public keys are published.
      required:
        - kty
        - kid
        - n
        - e
      properties:
        kty:
          type: string
          enum: [RSA]
          description: Key type.
        use:
          type: string
          enum: [sig]
          description: Public key use — `sig` (signature verification).
        alg:
          type: string
          enum: [RS256]
          description: Algorithm the key is used with.
        kid:
          type: string
          description: Stable key identifier, matched against the JWT header `kid`.
        n:
          type: string
          description: base64url-encoded (no padding) RSA modulus.
        e:
          type: string
          description: base64url-encoded (no padding) RSA public exponent.
    OpenIdConfiguration:
      type: object
      required:
        - issuer
        - authorization_endpoint
        - token_endpoint
        - jwks_uri
        - response_types_supported
        - grant_types_supported
        - subject_types_supported
        - id_token_signing_alg_values_supported
      properties:
        issuer:
          type: string
          format: uri
          description: Authorization server identifier; the base URL of the server.
        authorization_endpoint:
          type: string
          format: uri
        token_endpoint:
          type: string
          format: uri
        jwks_uri:
          type: string
          format: uri
          description: URL of the server's JSON Web Key Set.
        backchannel_authentication_endpoint:
          type: string
          format: uri
          description: CIBA backchannel authentication endpoint.
        response_types_supported:
          type: array
          items:
            type: string
        grant_types_supported:
          type: array
          items:
            type: string
        token_endpoint_auth_methods_supported:
          type: array
          items:
            type: string
        subject_types_supported:
          type: array
          items:
            type: string
        id_token_signing_alg_values_supported:
          type: array
          items:
            type: string
        code_challenge_methods_supported:
          type: array
          items:
            type: string
          description: PKCE code challenge methods; CAMARA requires S256.
        scopes_supported:
          type: array
          items:
            type: string
        backchannel_token_delivery_modes_supported:
          type: array
          items:
            type: string
        backchannel_authentication_request_signing_alg_values_supported:
          type: array
          items:
            type: string
        backchannel_user_code_parameter_supported:
          type: boolean
