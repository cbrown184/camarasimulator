        changed, and the `edgeCloudZones` / `kubernetesClusterRefs` arrays are
        replaced wholesale (not merged element-wise). `appId` is immutable and is
        not part of the patch. On success the updated `AppDeploymentInfo` is
        returned with a `200`.

        See the API description for the parameter-driven functional cases.
      security:
        - openId:
            - edge-application-management:deployments:update
      parameters:
        - $ref: "#/components/parameters/AppDeploymentId"
        - $ref: "#/components/parameters/XCorrelator"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/UpdateAppDeploymentRequest"
      responses:
        "200":
          description: The updated application deployment.
          headers:
            x-correlator:
              $ref: "#/components/headers/XCorrelator"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppDeploymentInfo"
        "400":
          $ref: "../../shared/errors.yaml#/components/responses/InvalidArgument"
        "401":
          $ref: "../../shared/errors.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../../shared/errors.yaml#/components/responses/PermissionDenied"
        "404":
          $ref: "../../shared/errors.yaml#/components/responses/NotFound"
        "409":
          description: The update would collide with an existing deployment.
          headers:
            x-correlator:
              $ref: "#/components/headers/XCorrelator"
          content:
            application/json:
              schema:
                $ref: "../../shared/errors.yaml#/components/schemas/CamaraError"
              example:
                status: 409
                code: ALREADY_EXISTS
                message: Deployment already exists
        "500":
          $ref: "../../shared/errors.yaml#/components/responses/Internal"
        "503":
          $ref: "../../shared/errors.yaml#/components/responses/Unavailable"
      x-camarasim-scenarios:
        description: >-
          `updateAppDeployment` updates a deployment in place via JSON Merge Patch
          (docs/DESIGN.md §7). The `appDeploymentId` (the resource key) is opaque
          and simulator-minted, so store state is a control plane, alongside the
          patched request. Only fields present in the body change; arrays are
          replaced wholesale; a `null` field is a no-op; `appId` is immutable. Four
          control planes: request validation → `400 INVALID_ARGUMENT`; unknown *or
          malformed* id → `404 NOT_FOUND` (malformed path folded into 404, like the
          read/delete legs); an effective `edgeCloudZones` entry naming no catalog
          zone → `404 NOT_FOUND`; and a patched `(appId, appDeploymentName, sorted
          edgeCloudZones)` identity colliding with a *different* stored deployment →
          `409 ALREADY_EXISTS` (mirroring `createAppDeployment`). On success →
          `200` with the updated `AppDeploymentInfo` (`appInstances` re-derived per
          effective zone). Canonical EdgeApplicationManagement declares
          400/401/403/404/409/500/503 here; CamaraSim additionally folds the
          malformed-path 400 into 404 (documented deviation).
        cases:
          - input: '`{appDeploymentName, edgeCloudZones}` on a known deployment'
            result: '200 — the updated `AppDeploymentInfo` (name + zones replaced, appInstances re-derived)'
          - input: 'a partial patch (only `appDeploymentName`) on a known deployment'
            result: '200 — name replaced, `edgeCloudZones`/`appInstances` unchanged'
          - input: 'an empty merge patch `{}` on a known deployment'
            result: '200 — the current `AppDeploymentInfo` (no-op)'
          - input: 'a supplied `appDeploymentName` breaking the pattern, or empty/non-UUID `edgeCloudZones`, or non-UUID `kubernetesClusterRefs`'
            result: '400 INVALID_ARGUMENT'
          - input: 'a well-formed UUID that was never deployed'
            result: '404 NOT_FOUND'
          - input: 'a malformed (non-UUID) `appDeploymentId`'
            result: '404 NOT_FOUND (the canonical 400 folded into 404)'
          - input: 'an `edgeCloudZones` entry (well-formed UUID) that is not in the catalog'
            result: '404 NOT_FOUND'
          - input: 'a patch whose new identity matches a different stored deployment'
            result: '409 ALREADY_EXISTS'
    delete:
      operationId: deleteAppDeployment
      summary: Delete an application deployment
      description: |
        Deletes an application deployment previously created with
        `createAppDeployment`, evicting its stored `AppDeploymentInfo`. On success
        the deployment is removed and `204 No Content` is returned.

        See the API description for the parameter-driven functional cases.
      security:
        - openId:
            - edge-application-management:deployments:delete
      parameters:
        - $ref: "#/components/parameters/AppDeploymentId"
        - $ref: "#/components/parameters/XCorrelator"
      responses:
        "204":
          description: The application deployment was deleted.
          headers:
            x-correlator:
              $ref: "#/components/headers/XCorrelator"
        "401":
          $ref: "../../shared/errors.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../../shared/errors.yaml#/components/responses/PermissionDenied"
        "404":
          $ref: "../../shared/errors.yaml#/components/responses/NotFound"
        "500":
          $ref: "../../shared/errors.yaml#/components/responses/Internal"
        "503":
          $ref: "../../shared/errors.yaml#/components/responses/Unavailable"
      x-camarasim-scenarios:
        description: >-
          `deleteAppDeployment` deletes an application deployment created by
          `createAppDeployment` (docs/DESIGN.md §7). The `appDeploymentId` is an
          opaque, simulator-minted UUID (not caller-chosen), so there is no
          reserved-error plane — the in-memory store state is the only control
          plane. A known id evicts its deployment and returns `204 No Content`
          (single-use); an unknown, already-deleted, *or malformed* id folds into
          `404 NOT_FOUND` (mirroring `getAppDeployment` and the sibling
          `deleteAppInstance` leg). Deletion is synchronous: CAMARA
          EdgeApplicationManagement's asynchronous `202 Accepted`/`DELETE_REQUESTED`
          form and any `sink` notification are a documented cut, mirroring every
          other CamaraSim delete leg (QoD `deleteSession`, `deleteApp`,
          `deleteAppInstance`, `deleteNetwork`).
        cases:
          - input: an `appDeploymentId` returned by a prior `createAppDeployment`
            result: '204 — the deployment is evicted (a later `getAppDeployment` 404s)'
          - input: the same `appDeploymentId` deleted a second time
            result: '404 NOT_FOUND (single-use eviction)'
          - input: a well-formed UUID that was never deployed
            result: '404 NOT_FOUND'
          - input: a malformed (non-UUID) `appDeploymentId`
            result: '404 NOT_FOUND (the canonical 400 folded into 404)'

components:
  securitySchemes:
    openId:
      $ref: "../../auth/openapi.yaml#/components/securitySchemes/camaraOAuth"

  parameters:
    XCorrelator:
      name: x-correlator
      in: header
      required: false
      description: Correlation id for the request, echoed back on the response.
      schema:
        type: string

    AppId:
      name: appId
      in: path
      required: true
      description: The identifier of an onboarded application (minted by `submitApp`).
      schema:
        type: string
        format: uuid
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
        minLength: 36
        maxLength: 36
      example: 5e3a8c2f-1b4d-5a6e-8f90-2c1d3e4f5a6b

    AppInstanceId:
      name: appInstanceId
      in: path
      required: true
      description: The identifier of an application instance (minted by `createAppInstance`).
      schema:
        type: string
        format: uuid
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
        minLength: 36
        maxLength: 36
      example: 6ec0bd7f-11c0-53da-975e-2a8ad9ebae0b

    AppDeploymentId:
      name: appDeploymentId
      in: path
      required: true
      description: The identifier of an application deployment (minted by `createAppDeployment`).
      schema:
        type: string
        format: uuid
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
        minLength: 36
        maxLength: 36
      example: 6ec0bd7f-11c0-53da-975e-2a8ad9ebae0b

  headers:
    XCorrelator:
      description: The `x-correlator` from the request, echoed if one was sent.
      required: false
      schema:
        type: string

  schemas:
    EdgeCloudZoneStatus:
      type: string
      description: The lifecycle status of an edge cloud zone.
      enum:
        - active
        - inactive
        - unknown
      default: unknown

    EdgeCloudZone:
      type: object
      description: An edge cloud zone available for application placement.
      required:
        - edgeCloudZoneId
        - edgeCloudZoneName
        - edgeCloudProvider
      properties:
        edgeCloudZoneId:
          type: string
          format: uuid
          description: Unique identifier of the edge cloud zone.
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
          minLength: 36
          maxLength: 36
          example: 6ec0bd7f-11c0-53da-975e-2a8ad9ebae0b
        edgeCloudZoneName:
          type: string
          maxLength: 64
          description: Human-readable name of the edge cloud zone.
          example: camarasim-edge-eu-west-1
        edgeCloudZoneStatus:
          $ref: "#/components/schemas/EdgeCloudZoneStatus"
        edgeCloudProvider:
          type: string
          maxLength: 64
          description: The provider operating the edge cloud zone.
          example: CamaraSim Edge
        edgeCloudRegion:
          type: string
          maxLength: 64
          description: Human-readable name of the geographical edge cloud region.
          example: eu-west-1

    EdgeCloudZoneId:
      type: string
      format: uuid
      description: Unique identifier of an edge cloud zone.
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      minLength: 36
      maxLength: 36
      example: 6ec0bd7f-11c0-53da-975e-2a8ad9ebae0b

    EdgeCloudRegion:
      type: string
      maxLength: 64
      description: Human-readable name of the geographical edge cloud region.
      example: eu-west-1

    KubernetesClusterRef:
      type: string
      format: uuid
      description: A globally unique identifier associated with a Kubernetes cluster.
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      minLength: 36
      maxLength: 36
      example: 642f6105-7015-4af1-a4d1-e1ecb8437abc

    KubernetesNodePool:
      type: object
      description: >-
        A set of Kubernetes nodes sharing the same configuration. CamaraSim
        returns a single fixed, representative node pool per cluster (there is no
        live orchestrator to size the pool — a documented simplification).
      required:
        - name
        - numNodes
        - nodeResources
        - scalable
      properties:
        name:
          type: string
          maxLength: 64
          description: Human-readable name of the Kubernetes node pool.
          example: default-pool
        numNodes:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          description: Number of nodes in the node pool.
          example: 3
        scalable:
          type: boolean
          description: Whether the node pool can be dynamically scaled by the system.
          example: true
        nodeResources:
          type: object
          description: Resource configuration of a node.
          required:
            - numCPU
            - memory
          properties:
            numCPU:
              type: integer
              format: int32
              minimum: 1
              maximum: 256
              description: Number of whole vCPUs for the node.
              example: 4
            memory:
              type: integer
              format: int32
              minimum: 1
              maximum: 16384
              description: System memory in megabytes for the node.
              example: 8192

    ClusterInfo:
      type: object
      description: Kubernetes cluster information (CAMARA `ClusterInfo`).
      required:
        - name
        - provider
        - clusterRef
        - edgeCloudZoneId
      properties:
        name:
          type: string
          maxLength: 64
          description: Name of the cluster, scoped to the provider.
          example: camarasim-cluster-eu-west-1a
        provider:
          $ref: "#/components/schemas/AppProvider"
        clusterRef:
          $ref: "#/components/schemas/KubernetesClusterRef"
        edgeCloudZoneId:
          $ref: "#/components/schemas/EdgeCloudZoneId"
        edgeCloudRegion:
          $ref: "#/components/schemas/EdgeCloudRegion"
        version:
          type: string
          maxLength: 64
          pattern: '^v?\d+\.\d+(?:\.\d+)?(?:[-+][0-9A-Za-z.-]+)?$'
          description: Kubernetes version of the cluster.
          example: 1.29.4
        nodePools:
          type: array
          minItems: 1
          maxItems: 100
          description: Node pools in the cluster.
          items:
            $ref: "#/components/schemas/KubernetesNodePool"

    AppProvider:
      type: string
      maxLength: 64
      description: The name of the application provider onboarding the app.
      example: CamaraSim Test

    AppRepo:
      type: object
      description: >-
        The repository from which the application image is pulled. CamaraSim
        validates only its presence (the full field set is a documented cut).
      required:
        - type
        - imagePath
      properties:
        type:
          type: string
          enum: [PRIVATEREPO, PUBLICREPO]
        imagePath:
          type: string
          format: uri
          example: https://repo.example/app:1

    AppManifest:
      type: object
      description: >-
        The application onboarding manifest (CAMARA `AppManifest`). CamaraSim
        validates the required top-level fields; the nested
        `requiredResources`/`componentSpec` shapes are checked only for
        presence/non-emptiness (documented cut — see the API description).
      required:
        - name
        - version
        - appProvider
        - packageType
        - appRepo
        - requiredResources
        - componentSpec
      properties:
        name:
          type: string
          maxLength: 64
          pattern: '^[A-Za-z][A-Za-z0-9_]{1,63}$'
          description: The name of the application. Immutable app identity coordinate.
          example: MyEdgeApp
        version:
          type: string
          maxLength: 64
          description: The version of the application. Immutable app identity coordinate.
          example: 1.0.0
        appProvider:
          $ref: "#/components/schemas/AppProvider"
        packageType:
          type: string
          description: The type of the application image package.
          enum: [QCOW2, OVA, CONTAINER, HELM, CSAR]
          example: CONTAINER
        appRepo:
          $ref: "#/components/schemas/AppRepo"
        requiredResources:
          type: object
          description: >-
            The infrastructure resources the application needs (CAMARA
            `oneOf` KubernetesResources / VmResources / ContainerResources /
            DockerComposeResources, discriminated by `infraKind`). CamaraSim
            validates presence only (documented cut).
        componentSpec:
          type: array
          minItems: 1
          description: Per-component network specification.
          items:
            type: object

    SubmittedApp:
      type: object
      description: The identifier of a successfully submitted application.
      required:
        - appId
      properties:
        appId:
          type: string
          format: uuid
          description: The unique identifier minted for the submitted application.
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
          minLength: 36
          maxLength: 36
          example: 5e3a8c2f-1b4d-5a6e-8f90-2c1d3e4f5a6b

    AppManifestInfo:
      description: >-
        An onboarded application as returned by `getApp` — the submitted
        `AppManifest` together with the `appId` assigned to it (CAMARA
        `AppManifestInfo`, `allOf` `AppManifest` + `appId`).
      allOf:
        - $ref: "#/components/schemas/AppManifest"
        - type: object
          required:
            - appId
          properties:
            appId:
              type: string
              format: uuid
              description: The unique identifier of the onboarded application.
              pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
              minLength: 36
              maxLength: 36
              example: 5e3a8c2f-1b4d-5a6e-8f90-2c1d3e4f5a6b

    AppInstanceName:
      type: string
      maxLength: 64
      pattern: '^[A-Za-z][A-Za-z0-9_]{1,63}$'
      description: Name of the app instance, scoped to the app provider.
      example: prod

    AppInstanceStatus:
      type: string
      description: The lifecycle status of an application instance.
      enum:
        - ready
        - instantiating
        - failed
        - terminating
        - unknown
      default: unknown

    CreateAppInstanceRequest:
      type: object
      description: The request to instantiate an onboarded application onto an edge cloud zone.
      required:
        - name
        - appId
        - edgeCloudZoneId
      properties:
        name:
          $ref: "#/components/schemas/AppInstanceName"
        appId:
          type: string
          format: uuid
          description: The identifier of an onboarded application (minted by `submitApp`).
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
          minLength: 36
          maxLength: 36
          example: 5e3a8c2f-1b4d-5a6e-8f90-2c1d3e4f5a6b
        edgeCloudZoneId:
          type: string
          format: uuid
          description: The identifier of the target edge cloud zone (from `getEdgeCloudZones`).
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
          minLength: 36
          maxLength: 36
          example: 6ec0bd7f-11c0-53da-975e-2a8ad9ebae0b
        kubernetesClusterRef:
          type: string
          format: uuid
          description: Optional reference to a specific Kubernetes cluster in the zone.
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
          minLength: 36
          maxLength: 36

    AppInstanceInfo:
      type: object
      description: >-
        A running (or instantiating) application instance (CAMARA
        `AppInstanceInfo`). CamaraSim omits the runtime `componentEndpointInfo`
        (there is no live workload — a documented cut).
      required:
        - name
        - appId
        - appInstanceId
        - appProvider
        - edgeCloudZoneId
      properties:
        name:
          $ref: "#/components/schemas/AppInstanceName"
        appId:
          type: string
          format: uuid
          description: The identifier of the onboarded application this instance runs.
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
          minLength: 36
          maxLength: 36
          example: 5e3a8c2f-1b4d-5a6e-8f90-2c1d3e4f5a6b
        appInstanceId:
          type: string
          format: uuid
          description: The unique identifier minted for this application instance.
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
          minLength: 36
          maxLength: 36
          example: 6ec0bd7f-11c0-53da-975e-2a8ad9ebae0b
        appProvider:
          $ref: "#/components/schemas/AppProvider"
        status:
          $ref: "#/components/schemas/AppInstanceStatus"
        edgeCloudZoneId:
          type: string
          format: uuid
          description: The edge cloud zone this instance is placed on.
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
          minLength: 36
          maxLength: 36
          example: 6ec0bd7f-11c0-53da-975e-2a8ad9ebae0b
        kubernetesClusterRef:
          type: string
          format: uuid
          description: The Kubernetes cluster this instance is placed on, if one was requested.
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
          minLength: 36
          maxLength: 36

    AppDeploymentName:
      type: string
      maxLength: 64
      pattern: '^[A-Za-z][A-Za-z0-9_]{1,63}$'
      description: Name of the app deployment, scoped to the app provider.
      example: prod

    AppDeploymentId:
      type: string
      format: uuid
      description: The unique identifier minted for an application deployment.
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      minLength: 36
      maxLength: 36
      example: 6ec0bd7f-11c0-53da-975e-2a8ad9ebae0b

    CreateAppDeploymentRequest:
      type: object
      description: The request to deploy an onboarded application across edge cloud zones.
      required:
        - appDeploymentName
        - appId
        - edgeCloudZones
      properties:
        appDeploymentName:
          $ref: "#/components/schemas/AppDeploymentName"
        appId:
          type: string
          format: uuid
          description: The identifier of an onboarded application (minted by `submitApp`).
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
          minLength: 36
          maxLength: 36
          example: 5e3a8c2f-1b4d-5a6e-8f90-2c1d3e4f5a6b
        edgeCloudZones:
          type: array
          description: The target edge cloud zones (from `getEdgeCloudZones`) to deploy onto.
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/EdgeCloudZoneId"
        kubernetesClusterRefs:
          type: array
          description: Optional references to specific Kubernetes clusters to place onto.
          maxItems: 100
          items:
            $ref: "#/components/schemas/KubernetesClusterRef"

    UpdateAppDeploymentRequest:
      type: object
      description: >-
        A JSON Merge Patch (RFC 7396) over an existing deployment. Every field is
        optional; only the fields present are changed, and the arrays are replaced
        wholesale (merge-patch array semantics), never merged element-wise. `appId`
        is immutable and is not part of the patch. CamaraSim treats a field set to
        JSON `null` as "no change" (the required `AppDeploymentInfo` fields can't
        be removed; `kubernetesClusterRefs` isn't persisted).
      properties:
        appDeploymentName:
          $ref: "#/components/schemas/AppDeploymentName"
        edgeCloudZones:
          type: array
          description: >-
            The new set of target edge cloud zones (replaces the current set). Must
            be non-empty when supplied (CamaraSim invariant, mirroring
            `createAppDeployment`).
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/EdgeCloudZoneId"
        kubernetesClusterRefs:
          type: array
          description: >-
            Optional references to specific Kubernetes clusters. Validated but
            accepted-not-applied (mirroring `createAppDeployment`).
          maxItems: 100
          items:
            $ref: "#/components/schemas/KubernetesClusterRef"

    AppDeploymentInfo:
      type: object
      description: >-
        An application deployment (CAMARA `AppDeploymentInfo`) — an onboarded app
        placed across one or more edge cloud zones, aggregating the app instances
        created per zone.
      required:
        - appDeploymentName
        - appDeploymentId
        - appId
        - edgeCloudZones
        - appInstances
      properties:
        appDeploymentName:
          $ref: "#/components/schemas/AppDeploymentName"
        appDeploymentId:
          $ref: "#/components/schemas/AppDeploymentId"
        appId:
          type: string
          format: uuid
          description: The identifier of the onboarded application this deployment runs.
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
          minLength: 36
          maxLength: 36
          example: 5e3a8c2f-1b4d-5a6e-8f90-2c1d3e4f5a6b
        edgeCloudZones:
          type: array
          description: The edge cloud zones the application is deployed across.
          maxItems: 100
          items:
            $ref: "#/components/schemas/EdgeCloudZoneId"
        appInstances:
          type: array
          description: The application instances created as part of this deployment.
          maxItems: 100
          items:
