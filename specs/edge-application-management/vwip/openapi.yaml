# CamaraSim — Edge Application Management, API version vwip
# (CAMARA EdgeApplicationManagement, `wip`).
#
# Vendored from the CAMARA Edge Application Management API
# (edge-application-management, `wip`) and annotated with CamaraSim's
# parameter-driven functional cases (docs/DESIGN.md §7, §9). Backed by
# `src/apis/edge_application_management/vwip.rs`; spec and code must not drift.
#
# Edge Application Management is the management counterpart to the EdgeCloud
# discovery APIs (Simple / Optimal Edge Discovery, Application Endpoint
# Discovery): discovery *finds* the right edge zone for a device; this API
# *places workloads* onto those zones (apps, app-instances, deployments).
#
# This slice serves:
#   GET  /edge-cloud-zones  (getEdgeCloudZones) — read-only zone catalog
#   POST /apps              (submitApp)         — onboard an application (stateful)
# The remaining app read/delete, app-instance, deployment and cluster resources
# are later passes.
openapi: 3.0.3
info:
  title: Edge Application Management
  description: |
    Manage the lifecycle of applications deployed onto an operator's edge cloud.
    This CamaraSim slice serves the **edge cloud zone catalog** — the zones a
    provider can deploy onto, a fixed in-memory set (there is no upstream
    orchestrator to query — DESIGN §7) — and the first stateful leg,
    **`submitApp`**, which onboards an application.

    ## Functional cases — the input is the control plane (docs/DESIGN.md §7)

    ### `getEdgeCloudZones`

    Returns the fixed catalog filtered by two query parameters (there is no
    device identifier, so no reserved-error plane — this is a pure catalog, like
    QoS Profiles):

    1. **`region`** — return only zones whose `edgeCloudRegion` matches exactly.
       An unknown region yields an empty array (a *list* never 404s).
    2. **`status`** — return only zones in that lifecycle state (`active`,
       `inactive`, `unknown`). An unrecognised value → `400 INVALID_ARGUMENT`.

    Both filters combine (AND). With neither, the whole catalog is returned.

    ### `submitApp`

    Onboards an application from a submitted `AppManifest`, mints an `appId` and
    remembers the manifest in memory. Two control planes:

    1. **Request validation** — a missing/blank required field, a `name` that
       violates the CAMARA pattern, an unknown `packageType`, or an empty
       `componentSpec` → `400 INVALID_ARGUMENT`.
    2. **Store state** — the `appId` is derived deterministically from the app's
       identity (`name` + `version` + `appProvider`), so submitting the *same*
       application twice collides → `409 ALREADY_EXISTS`.

    The nested `appRepo` / `requiredResources` / `componentSpec` item shapes are
    validated only for presence/non-emptiness — the full `requiredResources`
    `oneOf` (KubernetesResources / VmResources / …) validation is a documented
    cut.
  version: "wip"
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: "{apiRoot}/edge-application-management/vwip"
    variables:
      apiRoot:
        default: http://localhost:8080
        description: API root, e.g. the CamaraSim base URL.

paths:
  /apps:
    post:
      operationId: submitApp
      summary: Submit (onboard) an application
      description: |
        Submits an `AppManifest` to onboard an application onto the operator's
        edge cloud. On success the application is registered and a `SubmittedApp`
        (`appId`) is returned.

        See the API description for the parameter-driven functional cases.
      security:
        - openId:
            - edge-application-management:apps:write
      parameters:
        - $ref: "#/components/parameters/XCorrelator"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppManifest"
      responses:
        "201":
          description: Application submitted; the minted `appId` is returned.
          headers:
            x-correlator:
              $ref: "#/components/headers/XCorrelator"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmittedApp"
              example:
                appId: 5e3a8c2f-1b4d-5a6e-8f90-2c1d3e4f5a6b
        "400":
          $ref: "../../shared/errors.yaml#/components/responses/InvalidArgument"
        "401":
          $ref: "../../shared/errors.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../../shared/errors.yaml#/components/responses/PermissionDenied"
        "409":
          description: The application already exists.
          headers:
            x-correlator:
              $ref: "#/components/headers/XCorrelator"
          content:
            application/json:
              schema:
                $ref: "../../shared/errors.yaml#/components/schemas/CamaraError"
              example:
                status: 409
                code: ALREADY_EXISTS
                message: App already exists
        "500":
          $ref: "../../shared/errors.yaml#/components/responses/Internal"
        "503":
          $ref: "../../shared/errors.yaml#/components/responses/Unavailable"
      x-camarasim-scenarios:
        description: >-
          `submitApp` is CamaraSim's first stateful Edge Application Management
          leg (docs/DESIGN.md §7). Two control planes drive the outcome: request
          validation and store state. The `appId` is minted deterministically
          from the app identity (`name` + `version` + `appProvider`) as an RFC
          4122 v5 UUID (SHA-256, no new dependency), so re-submitting the same
          application collides → `409 ALREADY_EXISTS`. Canonical
          EdgeApplicationManagement declares 400/401/403/409/500/503 here.
          Documented cut: the full `requiredResources` `oneOf` and nested
          `appRepo`/`componentSpec` item shapes are validated only for
          presence/non-emptiness.
        cases:
          - input: a valid `AppManifest`
            result: '201 — `{ appId }` (the manifest is persisted in memory)'
          - input: the same `AppManifest` submitted again (same name/version/appProvider)
            result: '409 ALREADY_EXISTS'
          - input: same app but a different `version`
            result: '201 — a distinct `appId`'
          - input: a missing required field (name/version/appProvider/packageType/appRepo/requiredResources/componentSpec)
            result: '400 INVALID_ARGUMENT'
          - input: '`name` not matching `^[A-Za-z][A-Za-z0-9_]{1,63}$`'
            result: '400 INVALID_ARGUMENT'
          - input: '`packageType` not one of QCOW2/OVA/CONTAINER/HELM/CSAR'
            result: '400 INVALID_ARGUMENT'
          - input: an empty `componentSpec` array
            result: '400 INVALID_ARGUMENT'
          - input: a body that is not valid JSON
            result: '400 INVALID_ARGUMENT'

  /edge-cloud-zones:
    get:
      operationId: getEdgeCloudZones
      summary: Retrieve the available edge cloud zones
      description: |
        Returns the edge cloud zones the operator offers for application
        placement, as a JSON array. Narrow the result with the optional `region`
        / `status` filters.

        See the API description for the parameter-driven functional cases.
      security:
        - openId:
            - edge-application-management:edge-cloud-zones:read
      parameters:
        - name: region
          in: query
          required: false
          description: >-
            Filter to zones whose `edgeCloudRegion` matches this value exactly.
            An unknown region yields an empty array (a list never 404s).
          schema:
            type: string
            maxLength: 64
          example: us-east-1
        - name: status
          in: query
          required: false
          description: Filter to zones in this lifecycle state.
          schema:
            $ref: "#/components/schemas/EdgeCloudZoneStatus"
        - $ref: "#/components/parameters/XCorrelator"
      responses:
        "200":
          description: The edge cloud zones matching the criteria (possibly empty).
          headers:
            x-correlator:
              $ref: "#/components/headers/XCorrelator"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EdgeCloudZone"
              examples:
                catalog:
                  summary: The full zone catalog (no filter)
                  value:
                    - edgeCloudZoneId: 6ec0bd7f-11c0-53da-975e-2a8ad9ebae0b
                      edgeCloudZoneName: camarasim-edge-eu-west-1
                      edgeCloudZoneStatus: active
                      edgeCloudProvider: CamaraSim Edge
                      edgeCloudRegion: eu-west-1
                empty:
                  summary: No zone matches the filter
                  value: []
        "400":
          $ref: "../../shared/errors.yaml#/components/responses/InvalidArgument"
        "401":
          $ref: "../../shared/errors.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../../shared/errors.yaml#/components/responses/PermissionDenied"
        "429":
          $ref: "../../shared/errors.yaml#/components/responses/TooManyRequests"
        "500":
          $ref: "../../shared/errors.yaml#/components/responses/Internal"
        "503":
          $ref: "../../shared/errors.yaml#/components/responses/Unavailable"
      x-camarasim-scenarios:
        description: >-
          The result is the fixed edge-cloud-zone catalog filtered by
          `region`/`status` (docs/DESIGN.md §7). There is no device identifier,
          so no reserved-error plane applies. Canonical EdgeApplicationManagement
          declares 400/401/403/500/503 here; 429 is a CamaraSim extension from the
          shared error set. Note: the canonical `EdgeCloudZones` schema declares
          `minItems: 1`; CamaraSim relaxes it so a filter narrowing to zero returns
          `[]` (a list never 404s) — a documented deviation.
        cases:
          - input: no query parameters
            result: '200 — the whole zone catalog'
          - input: '`?region=<known>`'
            result: '200 — the zones in that region'
          - input: '`?region=<unknown>`'
            result: '200 — an empty array (a list never 404s)'
          - input: '`?status=active|inactive|unknown`'
            result: '200 — zones in that lifecycle state'
          - input: '`region` and `status` together'
            result: '200 — zones matching both (AND)'
          - input: '`status` not one of the three enum values'
            result: '400 INVALID_ARGUMENT'
          - input: an unrecognised query parameter
            result: '400 INVALID_ARGUMENT'

components:
  securitySchemes:
    openId:
      $ref: "../../auth/openapi.yaml#/components/securitySchemes/camaraOAuth"

  parameters:
    XCorrelator:
      name: x-correlator
      in: header
      required: false
      description: Correlation id for the request, echoed back on the response.
      schema:
        type: string

  headers:
    XCorrelator:
      description: The `x-correlator` from the request, echoed if one was sent.
      required: false
      schema:
        type: string

  schemas:
    EdgeCloudZoneStatus:
      type: string
      description: The lifecycle status of an edge cloud zone.
      enum:
        - active
        - inactive
        - unknown
      default: unknown

    EdgeCloudZone:
      type: object
      description: An edge cloud zone available for application placement.
      required:
        - edgeCloudZoneId
        - edgeCloudZoneName
        - edgeCloudProvider
      properties:
        edgeCloudZoneId:
          type: string
          format: uuid
          description: Unique identifier of the edge cloud zone.
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
          minLength: 36
          maxLength: 36
          example: 6ec0bd7f-11c0-53da-975e-2a8ad9ebae0b
        edgeCloudZoneName:
          type: string
          maxLength: 64
          description: Human-readable name of the edge cloud zone.
          example: camarasim-edge-eu-west-1
        edgeCloudZoneStatus:
          $ref: "#/components/schemas/EdgeCloudZoneStatus"
        edgeCloudProvider:
          type: string
          maxLength: 64
          description: The provider operating the edge cloud zone.
          example: CamaraSim Edge
        edgeCloudRegion:
          type: string
          maxLength: 64
          description: Human-readable name of the geographical edge cloud region.
          example: eu-west-1

    AppProvider:
      type: string
      maxLength: 64
      description: The name of the application provider onboarding the app.
      example: CamaraSim Test

    AppRepo:
      type: object
      description: >-
        The repository from which the application image is pulled. CamaraSim
        validates only its presence (the full field set is a documented cut).
      required:
        - type
        - imagePath
      properties:
        type:
          type: string
          enum: [PRIVATEREPO, PUBLICREPO]
        imagePath:
          type: string
          format: uri
          example: https://repo.example/app:1

    AppManifest:
      type: object
      description: >-
        The application onboarding manifest (CAMARA `AppManifest`). CamaraSim
        validates the required top-level fields; the nested
        `requiredResources`/`componentSpec` shapes are checked only for
        presence/non-emptiness (documented cut — see the API description).
      required:
        - name
        - version
        - appProvider
        - packageType
        - appRepo
        - requiredResources
        - componentSpec
      properties:
        name:
          type: string
          maxLength: 64
          pattern: '^[A-Za-z][A-Za-z0-9_]{1,63}$'
          description: The name of the application. Immutable app identity coordinate.
          example: MyEdgeApp
        version:
          type: string
          maxLength: 64
          description: The version of the application. Immutable app identity coordinate.
          example: 1.0.0
        appProvider:
          $ref: "#/components/schemas/AppProvider"
        packageType:
          type: string
          description: The type of the application image package.
          enum: [QCOW2, OVA, CONTAINER, HELM, CSAR]
          example: CONTAINER
        appRepo:
          $ref: "#/components/schemas/AppRepo"
        requiredResources:
          type: object
          description: >-
            The infrastructure resources the application needs (CAMARA
            `oneOf` KubernetesResources / VmResources / ContainerResources /
            DockerComposeResources, discriminated by `infraKind`). CamaraSim
            validates presence only (documented cut).
        componentSpec:
          type: array
          minItems: 1
          description: Per-component network specification.
          items:
            type: object

    SubmittedApp:
      type: object
      description: The identifier of a successfully submitted application.
      required:
        - appId
      properties:
        appId:
          type: string
          format: uuid
          description: The unique identifier minted for the submitted application.
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
          minLength: 36
          maxLength: 36
          example: 5e3a8c2f-1b4d-5a6e-8f90-2c1d3e4f5a6b
