  /deployments:
    post:
      operationId: createAppDeployment
      summary: Deploy an application across one or more edge cloud zones
      description: |
        Deploys an onboarded application (`appId`) across the target edge cloud
        zones (`edgeCloudZones`) under a caller-chosen `appDeploymentName`. On
        success an `appDeploymentId` is minted and returned with a `Location`
        header; deployment is modelled as asynchronous (`202 Accepted`).

        See the API description for the parameter-driven functional cases.
      security:
        - openId:
            - edge-application-management:deployments:write
      parameters:
        - $ref: "#/components/parameters/XCorrelator"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAppDeploymentRequest"
      responses:
        "202":
          description: >-
            Deployment accepted; the minted `appDeploymentId` is returned.
          headers:
            x-correlator:
              $ref: "#/components/headers/XCorrelator"
            Location:
              description: URI of the created deployment resource.
              required: false
              schema:
                type: string
                format: uri
                example: >-
                  /edge-application-management/vwip/deployments/6ec0bd7f-11c0-53da-975e-2a8ad9ebae0b
          content:
            application/json:
              schema:
                type: object
                required:
                  - appDeploymentId
                properties:
                  appDeploymentId:
                    $ref: "#/components/schemas/AppDeploymentId"
        "400":
          $ref: "../../shared/errors.yaml#/components/responses/InvalidArgument"
        "401":
          $ref: "../../shared/errors.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../../shared/errors.yaml#/components/responses/PermissionDenied"
        "404":
          description: >-
            The referenced application (`appId`) or one of the edge cloud zones
            (`edgeCloudZones`) does not exist.
          headers:
            x-correlator:
              $ref: "#/components/headers/XCorrelator"
          content:
            application/json:
              schema:
                $ref: "../../shared/errors.yaml#/components/schemas/CamaraError"
              example:
                status: 404
                code: NOT_FOUND
                message: No application found for the provided appId.
        "409":
          description: The deployment already exists.
          headers:
            x-correlator:
              $ref: "#/components/headers/XCorrelator"
          content:
            application/json:
              schema:
                $ref: "../../shared/errors.yaml#/components/schemas/CamaraError"
              example:
                status: 409
                code: ALREADY_EXISTS
                message: Deployment already exists
        "500":
          $ref: "../../shared/errors.yaml#/components/responses/Internal"
        "503":
          $ref: "../../shared/errors.yaml#/components/responses/Unavailable"
      x-camarasim-scenarios:
        description: >-
          `createAppDeployment` deploys an onboarded app across one or more edge
          cloud zones (docs/DESIGN.md §7). Three control planes drive the
          outcome: request validation, a cross-reference against the app + zone
          stores, and store state. The `appDeploymentId` is minted
          deterministically from the `(appId, appDeploymentName, sorted
          edgeCloudZones)` identity (RFC 4122 v5 UUID, SHA-256, no new
          dependency), so re-deploying the same app under the same name across the
          same zone set (in any order) collides → `409 ALREADY_EXISTS`. The
          persisted `AppDeploymentInfo` lists one `appInstances` id per target
          zone (the same derivation `createAppInstance` uses). Canonical
          EdgeApplicationManagement declares 400/401/403/409/500/503 here (plus
          404 for the CamaraSim cross-reference). Documented cuts: the individual
          `AppInstanceInfo` resources are not separately materialised into the
          app-instance store (the deployment models the aggregate), and the
          `subscriptionRequest` status-change callback is accepted-not-applied.
        cases:
          - input: a valid request naming an onboarded `appId` and catalog `edgeCloudZones`
            result: '202 — `{ appDeploymentId }` with a `Location` header; the `AppDeploymentInfo` is persisted'
          - input: the same `appId` + `appDeploymentName` + zone set again (any order)
            result: '409 ALREADY_EXISTS'
          - input: the same `appId` + zones under a different `appDeploymentName`
            result: '202 — a distinct `appDeploymentId`'
          - input: a well-formed `appId` that was never onboarded
            result: '404 NOT_FOUND'
          - input: an `edgeCloudZones` entry that is not in the catalog
            result: '404 NOT_FOUND'
          - input: a missing/blank `appDeploymentName`, or one not matching `^[A-Za-z][A-Za-z0-9_]{1,63}$`
            result: '400 INVALID_ARGUMENT'
          - input: a missing/non-UUID `appId`, an empty/oversized `edgeCloudZones`, or a non-UUID zone / `kubernetesClusterRefs` entry
            result: '400 INVALID_ARGUMENT'
          - input: a body that is not valid JSON
            result: '400 INVALID_ARGUMENT'
    get:
