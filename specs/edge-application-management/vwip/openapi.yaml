# CamaraSim — Edge Application Management, API version vwip
# (CAMARA EdgeApplicationManagement, `wip`).
#
# Vendored from the CAMARA Edge Application Management API
# (edge-application-management, `wip`) and annotated with CamaraSim's
# parameter-driven functional cases (docs/DESIGN.md §7, §9). Backed by
# `src/apis/edge_application_management/vwip.rs`; spec and code must not drift.
#
# Edge Application Management is the management counterpart to the EdgeCloud
# discovery APIs (Simple / Optimal Edge Discovery, Application Endpoint
# Discovery): discovery *finds* the right edge zone for a device; this API
# *places workloads* onto those zones (apps, app-instances, deployments).
#
# This slice serves:
#   GET    /edge-cloud-zones  (getEdgeCloudZones)  — read-only zone catalog
#   POST   /apps              (submitApp)          — onboard an application (stateful)
#   GET    /apps/{appId}      (getApp)             — read back an onboarded app
#   GET    /apps              (getApps)            — list onboarded apps
#   DELETE /apps/{appId}      (deleteApp)          — delete an onboarded app
#   POST   /app-instances                    (createAppInstance)  — instantiate an app onto a zone (stateful)
#   GET    /app-instances/{appInstanceId}     (getAppInstance)     — read back an app instance
#   GET    /app-instances                     (getAppInstances)    — list app instances
#   DELETE /app-instances/{appInstanceId}     (deleteAppInstance)  — delete an app instance
#   GET    /clusters                          (getClusters)        — read-only cluster catalog
#   POST   /deployments                       (createAppDeployment) — deploy an app across zones (stateful)
#   GET    /deployments/{appDeploymentId}      (getAppDeployment)    — read back a deployment
#   GET    /deployments                        (getAppDeployments)   — list deployments
#   DELETE /deployments/{appDeploymentId}      (deleteAppDeployment) — delete a deployment
#   PATCH  /deployments/{appDeploymentId}      (updateAppDeployment) — update a deployment (JSON Merge Patch)
openapi: 3.0.3
info:
  title: Edge Application Management
  description: |
    Manage the lifecycle of applications deployed onto an operator's edge cloud.
    This CamaraSim slice serves the **edge cloud zone catalog** — the zones a
    provider can deploy onto, a fixed in-memory set (there is no upstream
    orchestrator to query — DESIGN §7) — and the first stateful leg,
    **`submitApp`**, which onboards an application.

    ## Functional cases — the input is the control plane (docs/DESIGN.md §7)

    ### `getEdgeCloudZones`

    Returns the fixed catalog filtered by two query parameters (there is no
    device identifier, so no reserved-error plane — this is a pure catalog, like
    QoS Profiles):

    1. **`region`** — return only zones whose `edgeCloudRegion` matches exactly.
       An unknown region yields an empty array (a *list* never 404s).
    2. **`status`** — return only zones in that lifecycle state (`active`,
       `inactive`, `unknown`). An unrecognised value → `400 INVALID_ARGUMENT`.

    Both filters combine (AND). With neither, the whole catalog is returned.

    ### `submitApp`

    Onboards an application from a submitted `AppManifest`, mints an `appId` and
    remembers the manifest in memory. Two control planes:

    1. **Request validation** — a missing/blank required field, a `name` that
       violates the CAMARA pattern, an unknown `packageType`, or an empty
       `componentSpec` → `400 INVALID_ARGUMENT`.
    2. **Store state** — the `appId` is derived deterministically from the app's
       identity (`name` + `version` + `appProvider`), so submitting the *same*
       application twice collides → `409 ALREADY_EXISTS`.

    The nested `appRepo` / `requiredResources` / `componentSpec` item shapes are
    validated only for presence/non-emptiness — the full `requiredResources`
    `oneOf` (KubernetesResources / VmResources / …) validation is a documented
    cut.

    ### `createAppInstance`

    Instantiates an onboarded application onto a specific edge cloud zone: the
    caller supplies the instance `name`, the `appId` of an app onboarded via
    `submitApp`, and the `edgeCloudZoneId` of a target zone. The simulator mints
    an `appInstanceId`, renders an `AppInstanceInfo`, remembers it in memory, and
    returns `202 Accepted` with a `Location` header (CAMARA models instantiation
    as asynchronous). Three control planes:

    1. **Request validation** — a missing/blank/invalid `name`, a missing or
       non-UUID `appId` / `edgeCloudZoneId`, or a non-UUID `kubernetesClusterRef`
       → `400 INVALID_ARGUMENT`.
    2. **Cross-reference** — the `appId` must name an onboarded app (its
       `appProvider` is echoed into the response) and the `edgeCloudZoneId` must
       name a zone in the fixed `edge-cloud-zones` catalog. Either miss →
       `404 NOT_FOUND`.
    3. **Store state** — the `appInstanceId` is derived deterministically from
       the `(appId, edgeCloudZoneId)` pair, so instantiating the *same* app onto
       the *same* zone collides → `409 ALREADY_EXISTS` (CAMARA's "already
       instantiated in the given Edge Cloud Zone" conflict).

    The reported `status` is a genuine second control plane: it follows the
    target zone's own catalog `edgeCloudZoneStatus` — an `active` zone →
    `ready`, an `inactive` zone → `failed`, an `unknown`-status zone →
    `instantiating`. The `componentEndpointInfo` (runtime endpoints) is omitted —
    there is no live workload — and the `terminating` / `unknown` instance states
    (teardown/degraded transitions) are unreachable on create: documented cuts.
    The `subscriptionRequest` status-change callback is accepted-not-applied
    (notifications are a later slice).

    ### `getAppInstance` / `getAppInstances` / `deleteAppInstance`

    The read/list/delete legs of the app-instance resource, mirroring the `apps`
    CRUD. The `appInstanceId` is an opaque, simulator-minted UUID (not
    caller-chosen), so there is **no reserved-error plane** — the in-memory
    instance store is the only control plane:

    - **`getAppInstance`** (`GET /app-instances/{appInstanceId}`) — a known id
      returns the stored `AppInstanceInfo` verbatim (`200`); an unknown *or
      malformed* id folds into `404 NOT_FOUND`.
    - **`getAppInstances`** (`GET /app-instances`) — the current store snapshot
      as an array of `AppInstanceInfo` (`200`), empty when nothing has been
      instantiated (a list never 404s).
    - **`deleteAppInstance`** (`DELETE /app-instances/{appInstanceId}`) — a known
      id evicts its instance and returns `204 No Content` (single-use); an
      unknown/already-deleted *or malformed* id → `404 NOT_FOUND`. Deletion is
      synchronous (the async `202`/`DELETE_REQUESTED` form + `sink` notification
      are a documented cut, mirroring every other CamaraSim delete leg).

    ### `getClusters`

    Lists the operator's fixed Kubernetes-cluster catalog as an array of
    `ClusterInfo`, narrowed by three optional query filters. There is no device
    identifier, so — like `getEdgeCloudZones` — there is no reserved-error plane;
    this is a pure catalog. Two control planes:

    1. **Query filters** — `region` (exact `edgeCloudRegion`), `clusterRef`
       (exact `clusterRef`) and `edgeCloudZoneId` (exact `edgeCloudZoneId`)
       narrow the catalog, combining with AND. No match → an empty array (a
       *list* never 404s).
    2. **Validation** — `clusterRef` / `edgeCloudZoneId` are strict UUIDs, so a
       malformed value → `400 INVALID_ARGUMENT`; an unrecognised query key is
       rejected. `region` is free text (an unknown region simply matches
       nothing).

    Each cluster is hosted in one of the fixed `edge-cloud-zones`, so its
    `edgeCloudZoneId` cross-references the zone catalog and its `edgeCloudRegion`
    is inherited from that zone. A single fixed, representative `nodePools` entry
    demonstrates the schema — there is no live orchestrator to size the pool (a
    documented simplification).

    ### `createAppDeployment`

    Deploys an onboarded application (`appId`) across one or more edge cloud
    zones (`edgeCloudZones`) under a caller-chosen `appDeploymentName`, minting an
    `appDeploymentId` and returning `202 Accepted` (deployment is modelled as
    asynchronous). Three control planes drive the outcome:

    1. **Request validation** — a missing/blank/invalid `appDeploymentName`, a
       missing or non-UUID `appId`, a missing/empty/oversized `edgeCloudZones`
       list or a non-UUID zone / `kubernetesClusterRefs` element → `400
       INVALID_ARGUMENT`.
    2. **Cross-reference** — the `appId` must name an app onboarded via
       `submitApp`, and *every* `edgeCloudZones` entry must name a zone in the
       fixed catalog; either miss → `404 NOT_FOUND`.
    3. **Store state** — the `appDeploymentId` is minted deterministically from
       the `(appId, appDeploymentName, sorted edgeCloudZones)` identity (RFC 4122
       v5 UUID, SHA-256, no new dependency), so re-deploying the same app under
       the same name across the same zone *set* (in any order) collides → `409
       ALREADY_EXISTS`.

    The persisted `AppDeploymentInfo` lists one `appInstances` id per target
    zone, each derived with the same derivation `createAppInstance` uses, so a
    deployment's instance ids line up with the app-instance keyspace. The
    individual `AppInstanceInfo` resources are **not** separately materialised
    into the app-instance store (a documented cut — the deployment models the
    aggregate), and the `subscriptionRequest` status-change callback is accepted-
    not-applied.

    ### `getAppDeployment` / `getAppDeployments` / `deleteAppDeployment`

    The read/list/delete legs of the deployment resource, mirroring the `apps` and
    `app-instances` CRUD. Each is keyed only on the in-memory store — the
    `appDeploymentId` is opaque and simulator-minted, so there is no reserved-error
    plane.

    - **`getAppDeployment`** (`GET /deployments/{appDeploymentId}`) — a known id →
      `200` with the stored `AppDeploymentInfo` verbatim (it already carries its
      `appDeploymentId` and `appInstances`); an unknown *or malformed* id folds into
      `404 NOT_FOUND` (mirroring `getApp` / `getAppInstance`).
    - **`getAppDeployments`** (`GET /deployments`) — the current store snapshot as
      an array of `AppDeploymentInfo` (empty when nothing has been deployed — a list
      never 404s), the same shape as the single read (mirroring `getApps` /
      `getAppInstances`).
    - **`deleteAppDeployment`** (`DELETE /deployments/{appDeploymentId}`) — a known
      id evicts its deployment → `204 No Content` (single-use); an unknown,
      already-deleted, *or malformed* id → `404 NOT_FOUND`. Synchronous delete
      (async `202`/`DELETE_REQUESTED` a documented cut, mirroring `deleteAppInstance`).

    ### `updateAppDeployment`

    **`updateAppDeployment`** (`PATCH /deployments/{appDeploymentId}`, scope
    `edge-application-management:deployments:update`) updates a deployment **in
    place** using JSON Merge Patch (RFC 7396, `application/merge-patch+json`):
    only the fields present in the body are changed, and `edgeCloudZones` /
    `kubernetesClusterRefs` are *replaced* wholesale, never merged element-wise. A
    field carrying JSON `null` is treated as "no change" (the required
    `AppDeploymentInfo` fields can't be removed; `kubernetesClusterRefs` isn't
    persisted). `appId` is immutable (not in the patch schema). Control planes
    (DESIGN §7):

    - **Request validation** — a supplied `appDeploymentName` breaking the pattern,
      an empty/oversized/non-UUID `edgeCloudZones`, or a non-UUID/oversized
      `kubernetesClusterRefs` → `400 INVALID_ARGUMENT`.
    - **Store state** — an unknown/already-deleted *or malformed* `appDeploymentId`
      → `404 NOT_FOUND` (malformed path folded into 404, like the read/delete legs).
    - **Cross-reference** — every *effective* `edgeCloudZones` entry must name a
      catalog zone → else `404 NOT_FOUND`.
    - **Identity collision** — the `appDeploymentId` (store key) is left unchanged,
      but the patched `(appId, appDeploymentName, sorted edgeCloudZones)` identity is
      re-derived; if it now matches a *different* stored deployment, the update would
      make two deployments identical → `409 ALREADY_EXISTS` (mirroring
      `createAppDeployment`).

    On success → `200` with the updated `AppDeploymentInfo`; `appInstances` are
    re-derived per effective zone so the resource stays self-consistent.
  version: "wip"
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: "{apiRoot}/edge-application-management/vwip"
    variables:
      apiRoot:
        default: http://localhost:8080
        description: API root, e.g. the CamaraSim base URL.

paths:
  /apps:
    post:
      operationId: submitApp
      summary: Submit (onboard) an application
      description: |
        Submits an `AppManifest` to onboard an application onto the operator's
        edge cloud. On success the application is registered and a `SubmittedApp`
        (`appId`) is returned.

        See the API description for the parameter-driven functional cases.
      security:
        - openId:
            - edge-application-management:apps:write
      parameters:
        - $ref: "#/components/parameters/XCorrelator"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppManifest"
      responses:
        "201":
          description: Application submitted; the minted `appId` is returned.
          headers:
            x-correlator:
              $ref: "#/components/headers/XCorrelator"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmittedApp"
              example:
                appId: 5e3a8c2f-1b4d-5a6e-8f90-2c1d3e4f5a6b
        "400":
          $ref: "../../shared/errors.yaml#/components/responses/InvalidArgument"
        "401":
          $ref: "../../shared/errors.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../../shared/errors.yaml#/components/responses/PermissionDenied"
        "409":
          description: The application already exists.
          headers:
            x-correlator:
              $ref: "#/components/headers/XCorrelator"
          content:
            application/json:
              schema:
                $ref: "../../shared/errors.yaml#/components/schemas/CamaraError"
              example:
                status: 409
                code: ALREADY_EXISTS
                message: App already exists
        "500":
          $ref: "../../shared/errors.yaml#/components/responses/Internal"
        "503":
          $ref: "../../shared/errors.yaml#/components/responses/Unavailable"
      x-camarasim-scenarios:
        description: >-
          `submitApp` is CamaraSim's first stateful Edge Application Management
          leg (docs/DESIGN.md §7). Two control planes drive the outcome: request
          validation and store state. The `appId` is minted deterministically
          from the app identity (`name` + `version` + `appProvider`) as an RFC
          4122 v5 UUID (SHA-256, no new dependency), so re-submitting the same
          application collides → `409 ALREADY_EXISTS`. Canonical
          EdgeApplicationManagement declares 400/401/403/409/500/503 here.
          Documented cut: the full `requiredResources` `oneOf` and nested
          `appRepo`/`componentSpec` item shapes are validated only for
          presence/non-emptiness.
        cases:
          - input: a valid `AppManifest`
            result: '201 — `{ appId }` (the manifest is persisted in memory)'
          - input: the same `AppManifest` submitted again (same name/version/appProvider)
            result: '409 ALREADY_EXISTS'
          - input: same app but a different `version`
            result: '201 — a distinct `appId`'
          - input: a missing required field (name/version/appProvider/packageType/appRepo/requiredResources/componentSpec)
            result: '400 INVALID_ARGUMENT'
          - input: '`name` not matching `^[A-Za-z][A-Za-z0-9_]{1,63}$`'
            result: '400 INVALID_ARGUMENT'
          - input: '`packageType` not one of QCOW2/OVA/CONTAINER/HELM/CSAR'
            result: '400 INVALID_ARGUMENT'
          - input: an empty `componentSpec` array
            result: '400 INVALID_ARGUMENT'
          - input: a body that is not valid JSON
            result: '400 INVALID_ARGUMENT'
    get:
      operationId: getApps
      summary: List onboarded applications
      description: |
        Lists every application previously onboarded with `submitApp`, as a JSON
        array of `AppManifestInfo` (each stored `AppManifest` with its minted
        `appId`) — the same representation `getApp` returns for a single app.

        See the API description for the parameter-driven functional cases.
      security:
        - openId:
            - edge-application-management:apps:read
      parameters:
        - $ref: "#/components/parameters/XCorrelator"
      responses:
        "200":
          description: The onboarded applications (possibly an empty array).
          headers:
            x-correlator:
              $ref: "#/components/headers/XCorrelator"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AppManifestInfo"
              examples:
                empty:
                  summary: Nothing onboarded yet (a list never 404s)
                  value: []
        "401":
          $ref: "../../shared/errors.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../../shared/errors.yaml#/components/responses/PermissionDenied"
        "500":
          $ref: "../../shared/errors.yaml#/components/responses/Internal"
        "503":
          $ref: "../../shared/errors.yaml#/components/responses/Unavailable"
      x-camarasim-scenarios:
        description: >-
          `getApps` lists every application onboarded by `submitApp`
          (docs/DESIGN.md §7). The apps are simulator-minted, not caller-chosen,
          so there is no reserved-error plane — the in-memory store is the only
          control plane. The response is the current store snapshot as an array
          of `AppManifestInfo` (each manifest + its `appId`), empty when nothing
          has been onboarded (a list never 404s). CamaraSim returns
          `AppManifestInfo` items so every listed app carries its addressable
          `appId`, mirroring the sibling list legs (`listAccesses`,
          `retrievePayments`) which return the same shape as their single read.
        cases:
          - input: after one or more `submitApp` calls
            result: '200 — an array of `AppManifestInfo`, one per onboarded app'
          - input: before anything has been onboarded
            result: '200 — an empty array (a list never 404s)'

  /apps/{appId}:
    get:
      operationId: getApp
      summary: Retrieve an onboarded application
      description: |
        Reads back an application previously onboarded with `submitApp`,
        returning its stored `AppManifest` together with the minted `appId`
        (an `AppManifestInfo`).

        See the API description for the parameter-driven functional cases.
      security:
        - openId:
            - edge-application-management:apps:read
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/XCorrelator"
      responses:
        "200":
          description: The onboarded application (its manifest plus the `appId`).
          headers:
            x-correlator:
              $ref: "#/components/headers/XCorrelator"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppManifestInfo"
        "401":
          $ref: "../../shared/errors.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../../shared/errors.yaml#/components/responses/PermissionDenied"
        "404":
          $ref: "../../shared/errors.yaml#/components/responses/NotFound"
        "500":
          $ref: "../../shared/errors.yaml#/components/responses/Internal"
        "503":
          $ref: "../../shared/errors.yaml#/components/responses/Unavailable"
      x-camarasim-scenarios:
        description: >-
          `getApp` reads back an application onboarded by `submitApp`
          (docs/DESIGN.md §7). The `appId` is an opaque, simulator-minted UUID
          (not caller-chosen), so there is no reserved-error plane — the
          in-memory store state is the only control plane. A known id returns the
          stored `AppManifest` with the `appId` merged in (`AppManifestInfo`); an
          unknown *or malformed* id is folded into `404 NOT_FOUND` (mirroring the
          other CamaraSim read legs). Canonical EdgeApplicationManagement declares
          400/401/403/404 here; CamaraSim folds the 400 malformed-path case into
          404 (documented deviation) and adds 500/503 from the shared error set.
        cases:
          - input: an `appId` returned by a prior `submitApp`
            result: '200 — the `AppManifestInfo` (the manifest + `appId`)'
          - input: a well-formed UUID that was never submitted
            result: '404 NOT_FOUND'
          - input: a malformed (non-UUID) `appId`
            result: '404 NOT_FOUND (the canonical 400 folded into 404)'
    delete:
      operationId: deleteApp
      summary: Delete an onboarded application
      description: |
        Deletes (de-boards) an application previously onboarded with `submitApp`,
        evicting its stored `AppManifest`. On success the application is removed
        and `204 No Content` is returned.

        See the API description for the parameter-driven functional cases.
      security:
        - openId:
            - edge-application-management:apps:delete
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/XCorrelator"
      responses:
        "204":
          description: The application was deleted.
          headers:
            x-correlator:
              $ref: "#/components/headers/XCorrelator"
        "401":
          $ref: "../../shared/errors.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../../shared/errors.yaml#/components/responses/PermissionDenied"
        "404":
          $ref: "../../shared/errors.yaml#/components/responses/NotFound"
        "500":
          $ref: "../../shared/errors.yaml#/components/responses/Internal"
        "503":
          $ref: "../../shared/errors.yaml#/components/responses/Unavailable"
      x-camarasim-scenarios:
        description: >-
          `deleteApp` de-boards an application onboarded by `submitApp`
          (docs/DESIGN.md §7). The `appId` is an opaque, simulator-minted UUID
          (not caller-chosen), so there is no reserved-error plane — the
          in-memory store state is the only control plane. A known id evicts its
          app and returns `204 No Content` (single-use); an unknown,
          already-deleted, *or malformed* id folds into `404 NOT_FOUND`
          (mirroring `getApp` and the sibling `deleteNetwork`/`deleteAccess`
          legs). Deletion is synchronous: CAMARA EdgeApplicationManagement's
          asynchronous `202 Accepted`/`DELETE_REQUESTED` form and any `sink`
          notification are a documented cut, mirroring every other CamaraSim
          delete leg (QoD `deleteSession`, `deleteNetwork`, `deleteAccess`).
        cases:
          - input: an `appId` returned by a prior `submitApp`
            result: '204 — the app is evicted from the store (a later `getApp` 404s)'
          - input: the same `appId` deleted a second time
            result: '404 NOT_FOUND (single-use eviction)'
          - input: a well-formed UUID that was never submitted
            result: '404 NOT_FOUND'
          - input: a malformed (non-UUID) `appId`
            result: '404 NOT_FOUND (the canonical 400 folded into 404)'

  /app-instances:
    post:
      operationId: createAppInstance
      summary: Instantiate an application onto an edge cloud zone
      description: |
        Instantiates an onboarded application (`appId`) onto a target edge cloud
        zone (`edgeCloudZoneId`). On success an `AppInstanceInfo` is returned with
        a minted `appInstanceId` and a `Location` header; instantiation is modelled
        as asynchronous (`202 Accepted`).

        See the API description for the parameter-driven functional cases.
      security:
        - openId:
            - edge-application-management:instances:write
      parameters:
        - $ref: "#/components/parameters/XCorrelator"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAppInstanceRequest"
      responses:
        "202":
          description: >-
            Application instance accepted for instantiation; the rendered
            `AppInstanceInfo` (with its minted `appInstanceId`) is returned.
          headers:
            x-correlator:
              $ref: "#/components/headers/XCorrelator"
            Location:
              description: URI of the created app instance resource.
              required: false
              schema:
                type: string
                format: uri
                example: >-
                  /edge-application-management/vwip/app-instances/6ec0bd7f-11c0-53da-975e-2a8ad9ebae0b
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppInstanceInfo"
        "400":
          $ref: "../../shared/errors.yaml#/components/responses/InvalidArgument"
        "401":
          $ref: "../../shared/errors.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../../shared/errors.yaml#/components/responses/PermissionDenied"
        "404":
          description: >-
            The referenced application (`appId`) or edge cloud zone
            (`edgeCloudZoneId`) does not exist.
          headers:
            x-correlator:
              $ref: "#/components/headers/XCorrelator"
          content:
            application/json:
              schema:
                $ref: "../../shared/errors.yaml#/components/schemas/CamaraError"
              example:
                status: 404
                code: NOT_FOUND
                message: No application found for the provided appId.
        "409":
          description: The application is already instantiated in the given edge cloud zone.
          headers:
            x-correlator:
              $ref: "#/components/headers/XCorrelator"
          content:
            application/json:
              schema:
                $ref: "../../shared/errors.yaml#/components/schemas/CamaraError"
              example:
                status: 409
                code: ALREADY_EXISTS
                message: Application already instantiated in the given Edge Cloud Zone
        "500":
          $ref: "../../shared/errors.yaml#/components/responses/Internal"
        "503":
          $ref: "../../shared/errors.yaml#/components/responses/Unavailable"
      x-camarasim-scenarios:
        description: >-
          `createAppInstance` instantiates an onboarded app onto a specific edge
          cloud zone (docs/DESIGN.md §7). Three control planes drive the outcome:
          request validation, a cross-reference against the app + zone stores, and
          store state. The `appInstanceId` is minted deterministically from the
          `(appId, edgeCloudZoneId)` pair (RFC 4122 v5 UUID, SHA-256, no new
          dependency), so re-instantiating the same app on the same zone collides →
          `409 ALREADY_EXISTS`. The reported `status` is a second plane: it follows
          the target zone's own catalog `edgeCloudZoneStatus`
          (active → ready, inactive → failed, unknown → instantiating). Canonical
          EdgeApplicationManagement declares 400/401/403/409/500/503 here (plus 404
          for the CamaraSim cross-reference). Documented cuts: `componentEndpointInfo`
          (no live workload), the `terminating`/`unknown` instance states (unreachable
          on create), and the `subscriptionRequest` status-change callback
          (accepted-not-applied).
        cases:
          - input: a valid request naming an onboarded `appId` and a catalog `edgeCloudZoneId` (an active zone)
            result: '202 — `AppInstanceInfo` with a minted `appInstanceId`, `status: ready`, and a `Location` header'
          - input: the same `appId` + `edgeCloudZoneId` again
            result: '409 ALREADY_EXISTS'
          - input: the same `appId` on a different catalog zone
            result: '202 — a distinct `appInstanceId`'
          - input: '`edgeCloudZoneId` naming an `inactive` catalog zone'
            result: '202 — `status: failed`'
          - input: '`edgeCloudZoneId` naming an `unknown`-status catalog zone'
            result: '202 — `status: instantiating`'
          - input: a well-formed `appId` that was never onboarded
            result: '404 NOT_FOUND'
          - input: a well-formed `edgeCloudZoneId` that is not in the catalog
            result: '404 NOT_FOUND'
          - input: a missing/blank `name`, or a `name` not matching `^[A-Za-z][A-Za-z0-9_]{1,63}$`
            result: '400 INVALID_ARGUMENT'
          - input: a missing or non-UUID `appId` / `edgeCloudZoneId` / `kubernetesClusterRef`
            result: '400 INVALID_ARGUMENT'
          - input: a body that is not valid JSON
            result: '400 INVALID_ARGUMENT'
