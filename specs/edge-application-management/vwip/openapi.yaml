          - input: '`?clusterRef=<known UUID>`'
            result: '200 — the single matching cluster'
          - input: '`?edgeCloudZoneId=<known zone UUID>`'
            result: '200 — the clusters hosted in that zone'
          - input: two or more filters together
            result: '200 — clusters matching all of them (AND)'
          - input: '`clusterRef` or `edgeCloudZoneId` not a valid UUID'
            result: '400 INVALID_ARGUMENT'
          - input: an unrecognised query parameter
