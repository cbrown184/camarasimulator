  /edge-cloud-zones:
    get:
      operationId: getEdgeCloudZones
      summary: Retrieve the available edge cloud zones
      description: |
        Returns the edge cloud zones the operator offers for application
        placement, as a JSON array. Narrow the result with the optional `region`
        / `status` filters.

        See the API description for the parameter-driven functional cases.
      security:
        - openId:
            - edge-application-management:edge-cloud-zones:read
      parameters:
        - name: region
          in: query
          required: false
          description: >-
            Filter to zones whose `edgeCloudRegion` matches this value exactly.
            An unknown region yields an empty array (a list never 404s).
          schema:
            type: string
            maxLength: 64
          example: us-east-1
        - name: status
          in: query
          required: false
          description: Filter to zones in this lifecycle state.
          schema:
            $ref: "#/components/schemas/EdgeCloudZoneStatus"
        - $ref: "#/components/parameters/XCorrelator"
      responses:
        "200":
          description: The edge cloud zones matching the criteria (possibly empty).
          headers:
            x-correlator:
              $ref: "#/components/headers/XCorrelator"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EdgeCloudZone"
              examples:
                catalog:
                  summary: The full zone catalog (no filter)
                  value:
                    - edgeCloudZoneId: 6ec0bd7f-11c0-53da-975e-2a8ad9ebae0b
                      edgeCloudZoneName: camarasim-edge-eu-west-1
                      edgeCloudZoneStatus: active
                      edgeCloudProvider: CamaraSim Edge
                      edgeCloudRegion: eu-west-1
                empty:
                  summary: No zone matches the filter
                  value: []
        "400":
          $ref: "../../shared/errors.yaml#/components/responses/InvalidArgument"
        "401":
          $ref: "../../shared/errors.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../../shared/errors.yaml#/components/responses/PermissionDenied"
        "429":
          $ref: "../../shared/errors.yaml#/components/responses/TooManyRequests"
        "500":
          $ref: "../../shared/errors.yaml#/components/responses/Internal"
        "503":
          $ref: "../../shared/errors.yaml#/components/responses/Unavailable"
      x-camarasim-scenarios:
        description: >-
          The result is the fixed edge-cloud-zone catalog filtered by
          `region`/`status` (docs/DESIGN.md §7). There is no device identifier,
          so no reserved-error plane applies. Canonical EdgeApplicationManagement
          declares 400/401/403/500/503 here; 429 is a CamaraSim extension from the
          shared error set. Note: the canonical `EdgeCloudZones` schema declares
          `minItems: 1`; CamaraSim relaxes it so a filter narrowing to zero returns
          `[]` (a list never 404s) — a documented deviation.
        cases:
          - input: no query parameters
            result: '200 — the whole zone catalog'
          - input: '`?region=<known>`'
            result: '200 — the zones in that region'
          - input: '`?region=<unknown>`'
            result: '200 — an empty array (a list never 404s)'
          - input: '`?status=active|inactive|unknown`'
            result: '200 — zones in that lifecycle state'
          - input: '`region` and `status` together'
            result: '200 — zones matching both (AND)'
          - input: '`status` not one of the three enum values'
            result: '400 INVALID_ARGUMENT'
          - input: an unrecognised query parameter
            result: '400 INVALID_ARGUMENT'

