# CamaraSim — Network Access Devices, API version vwip
# (CAMARA NetworkAccessManagement / Network Access Devices, wip).
#
# Vendored from the CAMARA NetworkAccessManagement "Network Access Devices" API
# (work-in-progress — no released version yet, so mounted at its canonical `vwip`
# base path `/network-access-devices/vwip`, like the other pre-1.0 wip APIs) and
# annotated with CamaraSim's parameter-driven functional cases (docs/DESIGN.md
# §7, §9). Backed by `src/apis/network_access_devices/vwip.rs`; spec and code must
# not drift.
#
# Serves `GET /network-access-devices` (list the operator-supplied network access
# devices associated with the subscriber) and
# `GET /network-access-devices/{networkAccessDeviceId}` (read one of those devices
# by id). CamaraSim's device set is deterministic from the token subject, so the
# by-id read regenerates the set and looks the id up — it needs no store (a
# simplification of CAMARA's stateful resource read). The reboot-request resource
# lifecycle (`POST/GET/PATCH/DELETE /reboot-requests…`) is stateful and remains
# deferred to a later pass (documented cut).
openapi: 3.0.3
info:
  title: Network Access Devices
  description: |
    Service for managing network-operator-supplied **Network Access Devices**
    (gateways, routers, and access points) — operator-managed infrastructure, not
    end-user equipment. This endpoint lets an authorised consumer enumerate the
    equipment associated with the subscriber; each device reports a
    `deviceStatus` (`connected` / `disconnected` / `unavailable`) alongside
    identifying detail (name, description, and hardware address).

    This is the CamaraSim reference double for the CAMARA NetworkAccessManagement
    "Network Access Devices" API (wip). `GET /network-access-devices` requires the
    `network-access-devices:reboot` scope.

    ## Identifier resolution — the token subject

    The listing has no request body: the devices returned are those associated
    with the subscriber the access token was issued for, so the token **subject**
    (`sub`) is the sole identifier and the sole control plane (mirrors Number
    Verification's `GET /device-phone-number`). A two-legged `client_credentials`
    token's subject is its `client_id`; a three-legged token's subject is the
    authenticated line.

    ## Functional cases — the input is the control plane (docs/DESIGN.md §7)

    The response is chosen deterministically from the token subject:

    - **Reserved error suffix (subject).** If the subject's trailing three digits
      name a reserved CAMARA status, the endpoint answers with that canonical
      CAMARA error (shared convention — see the referenced `errors.yaml`):
      `…400`, `…401`, `…403`, `…404`, `…409`, `…422`, `…429`, `…500`, `…503`.
    - **Device set (subject digits).** Otherwise the subject's trailing three
      digits `d` (`000`–`999`; every reserved suffix is `≥ 400`, so all small `d`
      are free), or `0` when the subject has no digits, drive **two** facets of
      the returned list:
        - **count** — `d == 0` → a single device; otherwise `((d - 1) % 3) + 1`
          devices (1–3).
        - **per-device status** — device `i` (0-based) reports
          `["connected", "disconnected", "unavailable"][(d + i) % 3]`.
      So `…000` (or a no-digit subject) is one healthy `connected` gateway,
      `…002` gives two devices starting `unavailable`, and `…003` gives three.
      Each device's `id` (UUID-shaped) and `hardwareAddress` (EUI-48) are
      deterministic from the subject and the device index (SHA-256).

    Example: a subject ending `000` → `[{ deviceStatus: connected, … }]`; ending
    `002` → two devices `[unavailable, connected]`; ending `404` → `404
    NOT_FOUND`.

    CamaraSim exposes the full shared reserved-error set here so every reserved
    suffix is reachable; canonical Network Access Devices (wip) declares a subset
    (400/401/403/404/500/503).

    ## Documented cuts

    - **`serviceSite`** and the inherited Commonalities `Device` end-user
      identifier fields (`phoneNumber`/`networkAccessIdentifier`/`ipv4Address`/
      `ipv6Address`) are omitted: these are operator-managed devices, and the
      simulator reports only their operator-facing detail. Only `id` is required
      by the schema, so this is a schema-valid trim (DESIGN §9).
    - The per-device `GET /network-access-devices/{networkAccessDeviceId}` read is
      implemented **statelessly**: the subscriber's device set is deterministic
      from the token subject, so the read regenerates that set and returns the
      device whose `id` matches. An id that is not in the subject's set — unknown,
      belonging to another subscriber, or malformed — is a `404 NOT_FOUND` (there
      is no store to tell those cases apart). This is a documented simplification
      of CAMARA's stateful resource read.
    - The **reboot-request** resource lifecycle
      (`POST/GET/PATCH/DELETE /reboot-requests…`) is stateful and not yet
      implemented.
  version: "wip"
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: "{apiRoot}/network-access-devices/vwip"
    variables:
      apiRoot:
        default: http://localhost:8080
        description: API root, e.g. the CamaraSim base URL.

paths:
  /network-access-devices:
    get:
      operationId: getNetworkAccessDevices
      summary: Get all Network Access Devices associated with the subscriber
      description: |
        Lists the operator-supplied Network Access Devices associated with the
        subscriber the access token authenticated.

        The subscriber is identified by the access-token subject (`sub`) — there
        is no request body. See the API description for the parameter-driven
        functional cases (the subject's trailing three digits drive the device
        count and each device's status; a reserved suffix selects a canonical
        CAMARA error).
      security:
        - openId:
            - network-access-devices:reboot
      parameters:
        - $ref: "#/components/parameters/XCorrelator"
      responses:
        "200":
          description: The list of network access devices for the subscriber.
          headers:
            x-correlator:
              $ref: "#/components/headers/XCorrelator"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkAccessDeviceList"
              examples:
                singleConnected:
                  summary: One connected gateway (happy-path default, `…000` tail)
                  value:
                    - id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                      deviceStatus: connected
                      name: Gateway-1
                      description: Operator-supplied network access gateway
                      hardwareAddress:
                        hardwareAddressType: EUI-48
                        value: "12:34:56:78:9A:BC"
                twoDevices:
                  summary: Two devices (`…002` tail)
                  value:
                    - id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                      deviceStatus: unavailable
                      name: Gateway-1
                      description: Operator-supplied network access gateway
                      hardwareAddress:
                        hardwareAddressType: EUI-48
                        value: "AB:CD:EF:12:34:56"
                    - id: 123e4567-e89b-12d3-a456-426614174000
                      deviceStatus: connected
                      name: Gateway-2
                      description: Operator-supplied network access gateway
                      hardwareAddress:
                        hardwareAddressType: EUI-48
                        value: "0A:1B:2C:3D:4E:5F"
        "400":
          $ref: "../../shared/errors.yaml#/components/responses/InvalidArgument"
        "401":
          $ref: "../../shared/errors.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../../shared/errors.yaml#/components/responses/PermissionDenied"
        "404":
          $ref: "../../shared/errors.yaml#/components/responses/NotFound"
        "409":
          $ref: "../../shared/errors.yaml#/components/responses/Conflict"
        "422":
          $ref: "../../shared/errors.yaml#/components/responses/ServiceNotApplicable"
        "429":
          $ref: "../../shared/errors.yaml#/components/responses/TooManyRequests"
        "500":
          $ref: "../../shared/errors.yaml#/components/responses/Internal"
        "503":
          $ref: "../../shared/errors.yaml#/components/responses/Unavailable"
      x-camarasim-scenarios:
        description: >-
          Result selected from the token subject (docs/DESIGN.md §7). The
          subject's trailing three digits drive the device count and each
          device's status; reserved error suffixes come from the shared
          convention in errors.yaml.
        cases:
          - input: subject ending in a reserved error suffix (e.g. …404, …429)
            result: the canonical CAMARA error for that status
          - input: "subject trailing digits …000 (or a subject with no digits)"
            result: "200 — one connected device"
          - input: "subject trailing digits …001"
            result: "200 — one disconnected device"
          - input: "subject trailing digits …002"
            result: "200 — two devices [unavailable, connected]"
          - input: "subject trailing digits …003"
            result: "200 — three devices [connected, disconnected, unavailable]"

  /network-access-devices/{networkAccessDeviceId}:
    get:
      operationId: getNetworkAccessDevice
      summary: Get a single Network Access Device by id
      description: |
        Reads one of the subscriber's Network Access Devices by its id.

        CamaraSim's device set is deterministic from the access-token subject
        (`sub`); this read regenerates that set and returns the device whose `id`
        matches the path parameter, so — unlike CAMARA's stateful resource read —
        it needs no store. See the API description for the parameter-driven
        functional cases.

        Two control planes (docs/DESIGN.md §7):

        - **Reserved error suffix (subject).** As for the listing, a subject whose
          trailing three digits name a reserved CAMARA status answers that
          canonical error, regardless of the id (an account-level plane).
        - **The id vs the subject's set.** An id that belongs to the subject's
          deterministic set → `200` with that device; any other id (unknown,
          another subscriber's, or malformed) → `404 NOT_FOUND`.
      security:
        - openId:
            - network-access-devices:reboot
      parameters:
        - $ref: "#/components/parameters/XCorrelator"
        - name: networkAccessDeviceId
          in: path
          required: true
          description: The unique identifier (UUID) of the Network Access Device.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The requested network access device.
          headers:
            x-correlator:
              $ref: "#/components/headers/XCorrelator"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkAccessDevice"
              examples:
                connectedGateway:
                  summary: One connected gateway
                  value:
                    id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                    deviceStatus: connected
                    name: Gateway-1
                    description: Operator-supplied network access gateway
                    hardwareAddress:
                      hardwareAddressType: EUI-48
                      value: "12:34:56:78:9A:BC"
        "400":
          $ref: "../../shared/errors.yaml#/components/responses/InvalidArgument"
        "401":
          $ref: "../../shared/errors.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../../shared/errors.yaml#/components/responses/PermissionDenied"
        "404":
          $ref: "../../shared/errors.yaml#/components/responses/NotFound"
        "409":
          $ref: "../../shared/errors.yaml#/components/responses/Conflict"
        "422":
          $ref: "../../shared/errors.yaml#/components/responses/ServiceNotApplicable"
        "429":
          $ref: "../../shared/errors.yaml#/components/responses/TooManyRequests"
        "500":
          $ref: "../../shared/errors.yaml#/components/responses/Internal"
        "503":
          $ref: "../../shared/errors.yaml#/components/responses/Unavailable"
      x-camarasim-scenarios:
        description: >-
          Result selected from the token subject and the path id (docs/DESIGN.md
          §7). A reserved subject suffix answers a canonical CAMARA error
          (account-level); otherwise the id is matched against the subject's
          deterministic device set.
        cases:
          - input: subject ending in a reserved error suffix (e.g. …404, …503)
            result: the canonical CAMARA error for that status (id ignored)
          - input: an id that belongs to the subject's device set
            result: "200 — that NetworkAccessDevice"
          - input: an unknown / another subscriber's / malformed id
            result: "404 NOT_FOUND"

components:
  securitySchemes:
    openId:
      $ref: "../../auth/openapi.yaml#/components/securitySchemes/camaraOAuth"

  parameters:
    XCorrelator:
      name: x-correlator
      in: header
      required: false
      description: Correlation id for the request, echoed back on the response.
      schema:
        type: string

  headers:
    XCorrelator:
      description: The `x-correlator` from the request, echoed if one was sent.
      required: false
      schema:
        type: string

  schemas:
    NetworkAccessDevice:
      type: object
      additionalProperties: false
      description: |
        An operator-supplied network access device (gateway, router, or access
        point). Operator-managed infrastructure — not end-user equipment. Only
        `id` is required; CamaraSim also reports `deviceStatus`, `name`,
        `description`, and `hardwareAddress`. The Commonalities `Device` end-user
        identifier fields and `serviceSite` are omitted for these operator
        devices (a documented, schema-valid cut).
      required:
        - id
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: The unique identifier of the device (UUID).
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: The name of the device.
          example: Gateway-1
        description:
          type: string
          minLength: 0
          maxLength: 255
          description: A description of the device.
          example: Operator-supplied network access gateway
        hardwareAddress:
          description: The hardware address of the device.
          type: object
          additionalProperties: false
          required:
            - hardwareAddressType
            - value
          properties:
            hardwareAddressType:
              type: string
              enum:
                - EUI-48
              example: EUI-48
            value:
              type: string
              pattern: "^([0-9A-Fa-f]{2}[:-]){5}([0-9A-Fa-f]{2})$"
              maxLength: 17
              example: "12:34:56:78:9A:BC"
        deviceStatus:
          type: string
          enum:
            - connected
            - disconnected
            - unavailable
          default: unavailable
          description: The current status of the device.
          example: connected

    NetworkAccessDeviceList:
      type: array
      description: A list of network access devices.
      maxItems: 100
      items:
        $ref: "#/components/schemas/NetworkAccessDevice"
