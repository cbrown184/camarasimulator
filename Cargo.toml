[package]
name = "camarasimulator"
version = "0.0.1"
edition = "2021"
description = "A virtual CAMARA operator for testing telecom API integrations"
license = "Apache-2.0"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

# Optimise the release binary for size (see docs/DESIGN.md §11).
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
