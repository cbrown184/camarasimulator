[package]
name = "camarasimulator"
version = "0.0.1"
edition = "2021"
description = "A virtual CAMARA operator for testing telecom API integrations"
license = "Apache-2.0"

[dependencies]
axum = "0.7"
# `io-util` supplies the `AsyncWriteExt`/`AsyncReadExt` extension traits used to
# POST QoD CloudEvents notifications over a raw TCP stream (no HTTP-client dep);
# it is already compiled transitively by axum, so it adds no binary size.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Auth signing keys: parse the bundled PKCS#8 RSA key and expose its public
# components as a JWK. Pure Rust (no OpenSSL); `jsonwebtoken` will reuse this
# same key to sign tokens in a later pass (see docs/DESIGN.md §4, §6).
rsa = { version = "0.9", features = ["pem"] }
base64 = "0.22"
# RS256 JWT signing: SHA-256 for the RSASSA-PKCS1-v1_5 signature over the token's
# signing input. Pure Rust (RustCrypto), shares `digest`/`signature` traits with
# `rsa`, and is far smaller than pulling in `jsonwebtoken` + `ring`/OpenSSL. The
# `oid` feature supplies the DigestInfo prefix RS256 requires (see DESIGN §6, §11).
sha2 = { version = "0.10", features = ["oid"] }
# Parse the token endpoint's `application/x-www-form-urlencoded` body with full
# control over OAuth2 error responses. Already compiled transitively by axum's
# `Form`, so this adds no binary size — it only makes the dependency direct.
serde_urlencoded = "0.7"
# TLS client for `https://` CloudEvents notification sinks (QoD, DESIGN §11 —
# "prefer rustls over OpenSSL to stay static and small"). Default features are
# disabled to select the `ring` crypto provider instead of the default
# `aws-lc-rs`, which needs a C toolchain (cmake + compiler) — `ring` ships
# pre-built assembly and keeps the build self-contained. Notifications are still
# written directly over the (TLS-wrapped) stream, so no HTTP-client dep is added.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
# The Mozilla root CA bundle as static data, so `https://` sink verification needs
# no access to the host's certificate store (single-node, self-contained).
webpki-roots = "0.26"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
# Generate a throwaway self-signed cert for the end-to-end `https://` sink test.
# `ring` backend (not the default `aws_lc_rs`) to match the runtime and avoid a C
# toolchain. Dev-only — it never enters the release binary.
rcgen = { version = "0.13", default-features = false, features = ["ring"] }

# Optimise the release binary for size (see docs/DESIGN.md §11).
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
